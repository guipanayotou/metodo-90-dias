>. Nada que entrar no ar depois do dia 70 dá tempo de ser medido neste ciclo.</p>\n\n<p>A unidade de trabalho aqui não é a página. É a <strong>rede de lugares onde a sua marca é mencionada</strong> — e ela pesa mais do que quase todo mundo imagina.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">O que anda junto com aparecer nos resumos de IA do Google</p><p class="mn-fig-s">Correlação medida em 75 mil marcas. Escala de 0 a 1.</p><div class="mn-bar"><span>Menções no YouTube</span><i style="width:73.7%"></i><b>0,737</b></div><div class="mn-bar"><span>Menções na web em geral</span><i style="width:66.4%"></i><b>0,664</b></div><div class="mn-bar"><span>Links com o nome da marca</span><i style="width:52.7%"></i><b>0,527</b></div><div class="mn-bar"><span>Buscas pelo nome da marca</span><i style="width:39.2%"></i><b>0,392</b></div><div class="mn-bar neu"><span>Backlinks (o que o SEO clássico persegue)</span><i style="width:21.8%"></i><b>0,218</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> ser <b>falado</b> anda muito mais junto com aparecer na IA do que ser <b>linkado</b>. Isso inverte a prioridade de orçamento da maioria das agências, que ainda vende link.\n <span class="mn-src"><b>Cuidado com a leitura.</b> Correlação não é causa. Marcas grandes naturalmente têm mais menções <em>e</em> mais visibilidade — a causa por baixo pode ser simplesmente o tamanho da marca. <span class="mn-mid">Inferência</span> A direção é consistente o bastante para priorizar menção sobre link, mas não sustenta a promessa de que “comprar menções faz você aparecer”. Fonte: Ahrefs, 75 mil marcas.</span></p></div>\n\n <ol>\n <li><b>Vídeo com transcrição.</b> É a correlação mais alta da tabela e a menos disputada em português. Um vídeo por semana respondendo a uma pergunta real da carteira.</li>\n <li><b>Entrar nas listas “melhores X em Y”.</b> São as páginas que a IA lê para montar indicação. Descubra quais são: elas estão na lista de fontes que você coletou no Teste B da Parte 4.</li>\n <li><b>Programa de avaliações.</b> Volume e recência importam. Peça avaliação no momento de maior satisfação, e responda a todas — inclusive as ruins, especialmente as ruins.</li>\n <li><b>Presença editorial de terceiros.</b> Uma matéria, um podcast, uma participação. Não precisa de veículo grande; precisa ser conteúdo que a IA consiga ler e atribuir.</li>\n </ol>\n\n <div class="mn-bl">\n <p class="mn-lbl">O QUE NÃO FAZER NESTA FASE</p>\n <h4>Comprar menção é o caminho mais rápido para o filtro de spam</h4>\n <p>Os mesmos filtros antispam da busca comum se aplicam às respostas de IA — está na documentação oficial do Google. E existe um agravante estrutural: quanto mais gente adota a mesma tática, menor o ganho de cada um. Num teste com 54 combinações de método e setor, só <b>3</b> foram positivas de forma significativa.</p>\n </div>',ta:['T14','T15'],mo:'m4'},{id:'s66',t:'6.6 Fase 4 — Ler o resultado D76 a D90',h:'<p>A fase mais curta e a mais fácil de estragar. Antes do dia 76 a janela não sustenta conclusão.</p>\n\n <ol>\n <li><b>Consolide o painel.</b> Taxa de detecção, cobertura de perguntas, presença de domínio e fidelidade — cada um com a faixa e o número de rodadas. <i>(D76–85)</i></li>\n <li><b>Compare o ponto de partida com a janela de 24 dias.</b> Nunca semana contra semana: a variação natural do canal é maior que quase todo efeito real.</li>\n <li><b>Teste a diferença pelas faixas.</b> Se elas se tocam, a resposta honesta é “ainda não dá para afirmar”. A calculadora da seção 5.5 faz a conta.</li>\n <li><b>Compare também os concorrentes.</b> Se todo mundo subiu, quem subiu foi a plataforma, não você.</li>\n <li><b>Separe validação de descoberta.</b> Perguntas com o nome da empresa quase sempre dão positivo e não medem visibilidade.</li>\n <li><b>Escreva o relatório de uma página</b> — cinco seções — e decida o próximo ciclo: repetir, ampliar ou parar. Escreva também o que não deu certo. <i>(D85–90)</i></li>\n </ol>\n\n <p>São três tarefas — com a coleta contínua — e o marco final: o <b>M4, no dia 90</b>.</p>\n\n <div class="mn-key">\n <p class="mn-lbl">O RESULTADO QUE NINGUÉM QUER ANUNCIAR</p>\n <h4>“Não deu para afirmar” é uma conclusão legítima</h4>\n <p>Se a diferença não sai da faixa de erro, o correto é dizer exatamente isso — e mostrar quantas rodadas seriam necessárias para conseguir afirmar. Um fornecedor que <b>nunca</b> entrega esse resultado em 90 dias, para nenhum cliente, provavelmente não está medindo: está narrando.</p>\n </div>',ta:['T16','T17','T18'],mo:'m4'},{id:'s67',t:'6.7 Quem faz o quê',h:'<p>Quatro papéis. Podem ser quatro pessoas ou duas acumulando funções — o que não pode é ficar sem dono.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Faz = executa. Aprova = decide. Apoia = fornece informação. Recebe = é informado.</caption>\n <thead><tr><th scope="col">Fase</th><th scope="col">Estrategista</th><th scope="col">Redator</th><th scope="col">Dev / Analytics</th><th scope="col">Cliente</th></tr></thead>\n <tbody>\n <tr><td><b>0.</b> Medir antes de mexer</td><td><span>Faz</span></td><td><span>—</span></td><td><span class="mn-ok">Faz</span></td><td><span class="mn-mid">Aprova</span></td></tr>\n <tr><td><b>1.</b> Fazer a IA ler</td><td><span class="mn-ok">Apoia</span></td><td><span>—</span></td><td><span>Faz</span></td><td><span class="mn-mid">Apoia</span></td></tr>\n <tr><td><b>2.</b> Fazer a IA escolher</td><td><span class="mn-ok">Aprova</span></td><td><span>Faz</span></td><td><span>—</span></td><td><span class="mn-mid">Apoia</span></td></tr>\n <tr><td><b>3.</b> Existir fora do site</td><td><span>Faz</span></td><td><span class="mn-ok">Apoia</span></td><td><span>—</span></td><td><span class="mn-mid">Faz</span></td></tr>\n <tr><td><b>4.</b> Ler o resultado</td><td><span>Faz</span></td><td><span>—</span></td><td><span class="mn-ok">Apoia</span></td><td><span class="mn-mid">Recebe</span></td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>O papel que mais some.</b> “Cliente” não é figurante: o programa de avaliações e a informação real sobre preço e serviço só saem de dentro da empresa. Projeto sem dono do lado do cliente trava na Fase 3.</div>',ta:['T17','T18']},{id:'s68',t:'6.8 Esforço e custo',h:'<p>Dimensionamento para um negócio de porte médio, um mercado, um idioma.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Dedicação por fase, em fração de uma pessoa em tempo integral. <span class="mn-mid">Estimativa</span> Números de planejamento, não de contrato.</caption>\n <thead><tr><th scope="col">Fase</th><th scope="col">Estrategista</th><th scope="col">Redator</th><th scope="col">Dev</th><th scope="col">Cliente</th></tr></thead>\n <tbody>\n <tr><td><b>0.</b> D1–21</td><td class="mn-num">0,3</td><td class="mn-num">—</td><td class="mn-num">0,4</td><td class="mn-num">0,05</td></tr>\n <tr><td><b>1.</b> D15–45</td><td class="mn-num">0,2</td><td class="mn-num">—</td><td class="mn-num">0,4</td><td class="mn-num">0,1</td></tr>\n <tr><td><b>2.</b> D30–70</td><td class="mn-num">0,2</td><td class="mn-num">0,5</td><td class="mn-num">0,05</td><td class="mn-num">0,1</td></tr>\n <tr><td><b>3.</b> D45–90</td><td class="mn-num">0,3</td><td class="mn-num">0,2</td><td class="mn-num">—</td><td class="mn-num">0,15</td></tr>\n <tr><td><b>4.</b> D76–90</td><td class="mn-num">0,15</td><td class="mn-num">—</td><td class="mn-num">0,1</td><td class="mn-num">—</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-box">\n <p class="mn-lbl">ONDE O DINHEIRO REALMENTE VAI</p>\n <h4>A ferramenta é o item mais barato do projeto</h4>\n <p>Com o protocolo padrão — 30 perguntas, 3 motores, 7 rodadas por dia — dá cerca de <b>19 mil rodadas por mês</b>. Rodando por API própria, isso costuma custar algumas centenas de reais mensais; em ferramenta pronta, os planos que <em>realmente</em> permitem esse volume não são os de entrada. <span class="mn-mid">Estimativa</span> Use a calculadora da seção 5.3 com o seu custo por consulta.</p>\n <p>O custo dominante é <b>pessoa</b>: a Fase 2 sozinha consome meio redator por seis semanas. Qualquer proposta em que o painel custa mais que a execução está vendendo o item errado.</p>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">SE VOCÊ SÓ PUDER FAZER UMA COISA</p>\n <h4>Rode a Fase 0 e pare</h4>\n <p>Vinte perguntas, sete repetições, catorze dias. Custa uma semana de trabalho de meio período e responde a pergunta que decide todo o resto: <b>qual dos três ramos da Parte 4 é o seu.</b> Sem isso, qualquer contrato de 90 dias é aposta. Com isso, você negocia sabendo o que está comprando — e consegue recusar o que não precisa.</p>\n </div>'}]},{id:'p7',tag:'PARTE 7',t:'Ferramentas',r:'Quanto custa, o que cada plano realmente entrega, e como decidir entre comprar pronto ou montar o seu.',s:[{id:'s71',t:'7.1 O que existe e quanto custa',h:'<p>Preços de tabela consultados em <b>setembro de 2026</b>. Este é o dado que envelhece mais rápido do manual — confira antes de decidir.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Planos de entrada. A última coluna é calculada: quantas consultas por dia seriam necessárias para atingir o piso estatístico da Parte 5 — 7 rodadas por pergunta, em 3 motores.</caption>\n <thead><tr><th scope="col">Ferramenta</th><th scope="col">Entrada</th><th scope="col">Perguntas incluídas</th><th scope="col">Repetições publicadas</th><th scope="col">Consultas/dia necessárias</th></tr></thead>\n <tbody>\n <tr><td><b>Rankscale</b></td><td class="mn-num">€20/mês</td><td>“ilimitado” no plano de entrada</td><td><span class="mn-no">Não divulga</span></td><td>—</td></tr>\n <tr><td><b>Otterly.ai</b> Lite</td><td class="mn-num">US$29/mês</td><td class="mn-num">15</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">315</td></tr>\n <tr><td><b>Peec AI</b></td><td class="mn-num">€75–89/mês</td><td class="mn-num">~25</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">525</td></tr>\n <tr><td><b>Semrush AI Toolkit</b></td><td class="mn-num">US$99/mês</td><td class="mn-num">~25</td><td>300 consultas/dia no total</td><td class="mn-num">525</td></tr>\n <tr><td><b>Profound</b> Starter</td><td class="mn-num">US$99/mês</td><td class="mn-num">50</td><td><b>1.500 respostas/mês</b> — dá 1 por pergunta por dia</td><td class="mn-num">1.050</td></tr>\n <tr><td><b>Scrunch AI</b></td><td class="mn-num">US$100–250/mês</td><td class="mn-num">~100</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">2.100</td></tr>\n <tr><td><b>AthenaHQ</b></td><td class="mn-num">US$295/mês</td><td>3.600 créditos/mês</td><td><span class="mn-no">Não divulga</span></td><td>—</td></tr>\n <tr><td><b>Otterly.ai</b> Premium</td><td class="mn-num">US$489/mês</td><td class="mn-num">400</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">8.400</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">DETALHE CARO QUE PASSA BATIDO</p>\n <h4>O motor que mais cita costuma ser cobrado à parte</h4>\n <p>Na Otterly.ai, os quatro motores inclusos em todos os planos são ChatGPT, AI Overviews, Perplexity e Copilot. <b>Google AI Mode, Gemini e Claude são complementos pagos</b>, de US$9 a US$439 por mês conforme o plano. Volte à figura da seção 1.4: o AI Mode responde por <b>54,3%</b> das citações medidas. Você pode assinar a ferramenta e continuar cego para a maior superfície do mercado.</p>\n </div>',ta:['T2']},{id:'s72',t:'7.2 A coluna que ninguém publica',h:'<p>Procurei a frequência de execução em três análises independentes do setor. Todas registram a mesma coisa: <strong>não divulgado</strong>.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><b>0 de 9</b><span>ferramentas comparadas publicam quantas rodadas fazem da mesma pergunta por dia</span></div>\n <div class="mn-bl"><b>1×</b><span>por dia é o que dá para calcular do único fornecedor que publica volume de respostas</span></div>\n <div class="mn-bl"><b>±37 pontos</b><span>é a faixa de erro de 1 rodada — a medição não distingue 20% de 60%</span></div>\n <div class="mn-bl"><b>7×</b><span>por dia é o piso publicado na literatura para a estimativa parar de balançar</span></div>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">A CONTA DA PROFOUND, PASSO A PASSO</p>\n <h4>50 perguntas, 1.500 respostas por mês</h4>\n <p>1.500 ÷ 50 = <b>30 respostas por pergunta por mês</b>. Trinta dias no mês. Portanto: <b>1 rodada por pergunta por dia</b>, somando todos os motores. É o plano de entrada da ferramenta mais capitalizada do setor, e ele roda exatamente na configuração que a figura 5.1 mostra ser não informativa.</p>\n <p>Isso não quer dizer que a ferramenta seja ruim. Quer dizer que <b>o plano de entrada não serve para provar resultado</b> — serve para acompanhar tendência grossa. Se o contrato promete comprovação, o plano precisa ser outro.</p>\n </div>\n\n <div class="mn-bl"><b>Por que ninguém publica.</b> <span class="mn-mid">Inferência</span> Repetição é o principal custo variável dessas ferramentas: cada rodada é uma chamada paga de API. Publicar o número transformaria a comparação em disputa de custo por consulta — e tornaria explícito que os planos baratos rodam pouco.</div>'},{id:'s73',t:'7.3 Comprar pronto ou montar o seu?',h:'<p>Não existe resposta única. Existe uma pergunta que resolve: <strong>você precisa provar resultado ou acompanhar tendência?</strong></p>\n\n <div class="mn-bl">\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que faz sentido</dt><dd class="mn-lead">Plano de entrada de US$20 a US$30, ou o teste manual grátis da seção 7.5. Nos dois casos você está comprando <b>direção</b>, não prova.</dd></div>\n <div class="mn-bl"><dt>O que exigir</dt><dd>Que o AI Mode do Google esteja incluso, e não como complemento pago. É a superfície que mais cita.</dd></div>\n <div class="mn-bl"><dt>Onde não gastar</dt><dd>Não pague por relatório semanal bonito. Com 1 rodada por pergunta, a linha que sobe e desce é ruído.</dd></div>\n <div class="mn-bl"><dt>Custo mensal</dt><dd><b>R$ 0 a R$ 200</b> <span class="mn-mid">Estimativa</span></dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>Por quê</dt><dd class="mn-lead">Nenhum plano de entrada permite 7 rodadas por pergunta por dia. Para chegar lá numa ferramenta pronta você entra no tier de centenas de dólares — e ainda assim não controla o protocolo.</dd></div>\n <div class="mn-bl"><dt>O que você ganha</dt><dd>Controle sobre rodadas, janela e denominador. Guarda a resposta bruta. E consegue responder “quantas rodadas?” sem desviar do assunto.</dd></div>\n <div class="mn-bl"><dt>O que você paga</dt><dd>Chamadas de API mais o tempo de quem monta. A arquitetura está na seção 7.4.</dd></div>\n <div class="mn-bl"><dt>Custo mensal</dt><dd><b>Centenas de reais em API</b>, para 30 perguntas × 3 motores × 7 rodadas <span class="mn-mid">Estimativa</span></dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que faz sentido</dt><dd class="mn-lead">A escala de perguntas e idiomas justifica o produto pronto. Mas não entregue a validação do resultado a quem vende o resultado.</dd></div>\n <div class="mn-bl"><dt>O que exigir por contrato</dt><dd>Número de rodadas por pergunta por dia, janela de agregação, e <b>acesso à resposta bruta</b>. Sem o texto original você não consegue reprocessar nem auditar.</dd></div>\n <div class="mn-bl"><dt>Auditoria paralela</dt><dd>Rode o seu próprio coletor em 20 perguntas críticas. Serve de controle: se os dois discordam muito, a diferença é o protocolo.</dd></div>\n <div class="mn-bl"><dt>Custo mensal</dt><dd><b>US$300 a US$800</b> em ferramenta, mais o coletor de auditoria <span class="mn-mid">Estimativa</span></dd></div>\n </dl>\n </div>\n </div>'},{id:'s74',t:'7.4 Montar o seu coletor',h:'<p class="mn-deep">A arquitetura é simples e não exige time de dados. Sete blocos.</p>\n\n \n\n <div class="mn-bl">\n <table>\n <caption>Esquema mínimo de três tabelas. Nomes ilustrativos.</caption>\n <thead><tr><th scope="col">Tabela</th><th scope="col">Guarda</th><th scope="col">Campos que não podem faltar</th></tr></thead>\n <tbody>\n <tr><td><span class="mn-num">perguntas</span></td><td>A carteira congelada</td><td>id, texto, intenção, cliente, idioma, cidade, data de congelamento</td></tr>\n <tr><td><span class="mn-num">rodadas</span></td><td>Uma linha por consulta</td><td>id, pergunta_id, motor, versão do modelo, data e hora, localização informada, <b>resposta bruta</b>, buscou_na_web (sim/não)</td></tr>\n <tr><td><span class="mn-num">leituras</span></td><td>O que o extrator concluiu</td><td>rodada_id, marca_apareceu, posição, domínios citados, tom, descrição correta (sim/não), versão do extrator</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>Por que “versão do extrator”.</b> Guardando a versão, você consegue reprocessar todo o histórico quando melhorar a lógica e comparar as duas leituras. Sem isso, cada melhoria no extrator cria uma quebra artificial na série.</div>',ta:['T2']},{id:'s75',t:'7.5 O que dá para fazer sem gastar nada',h:'<p>Antes de assinar qualquer coisa, este teste responde a pergunta mais importante — e custa uma tarde.</p>\n\n <ol>\n <li><b>Escolha 10 perguntas de descoberta.</b> Nada de perguntas com o nome da sua empresa.</li>\n <li><b>Abra uma janela anônima</b> e confira a localização que o navegador informa.</li>\n <li><b>Rode cada pergunta 7 vezes</b> em ChatGPT, Google AI Mode e Perplexity. São 210 consultas — cerca de três horas.</li>\n <li><b>Anote numa planilha:</b> uma linha por rodada, com pergunta, motor, se buscou na web, se a sua marca apareceu, e quais domínios foram citados.</li>\n <li><b>Calcule</b> em quantas das 210 você apareceu. Esse número, com a calculadora da seção 5.5, já é um baseline defensável.</li>\n </ol>\n\n <div class="mn-box">\n <p class="mn-lbl">ONDE ESSE MÉTODO QUEBRA</p>\n <h4>Serve para diagnosticar, não para acompanhar</h4>\n <p>Manual funciona bem para descobrir <b>qual dos três ramos da Parte 4 é o seu</b> — que é a decisão de maior valor do processo inteiro. O que ele não faz é rodar todo dia por 90 dias sem alguém perder a paciência. A partir do momento em que a medição vira rotina, ou você automatiza ou você compra. Fazer manualmente por três meses é o caminho mais caro dos três.</p>\n </div>',ta:['T2']}]},{id:'p8',tag:'PARTE 8',t:'Casos e metas defensáveis',r:'O que os casos publicados realmente mostram, o que dá para prometer sem esticar, e como auditar uma proposta antes de assinar.',s:[{id:'s81',t:'8.1 O melhor caso que existe, desmontado',h:'<p>Um estudo de 2026 acompanhou páginas tratadas e não tratadas num site real. É a evidência de campo mais forte disponível. Veja o que acontece com o número quando se desconta o que teria acontecido de qualquer jeito.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">De 5,7 vezes para 1,82 vez</p><p class="mn-fig-s">Aumento nas visitas vindas do ChatGPT, antes e depois do desconto.</p><p class="mn-fig-a">Cascata: aumento bruto de 5,7 vezes nas páginas tratadas; as páginas não tratadas subiram 3,5 vezes sozinhas; o ganho realmente atribuível é 1,82 vez, com intervalo de 1,31 a 2,54.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> o número que uma agência colocaria no slide é <b>5,7×</b>. O número honesto é <b>1,82×</b> — e mesmo esse vem com uma faixa larga e um teste de controle que não foi conclusivo. Quem promete cinco vezes está vendendo o crescimento da plataforma como se fosse trabalho seu.\n <span class="mn-src">Fonte: Watanabe &amp; Nakayashiki (2026), série temporal controlada. Sugestivo, não causalmente estabelecido.</span></p></div>'},{id:'s82',t:'8.2 Os casos que circulam, com a metodologia aberta',h:'<div class="mn-tw">\n <table>\n <caption>O resultado alegado vale pouco sem a coluna do meio.</caption>\n <thead><tr><th scope="col">Caso</th><th scope="col">O que alegam</th><th scope="col">Como foi medido</th><th scope="col">O que dá para aproveitar</th></tr></thead>\n <tbody>\n <tr><td><b>Watanabe &amp; Nakayashiki</b> (2026)</td><td>5,7× nas visitas vindas do ChatGPT</td><td><span class="mn-ok">Série temporal com grupo de comparação</span> Placebo temporal não conclusivo</td><td>O método de desconto. É o que transforma 5,7 em 1,82</td></tr>\n <tr><td><b>Rioja</b> (2026)</td><td>Citação de 10% para 46% em 6 semanas, em 50 termos</td><td><span class="mn-mid">Baseline de 3 semanas, janela anônima, repetição</span> Um site só, sem controle, autor interessado</td><td>A disciplina de medir antes. Não o percentual</td></tr>\n <tr><td><b>Casos de agência</b> (vários)</td><td>3,2× · +559% · 6× em testes gratuitos</td><td><span class="mn-no">Sem grupo de controle</span> As plataformas cresciam 30–50% por trimestre no período</td><td>Praticamente nada. Parte do ganho é a plataforma</td></tr>\n <tr><td><b>Aggarwal et al.</b> (KDD 2024)</td><td>“+40% de visibilidade”</td><td><span class="mn-no">Contexto fixo, documentos já entregues ao modelo</span></td><td>O mecanismo. Nunca o número como promessa</td></tr>\n <tr><td><b>Puerto et al.</b> (2025)</td><td>Resultado negativo: 3 de 54 combinações positivas</td><td><span class="mn-ok">1.900 buscas, 16.360 documentos, vários setores</span></td><td>O corretivo mais importante da área. Ganho erode com adoção</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">O TESTE DE UMA PERGUNTA</p>\n <h4>“O que aconteceu com as páginas que vocês não tocaram?”</h4>\n <p>Se a resposta for “não medimos”, o número apresentado é bruto e você não tem como saber quanto dele é trabalho. Essa única pergunta separa o caso de <b>1,82×</b> dos casos de <b>6×</b>.</p>\n </div>'},{id:'s83',t:'8.3 Metas que dá para assinar',h:'<p>Nenhuma delas é posição, porque posição não existe neste canal. Todas são faixas, porque faixa é o que a evidência sustenta.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Referências para 90 dias, partindo de um baseline medido. <span class="mn-mid">Estimativa</span> Faixas de planejamento, calibradas pela literatura — não garantias.</caption>\n <thead><tr><th scope="col">Situação inicial</th><th scope="col">Meta realista em 90 dias</th><th scope="col">O que <u>não</u> prometer</th></tr></thead>\n <tbody>\n <tr><td><b>Ramo C</b> — domínio nunca citado</td><td>Sair de zero e chegar a aparecer nas fontes em parte das perguntas. A taxa de detecção de marca pode continuar baixa</td><td>Qualquer número de detecção. Você ainda está resolvendo o gargalo anterior</td></tr>\n <tr><td><b>Ramo B</b> — citado como fonte, marca ausente</td><td>Cobertura de perguntas subindo para a faixa de <b>40% a 60%</b> em nicho geográfico</td><td>Prazo curto. O reparo tem atraso de 2 a 4 semanas para aparecer</td></tr>\n <tr><td><b>Ramo A</b> — já aparece pouco</td><td>Taxa de detecção subindo <b>além da faixa de erro</b> medida. É o critério, não um percentual fixo</td><td>Multiplicador. “Dobrar a detecção” não tem base na literatura</td></tr>\n <tr><td><b>Visitas vindas de IA</b></td><td>Da ordem de <b>1,3× a 2,5×</b>, depois de descontar o crescimento da plataforma</td><td>5× ou mais. Esse é o número bruto de um caso, não o efeito</td></tr>\n <tr><td><b>Fidelidade</b></td><td>Acima de <b>90%</b> das menções descrevendo a empresa corretamente</td><td>100%. A IA erra mesmo com dados consistentes</td></tr>\n </tbody>\n </table>\n </div>',ta:['T18']},{id:'s84',t:'8.4 Auditar uma proposta antes de assinar',h:'<p>Doze sinais de alerta. Três ou mais marcados e vale pedir esclarecimento por escrito antes de fechar.</p>',ir:['diag','Abrir as perguntas de auditoria']},{id:'s85',t:'8.5 As dez perguntas para fazer antes de contratar',h:'<p>Com a resposta que você deveria ouvir ao lado.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Se a resposta divergir muito da coluna da direita, peça a justificativa por escrito.</caption>\n <thead><tr><th scope="col">Pergunte</th><th scope="col">Resposta que sustenta</th></tr></thead>\n <tbody>\n <tr><td>1. Quantas rodadas vocês fazem de cada pergunta por dia?</td><td>“Sete ou mais, por motor.” Menos que isso precisa de justificativa</td></tr>\n <tr><td>2. Qual a janela de agregação do relatório?</td><td>“Pelo menos vinte e quatro dias corridos, rolante.” Semanal não sustenta decisão</td></tr>\n <tr><td>3. Quantas perguntas e quais intenções?</td><td>“Vinte a trinta, com descoberta, comparação, problema e validação separadas”</td></tr>\n <tr><td>4. Quais motores, e o AI Mode está incluso?</td><td>“Pelo menos três, com AI Mode incluído no preço”</td></tr>\n <tr><td>5. As rodadas em que a IA não buscou entram na conta?</td><td>“Entram no denominador.” Se não, o número está inflado</td></tr>\n <tr><td>6. Vocês medem concorrentes nas mesmas perguntas?</td><td>“Sim, os mesmos três, nas mesmas perguntas”</td></tr>\n <tr><td>7. Eu recebo a resposta bruta?</td><td>“Sim, exportável.” Sem isso não há auditoria possível</td></tr>\n <tr><td>8. O que vocês fazem se o resultado não sair da faixa de erro?</td><td>“Reportamos que não deu para afirmar e mostramos quantas rodadas faltariam”</td></tr>\n <tr><td>9. Qual foi o resultado do último cliente que <b>não</b> deu certo?</td><td>Qualquer resposta concreta. “Nunca aconteceu” é sinal de que não medem</td></tr>\n <tr><td>10. O que acontece nos primeiros 21 dias?</td><td>“Baseline. Não mexemos no site.” Quem começa escrevendo pulou o diagnóstico</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O ATALHO</p>\n <h4>Se você só puder fazer uma pergunta, faça a primeira</h4>\n <p>“Quantas rodadas por pergunta por dia?” é a única pergunta cuja resposta não dá para improvisar. Quem mede sabe o número de cabeça. Quem não mede desvia para o painel.</p>\n </div>',ta:['T18']}]},{id:'p9',tag:'PARTE 9',t:'Tendências',r:'Sete movimentos com evidência já publicada, e o que fazer em relação a cada um nos próximos 60 dias.',s:[{id:'s91',t:'9.1 O que já aconteceu',h:'<p>A linha do tempo importa porque explica a direção. Repare que os dois movimentos mais recentes são de <strong>monetização</strong>.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Doze meses que mudaram o canal</p><p class="mn-fig-s">Marcos verificáveis, com fonte primária quando existe.</p><p class="mn-fig-a">Linha do tempo: fevereiro de 2026, OpenAI começa a testar anúncios no ChatGPT nos Estados Unidos; maio de 2026, Google publica o guia oficial; I/O 2026, protocolo de comércio agêntico expandido; 11 de agosto de 2026, anúncios ficam ativos no Brasil; setembro de 2026, fechamento deste manual.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> o teste de anúncios começou nos EUA em fevereiro e, em <b>11 de agosto de 2026</b>, ficou ativo no Brasil, no Reino Unido, no México, no Japão e na Coreia do Sul — nos planos Free e Go; Plus, Pro, Business, Enterprise e Education seguem sem anúncios. Não é mais “o que vem por aí”: já está acontecendo no seu mercado.\n <span class="mn-src">Fontes: OpenAI (comunicado oficial sobre teste de anúncios); cobertura da expansão de 11/ago/2026; Google Search Central (guia de mai/2026).</span></p></div>'},{id:'s92',t:'9.2 As sete tendências',h:'<div class="mn-bl">\n <div class="mn-bl">\n <p>1</p>\n <h4>O AI Mode é o campo que decide</h4>\n <p><b>O dado:</b> 54,3% das citações medidas no setor de mídia. Mais que ChatGPT e Perplexity somados. E, ao contrário do resumo do topo, ali <b>ou você é citado ou não existe</b>.</p>\n <p><b>Faça em 60 dias:</b> separe a medição de AI Overviews e AI Mode. São superfícies diferentes com ecossistemas de fonte diferentes. E confira se a sua ferramenta cobre o AI Mode sem cobrar à parte.</p>\n </div>\n <div class="mn-bl">\n <p>2</p>\n <h4>Estar bem no Google já não prevê citação</h4>\n <p><b>O dado:</b> as páginas do top 10 respondiam por cerca de 76% das citações em meados de 2025 e por volta de 38% no início de 2026.</p>\n <p><b>Faça em 60 dias:</b> pare de usar posição como indicador aproximado. O que passou a pesar é relevância no nível do trecho e <b>consistência da informação entre fontes</b> — audite isso fora do site, não só dentro.</p>\n </div>\n <div class="mn-bl">\n <p>3</p>\n <h4>O espaço orgânico está sendo comprimido</h4>\n <p><b>O dado:</b> anúncios ativos no ChatGPT no Brasil desde agosto de 2026, nos planos gratuitos. O Google já roda anúncios dentro do resumo de IA.</p>\n <p><b>Faça em 60 dias:</b> trate a citação orgânica como ativo com prazo. <span class="mn-mid">Inferência</span> O padrão do orgânico do Google tende a se repetir: a camada paga cresce e a orgânica encolhe. Quem constrói posição agora paga menos por ela.</p>\n </div>\n <div class="mn-bl">\n <p>4</p>\n <h4>A compra acontece dentro da resposta</h4>\n <p><b>O dado:</b> protocolos de comércio agêntico em produção nos dois ecossistemas, lendo <b>feeds estruturados</b> direto. No I/O 2026 isso se estendeu a reserva de hotel e delivery local.</p>\n <p><b>Faça em 60 dias:</b> se você vende produto ou serviço agendável, a saúde do feed passa a determinar se você aparece. Zero produtos reprovados, atualização em 24h.</p>\n </div>\n <div class="mn-bl">\n <p>5</p>\n <h4>Sentimento substitui contagem</h4>\n <p><b>O dado:</b> só 51,5% das frases geradas eram totalmente sustentadas pela fonte citada. Contar aparições sem ler o que foi dito registra erro como acerto.</p>\n <p><b>Faça em 60 dias:</b> adicione classificação de tom ao seu coletor. É trivial de implementar e ainda é diferencial — a maioria dos painéis só conta.</p>\n </div>\n <div class="mn-bl">\n <p>6</p>\n <h4>Pergunta ativa a IA; termo não</h4>\n <p><b>O dado:</b> 13,7% de ativação de resumo de IA na média, contra 64,7% em buscas escritas como pergunta. Quase cinco vezes mais.</p>\n <p><b>Faça em 60 dias:</b> reorganize a arquitetura de conteúdo por perguntas reais. É a mesma lógica que o AI Mode usa quando quebra uma pergunta em várias.</p>\n </div>\n <div class="mn-bl">\n <p>7</p>\n <h4>Procedência do conteúdo</h4>\n <p><b>O dado:</b> o Google expandiu marcação de origem e credenciais de procedência na busca e no navegador.</p>\n <p><b>Faça em 60 dias:</b> nada de grande. <span class="mn-mid">Especulação</span> Se procedência verificável virar sinal de confiança na escolha de fontes, conteúdo com autoria certificada ganha vantagem estrutural. Vale monitorar, não vale investir pesado ainda.</p>\n </div>\n </div>\n\n <div class="mn-fig"><p class="mn-fig-t">A queda que sustenta a tendência 2</p><p class="mn-fig-s">Fatia das citações em resumos de IA que vinham de páginas do top 10 orgânico.</p><div class="mn-bar"><span>Meados de 2025</span><i style="width:76%"></i><b>~76%</b></div><div class="mn-bar"><span>Início de 2026</span><i style="width:38%"></i><b>~38%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> em pouco mais de meio ano, a fatia caiu pela metade. Reforço independente: <b>53%</b> dos domínios citados nos resumos de IA não estavam no top 10 orgânico daquela busca. Continuar tratando posição como termômetro de visibilidade em IA é medir a coisa errada.\n <span class="mn-src">Fontes: análises de citação em resumos de IA, 2025–2026; Ahrefs (sobreposição citação × orgânico).</span></p></div>'},{id:'s93',t:'9.3 O que monitorar daqui pra frente',h:'<div class="mn-bl">\n <table>\n <caption>Cinco sinais que mudariam as recomendações deste manual.</caption>\n <thead><tr><th scope="col">Sinal</th><th scope="col">Por que muda o jogo</th><th scope="col">Onde acompanhar</th></tr></thead>\n <tbody>\n <tr><td>Anúncios dentro das respostas <b>locais</b></td><td>Hoje não há compra de posição na resposta orgânica local. Se houver, o cálculo de retorno muda inteiro</td><td>Comunicados oficiais da OpenAI e do Google Ads</td></tr>\n <tr><td>Filtro contra conteúdo otimizado para IA</td><td>Já existe detecção publicada com F1 de 0,944. Se algum motor passar a filtrar, a camada persuasiva morre e sobra a estrutural</td><td>Documentação de spam do Google; anúncios dos motores</td></tr>\n <tr><td>Dados de citação <b>em português</b></td><td>Todo percentual deste manual vem de estudo em inglês. O primeiro benchmark sério em português recalibra tudo</td><td>Publicações acadêmicas e estudos de mercado nacionais</td></tr>\n <tr><td>Mudança na fonte de dados locais do ChatGPT</td><td>Ele lê Perfil da Empresa e bases de lugares. Trocar de fornecedor muda onde vale investir</td><td>Anúncios de parceria da OpenAI</td></tr>\n <tr><td>Cobrança pelo acesso de robôs</td><td>Se ler o seu site virar transação paga, a economia da citação muda para os dois lados</td><td>Padrões de licenciamento de conteúdo para IA</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">VALIDADE DESTE MATERIAL</p>\n <h4>Trate os números como perecíveis</h4>\n <p>Os dados foram fechados em <b>setembro de 2026</b>. Os achados experimentais — os quatro porteiros, as curvas de faixa de erro, a taxonomia de falhas — devem envelhecer bem, porque descrevem mecanismo. Já os percentuais de mercado, os preços de ferramenta e a lista de países com anúncios envelhecem em <b>meses</b>. Reveja em <b>março de 2027</b>.</p>\n </div>'}]},{id:'p10',tag:'PARTE 10',t:'Anexos',r:'Os modelos prontos. Esta parte é feita para ser impressa ou copiada, não lida.',s:[{id:'a1',t:'A1 · Checklist mestre das 12 semanas',h:'<p>As dezoito tarefas do plano e os itens que fecham cada um dos quatro marcos. O estado fica salvo no seu navegador.</p>',ir:['programa','Abrir o checklist das 12 semanas'],ta:['T1','T5','T17','T18']},{id:'a2',t:'A2 · Modelo da carteira de perguntas',h:'<p class="mn-deep">Copie a estrutura. Três formas de dizer cada necessidade, no máximo um quarto da carteira em validação.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Estrutura em branco. Meta: 20 a 30 linhas no total.</caption>\n <thead><tr><th scope="col">#</th><th scope="col">Intenção</th><th scope="col">Pergunta, escrita como o cliente fala</th><th scope="col">Cidade / idioma</th><th scope="col">Concorrentes a marcar</th></tr></thead>\n <tbody>\n <tr><td class="mn-num">01</td><td>Descoberta</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">02</td><td>Descoberta</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">03</td><td>Descoberta</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">…</td><td>Comparação</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">…</td><td>Problema</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">…</td><td>Validação <span class="mn-mid">máx. 25%</span></td><td>_______________________</td><td>________</td><td>________</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key"><p class="mn-lbl">E A FAIXA?</p><h4>A conta está no Anexo B do livro — e pronta aqui</h4><p>O livro traz a tabela de faixa de erro por número de rodadas e a fórmula (intervalo de Wilson a 95%, com n = rodadas ÷ 2). No app você não precisa dela: a aba <b>Medir</b> calcula a faixa a cada registro, com o mesmo fator de agrupamento. A regra de leitura é a mesma nos dois lugares — duas medições só diferem se as faixas não se tocam.</p></div>',ir:['carteira','Abrir a carteira de perguntas']},{id:'a3',t:'A3 · Modelo da matriz de diagnóstico',h:'<p class="mn-deep">Uma linha por pergunta da carteira. Preencher depois do baseline (D3–21, pelo menos 18 dias de coleta).</p>\n\n <div class="mn-bl">\n <table>\n <caption>É este documento — e não o painel — que define o trabalho das dez semanas seguintes.</caption>\n <thead><tr><th scope="col">Pergunta</th><th scope="col">Ativou busca?</th><th scope="col">Domínio citado?</th><th scope="col">Marca citada?</th><th scope="col">Ramo</th><th scope="col">Tipo de falha</th><th scope="col">Ação</th></tr></thead>\n <tbody>\n <tr><td>___________</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td>A · B · C</td><td>intenção · informação · data · local</td><td>___________</td></tr>\n <tr><td>___________</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td>A · B · C</td><td>intenção · informação · data · local</td><td>___________</td></tr>\n <tr><td>___________</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td>A · B · C</td><td>intenção · informação · data · local</td><td>___________</td></tr>\n </tbody>\n </table>\n </div>',ir:['diag','Abrir a matriz de diagnóstico']},{id:'a4',t:'A4 · Estrutura do relatório mensal',h:'<p class="mn-deep">Sete blocos. O sexto é o que separa relatório de peça de venda.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Estrutura mínima. Um relatório sem os blocos 4, 6 e 7 não permite auditoria.</caption>\n <thead><tr><th scope="col">#</th><th scope="col">Bloco</th><th scope="col">O que precisa estar escrito</th></tr></thead>\n <tbody>\n <tr><td class="mn-num">1</td><td>Protocolo</td><td>Número de perguntas, rodadas por dia, motores, janela de agregação, período coberto. <b>Sempre na primeira página</b></td></tr>\n <tr><td class="mn-num">2</td><td>Taxa de detecção</td><td>O número, com a faixa de erro de 95% ao lado. Comparado ao baseline, nunca ao mês anterior isolado</td></tr>\n <tr><td class="mn-num">3</td><td>Cobertura e fontes</td><td>Perguntas com pelo menos uma aparição, e presença do domínio nas citações</td></tr>\n <tr><td class="mn-num">4</td><td>Concorrentes</td><td>Os mesmos três, nas mesmas perguntas, no mesmo período</td></tr>\n <tr><td class="mn-num">5</td><td>Fidelidade e tom</td><td>Amostra de 30 menções, classificadas em correta, incompleta ou errada, e o tom</td></tr>\n <tr><td class="mn-num">6</td><td>O que não deu certo</td><td>Ações executadas sem efeito mensurável, e o que ficou de fora do prazo</td></tr>\n <tr><td class="mn-num">7</td><td>Decisão</td><td>Uma frase: seguir, ajustar ou parar — e o que sustenta a escolha</td></tr>\n </tbody>\n </table>\n </div>',ta:['T17','T18']},{id:'a5',t:'A5 · Bibliografia',h:'<p class="mn-deep">Oito trabalhos. Se for ler três, leia o primeiro, o segundo e o quinto.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Nível de evidência conforme a escada da seção 3.1.</caption>\n <thead><tr><th scope="col">Trabalho</th><th scope="col">Nível</th><th scope="col">Por que ler</th></tr></thead>\n <tbody>\n <tr><td><b>Martinez</b> (2026). <em>A Critical Survey of Generative Engine Optimization 2023–2026</em>. arXiv 2607.14035</td><td><span class="mn-ok">Revisão</span></td><td>A única síntese honesta da área. Hierarquia de confiança por afirmação e protocolo de medição</td></tr>\n <tr><td><b>Vishwakarma, Kumar e Jamidar</b> (SIGIR 2026). <em>What Gets Cited</em>. arXiv 2605.25517</td><td><span class="mn-ok">C</span></td><td>252 mil rodadas, 6 modelos, marcas anonimizadas. De onde vêm os quatro porteiros</td></tr>\n <tr><td><b>Schulte, Bleeker e Kaufmann</b> (2026). <em>Don\'t Measure Once</em>. arXiv 2604.07585</td><td><span class="mn-ok">B</span></td><td>Define o padrão de medição: 7 a 8 repetições, janela de 2 a 4 semanas. Código e dados públicos</td></tr>\n <tr><td><b>Tian et al.</b> (2026). <em>Diagnosing and Repairing Citation Failures</em>. arXiv 2603.09296</td><td><span class="mn-mid">C/D</span></td><td>A taxonomia de falhas que sustenta a Parte 4 inteira</td></tr>\n <tr><td><b>Puerto et al.</b> (2025). <em>C-SEO Bench</em></td><td><span class="mn-ok">B/C</span></td><td>O corretivo. Receita genérica quase não transfere, e o ganho erode com a adoção</td></tr>\n <tr><td><b>Kim et al.</b> (2026). <em>SAGEO Arena</em></td><td><span class="mn-ok">B</span></td><td>O único teste do caminho completo. Mostra que otimizar o texto pode piorar a recuperação</td></tr>\n <tr><td><b>Aggarwal et al.</b> (KDD 2024). arXiv 2311.09735</td><td><span class="mn-no">E</span></td><td>O trabalho fundacional. Leia sabendo que o “+40%” é condicional a um contexto fixo</td></tr>\n <tr><td><b>Google Search Central</b>. <em>Optimizing your website for generative AI features</em> (mai/2026)</td><td><span>Fonte primária</span></td><td>O que <b>não</b> fazer, dito pela própria plataforma</td></tr>\n </tbody>\n </table>\n </div>'},{id:'a6',t:'A6 · Nota metodológica',h:'<p>Como os números deste manual foram tratados, para você poder discordar com base.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Três origens diferentes, com pesos diferentes. Estão misturadas em todo material do mercado; aqui estão separadas.</caption>\n <thead><tr><th scope="col">Origem</th><th scope="col">Como aparece no texto</th><th scope="col">Quanto confiar</th></tr></thead>\n <tbody>\n <tr><td><b>Achado experimental</b><br>revisado ou aceito em conferência</td><td>Citado com autor e ano, e com o desenho do estudo descrito</td><td>Alto para o mecanismo. Menor para transferir o número ao seu caso</td></tr>\n <tr><td><b>Dado de mercado</b><br>de empresa que vende ferramenta do setor</td><td>Citado com a fonte nomeada</td><td>Direcional. Há incentivo comercial em números altos. Nunca use como meta</td></tr>\n <tr><td><b>Raciocínio próprio</b></td><td>Marcado com <span class="mn-mid">Inferência</span> ou <span class="mn-mid">Especulação</span></td><td>É opinião fundamentada, não evidência. Discorde à vontade</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O QUE ESTE MANUAL NÃO FAZ</p>\n <h4>Três limites honestos</h4>\n <p><b>1.</b> Quase todo estudo citado é em inglês, com dados dos Estados Unidos. Não existe, até setembro de 2026, benchmark público sólido sobre quais fontes a IA cita em perguntas feitas em português. Os percentuais são <b>direção</b>, não valores do seu setor.</p>\n <p><b>2.</b> Nenhuma técnica aqui tem efeito causal comprovado sobre receita. O que está sustentado é influência sobre citação, e mesmo essa varia por motor e ao longo do tempo.</p>\n <p><b>3.</b> O canal está sendo monetizado enquanto você lê. Um plano de doze meses aposta que a janela orgânica continua aberta — e essa aposta não está sob o seu controle.</p>\n </div>\n\n <div class="mn-box">\n <p class="mn-lbl">A FRASE QUE RESUME O MANUAL</p>\n <h4>O padrão-ouro não é uma técnica de escrita</h4>\n <p>É um ciclo de <b>diagnóstico e medição estatisticamente válido</b> aplicado sobre fundamentos de recuperação sólidos. Quem entrega isso tem um produto defensável. Quem entrega reescrita persuasiva com relatório de uma consulta por semana está vendendo ruído com aparência de gráfico.</p>\n </div>',ta:['T3']},{id:'a7',t:'A7 · Banco de prompts e a FICHA',h:'<p class="mn-lead">Os trinta pedidos prontos do livro, de P0 a P29, na ordem de uso. O texto completo, já preenchido com o seu negócio, está em Ferramentas › Assistente — é só copiar e colar.</p>\n<p>O ritual é sempre o mesmo: <b>P0</b> na primeira conversa (diagnóstico e FICHA v1), <b>P29</b> para retomar colando a FICHA, <b>P28</b> para fechar e receber a FICHA atualizada. A última coluna diz que seção da FICHA cada um alimenta.</p>\n<div class="mn-tw"><table>\n<thead><tr><th scope="col">#</th><th scope="col">Prompt</th><th scope="col">Quando usar</th><th scope="col">Salva na FICHA</th></tr></thead><tbody>\n<tr><td colspan="4"><b>Toda sessão</b></td></tr>\n<tr><td>P0</td><td>Abertura e diagnóstico básico</td><td>Primeira conversa. Diagnóstico básico e FICHA v1.</td><td>Seções 1, 2, 3, 12</td></tr>\n<tr><td>P29</td><td>Retomar a conversa</td><td>Início de toda sessão seguinte, colando a FICHA.</td><td>Lê tudo; não altera</td></tr>\n<tr><td>P28</td><td>Fechar a sessão</td><td>Fim de toda sessão.</td><td>Tudo o que mudou, com data</td></tr>\n<tr><td>P1</td><td>Explicar um trecho</td><td>Qualquer trecho que não ficou claro.</td><td>— (11, se virar decisão)</td></tr>\n<tr><td colspan="4"><b>Semana 1 · antes de medir</b></td></tr>\n<tr><td>P2</td><td>Ler a resposta de um motor</td><td>Depois do teste de dez minutos do Capítulo 1.</td><td>1 (concorrentes), 13</td></tr>\n<tr><td>P3</td><td>As seis etapas no meu caso</td><td>Para entender as seis etapas com o seu negócio.</td><td>6 (hipótese)</td></tr>\n<tr><td>P4</td><td>Os quatro porteiros numa página</td><td>Na página mais importante, antes de qualquer redação.</td><td>9, 12</td></tr>\n<tr><td>P6</td><td>Carteira de perguntas</td><td>Segunda-feira: o rascunho das 30 perguntas.</td><td>4 (ao “fechar”)</td></tr>\n<tr><td>P12</td><td>Meu calendário</td><td>Antes de começar, com o seu tempo real.</td><td>3, 2</td></tr>\n<tr><td>P8</td><td>Instrução para quem coleta</td><td>Se for delegar a coleta.</td><td>2</td></tr>\n<tr><td colspan="4"><b>Dias 1–21 · coleta e Fase 0</b></td></tr>\n<tr><td>P7</td><td>Isso conta como aparecer?</td><td>Primeira semana, sempre que ficar em dúvida se “conta”.</td><td>9 (se fidelidade = não)</td></tr>\n<tr><td>P23</td><td>Registrar a coleta</td><td>Uma vez por semana, com o resumo da coleta.</td><td>5, 13</td></tr>\n<tr><td>P5</td><td>Entender a faixa de erro</td><td>Quando o número parecer bom ou ruim demais.</td><td>—</td></tr>\n<tr><td>P10</td><td>Classificar o ramo</td><td>Dia 21, com uma passagem inteira pela carteira.</td><td>6, 3, 12</td></tr>\n<tr><td>P24</td><td>Leitura do marco</td><td>Em cada marco: M1 (21), M2 (45), M3 (70), M4 (90).</td><td>3, 11, 12</td></tr>\n<tr><td colspan="4"><b>Dias 15–45 · Fase 1, a IA conseguir ler você</b></td></tr>\n<tr><td>P25</td><td>As doze verificações</td><td>Depois de rodar as doze verificações do Capítulo 13.</td><td>7, 12</td></tr>\n<tr><td>P15</td><td>Ler o meu robots.txt</td><td>Verificação 4, com o robots.txt colado.</td><td>7</td></tr>\n<tr><td>P16</td><td>Explicar um relatório ou erro</td><td>Qualquer relatório ou erro de ferramenta.</td><td>7, 12</td></tr>\n<tr><td>P19</td><td>Ordenar os reparos</td><td>Com as reprovações em mãos: a ordem do reparo.</td><td>12</td></tr>\n<tr><td>P17</td><td>Mensagem para a hospedagem</td><td>Sem Cloudflare, ou quando a hospedagem precisa liberar robôs.</td><td>7</td></tr>\n<tr><td>P18</td><td>Dados estruturados</td><td>Verificação 9 reprovada, sem plugin que gere o bloco.</td><td>7</td></tr>\n<tr><td>P26</td><td>Perfil da Empresa, item por item</td><td>Perfil da Empresa, os quinze itens.</td><td>8</td></tr>\n<tr><td>P20</td><td>Descrição do Perfil da Empresa</td><td>Descrição do Perfil.</td><td>8</td></tr>\n<tr><td colspan="4"><b>Dias 30–70 · Fase 2, a IA escolher você</b></td></tr>\n<tr><td>P27</td><td>Minha página × a do concorrente</td><td>Quando um concorrente é citado no seu lugar.</td><td>9, 12</td></tr>\n<tr><td>P11</td><td>Reparo de uma página</td><td>Uma página por semana, pelo tipo de falha.</td><td>9, 12</td></tr>\n<tr><td>P21</td><td>Responder uma avaliação</td><td>A cada avaliação recebida.</td><td>8</td></tr>\n<tr><td>P22</td><td>Pedir avaliação</td><td>Ao montar o pedido de avaliação.</td><td>8</td></tr>\n<tr><td colspan="4"><b>Dias 76–90 · Fase 4, ler o resultado</b></td></tr>\n<tr><td>P9</td><td>Relatório mensal</td><td>No fim de cada ciclo de 24 dias.</td><td>10, 12</td></tr>\n<tr><td>P14</td><td>Meta realista para quem cobra</td><td>Para explicar a meta a sócio, chefe ou cliente.</td><td>11</td></tr>\n<tr><td>P13</td><td>Avaliar uma proposta</td><td>Antes de assinar qualquer ferramenta ou serviço.</td><td>11</td></tr>\n</tbody></table></div>',ta:['T2']}]},{id:'p11',tag:'COLETA',t:'A rotina e as dúvidas',r:'Como coletar, o que conta como aparecer, e as 24 dúvidas da primeira semana.',s:[{id:'d1',t:'A rotina de coleta, passo a passo',h:'<p class="mn-lead">Cinco perguntas por dia, três motores, sete rodadas cada. Quarenta minutos. É o que você faz quase todo dia, por noventa dias.</p>\n<h4>Preparação, uma vez só</h4>\n<ol>\n<li><b>Escolha o horário.</b> O mesmo todo dia. Rotina com hora fixa sobrevive; rotina “quando der” morre na segunda semana.</li>\n<li><b>Tenha os três motores à mão.</b> ChatGPT em chatgpt.com, sem login. Modo IA do Google: faça uma busca e clique na aba “Modo IA”. Perplexity em perplexity.ai, sem login. Se o Modo IA não aparecer na janela anônima, use uma conta do Google criada só para medir — e anote.</li>\n<li><b>Prepare a planilha</b> — ou use a tela Medir, que já vem pronta e mostra as perguntas de hoje.</li>\n<li><b>Imprima a carteira numerada.</b> Você vai copiar e colar, e é fácil pular uma.</li>\n</ol>\n<h4>O dia de coleta, minuto a minuto</h4>\n<ol>\n<li><b>Veja quais são as cinco perguntas de hoje.</b> Dia 1: perguntas 1 a 5. Dia 2: 6 a 10. No dia 7, volta para 1 a 5. Se perdeu um dia, retome de onde parou.</li>\n<li><b>Abra uma janela anônima.</b> Chrome: Ctrl+Shift+N (Cmd+Shift+N no Mac). Celular: “nova guia anônima”.</li>\n<li><b>Cole a pergunta exatamente como está na carteira.</b> Sem mudar uma palavra, sem cumprimentar. Espere a resposta inteira.</li>\n<li><b>Anote as duas coisas.</b> A sua marca aparece no texto? O seu site aparece nas fontes? E, em uma palavra, quem mais apareceu.</li>\n<li><b>Feche a janela e abra outra.</b> Rodada 2. Cada rodada é uma conversa nova, porque a anterior contamina a próxima. Até a rodada 7.</li>\n<li><b>Mesma pergunta, próximo motor.</b> Sete no Modo IA, sete no Perplexity. Depois a pergunta 2. Ao fim, 105 conversas.</li>\n<li><b>Confira antes de fechar.</b> Rodada em que a IA perguntou de volta não vale — refaça só ela.</li>\n</ol>\n<div class="mn-warn"><span class="mn-lbl">O que não fazer</span>Não use a mesma conversa para duas rodadas. Não faça a pergunta logado. Não “ajude” a IA com contexto. Não mude a redação porque a resposta veio estranha. Não pule a anotação “porque foi igual” — a igualdade é dado.</div>\n<div class="mn-key"><span class="mn-lbl">Três tamanhos</span><b>Mínimo:</b> 20 perguntas, 2 motores, 5 rodadas, 4 perguntas por dia — 15 a 20 min, erro ≈ ±5 pontos. <b>Padrão:</b> 30 perguntas, 3 motores, 7 rodadas, 5 por dia — 40 a 50 min, erro ≈ ±3. <b>Com API:</b> tudo, todo dia — erro ≈ ±1,5.</div>',ta:['T2','T3','T16'],mo:'m1',ir:['medir','Abrir a tela Medir']},{id:'d2',t:'Isso conta como aparecer?',h:'<p class="mn-lead">A dúvida que mais aparece na primeira semana. Duas colunas, duas anotações por rodada.</p>\n<h4>Marca no texto — o seu nome aparece na resposta?</h4>\n<ul>\n<li><span class="mn-ok">sim</span> Nome completo ou variação inequívoca (“Aurora Estética”).</li>\n<li><span class="mn-ok">sim</span> Aparece só para dizer que não recomenda — e anote fidelidade = não.</li>\n<li><span class="mn-ok">sim</span> Aparece numa lista de dez, em nono.</li>\n<li><span class="mn-no">não</span> Só o nome do concorrente.</li>\n<li><span class="mn-mid">refaça</span> A IA pergunta de volta em vez de responder: rodada inválida.</li>\n</ul>\n<h4>Site nas fontes — o seu site aparece entre os links?</h4>\n<ul>\n<li><span class="mn-ok">sim</span> O seu domínio em qualquer link ou fonte.</li>\n<li><span class="mn-ok">sim</span> Uma página sua citada com o nome errado no texto — e fidelidade = não.</li>\n<li><span class="mn-no">não</span> Só o seu Instagram ou o Perfil do Google (anote à parte).</li>\n<li><span class="mn-no">não</span> Nenhum link e nenhuma fonte na resposta.</li>\n<li><span class="mn-no">não</span> Um diretório que fala de você.</li>\n</ul>\n<div class="mn-key"><span class="mn-lbl">Anote também quem apareceu no seu lugar</span>Uma palavra por rodada. No fim de uma semana você tem a lista de quem a IA prefere quando você some — e essa lista é o começo do diagnóstico.</div>',ta:['T3'],mo:'m1',ir:['medir','Abrir a tela Medir']},{id:'d3',t:'Dúvidas: coleta e o que conta',h:'<p class="mn-lead">As dúvidas da primeira semana de coleta, respondidas sem rodeio.</p><div class="mn-box"><span class="mn-lbl">Preciso pagar o ChatGPT Plus ou o Perplexity Pro?</span><p>Não. Meça com a versão gratuita, sem login, porque é o que a maioria dos seus clientes usa. Versão paga responde diferente — e você não quer medir a resposta que só quem paga recebe.</p></div><div class="mn-box"><span class="mn-lbl">O que é exatamente “janela anônima”?</span><p>Uma janela do navegador que nasce sem histórico, sem login e sem cookies, e apaga tudo quando fecha. Chrome: Ctrl+Shift+N (Cmd+Shift+N no Mac). Safari: “Nova janela privada”. No celular, “nova guia anônima” no menu do navegador. Cada rodada é uma janela nova.</p></div><div class="mn-box"><span class="mn-lbl">Posso fazer a coleta pelo celular?</span><p>Pode, e muita gente prefere: a janela anônima está no menu do navegador e o app do Método roda no celular. Só evite os aplicativos nativos do ChatGPT e do Perplexity para medir, porque eles ficam logados — use o navegador.</p></div><div class="mn-box"><span class="mn-lbl">A IA me perguntou algo de volta em vez de responder. Conta?</span><p>Não. Rodada em que a IA pede mais informação (“em qual bairro?”) não é uma resposta. Feche, abra outra janela e refaça só essa rodada. Se acontecer sempre com a mesma pergunta, a pergunta está vaga demais — mas você só troca no próximo ciclo.</p></div><div class="mn-box"><span class="mn-lbl">A resposta veio em inglês ou para outra cidade.</span><p>A pergunta tem a cidade dentro justamente para isso. Se mesmo assim a IA responde para outro lugar, anote como “não apareceu” e siga — é o que o cliente receberia. Se for sistemático, confira se o navegador está informando o país certo.</p></div><div class="mn-box"><span class="mn-lbl">O Modo IA do Google não aparece na minha janela anônima.</span><p>Ele está sendo liberado por conta, então às vezes não aparece sem login. Crie uma conta do Google só para medir, sem nenhum histórico, e use-a apenas para isso. Anote que fez assim. Se ainda não aparecer, use o Gemini como terceiro motor e mantenha a escolha até o fim do ciclo.</p></div><div class="mn-box"><span class="mn-lbl">Quanto tempo leva, de verdade?</span><p>No protocolo padrão, 105 conversas por dia, cerca de 40 a 50 minutos. No mínimo, 40 conversas, 15 a 20 minutos. Nos dois casos, quase todo dia por 90 dias. Se você não tem esse tempo, delegue a coleta — é trabalho de instrução simples — e fique com a leitura.</p></div><div class="mn-box"><span class="mn-lbl">Posso pedir para alguém da equipe coletar?</span><p>Sim, e é a delegação mais barata do método. Entregue o Capítulo 6, a carteira impressa e a regra do que conta como aparecer. Revise as primeiras 20 linhas anotadas junto com a pessoa. Depois disso, ela faz sozinha.</p></div><div class="mn-box"><span class="mn-lbl">Perdi três dias de coleta. Estraguei tudo?</span><p>Não. Retome de onde parou na rotação e siga. O que estraga é trocar as perguntas ou ler o resultado cedo demais. Dias perdidos só empurram a leitura para mais tarde.</p></div><div class="mn-box"><span class="mn-lbl">A IA citou meu site mas com o nome da clínica errado.</span><p>Conta como “site nas fontes: sim” e “marca no texto: não” — e anote a fidelidade como falha. É um caso importante: você está sendo lido e descrito errado. Confira se o nome está igual no site, no Perfil da Empresa no Google e nas redes.</p></div><div class="mn-box"><span class="mn-lbl">Apareci, mas a IA disse que não me recomenda.</span><p>Conta como “marca no texto: sim” e “fidelidade: não”. Anote o motivo que ela deu — quase sempre é uma informação desatualizada ou uma avaliação antiga que ela encontrou. Isso vira uma tarefa de reparo específica.</p></div><div class="mn-box"><span class="mn-lbl">Só apareceu o meu Instagram, não o meu site.</span><p>Marca no texto: sim (se o nome está lá). Site nas fontes: não. Anote à parte que a fonte foi o Instagram. Se isso se repete, a IA está achando você nas redes e não no site — sinal de que o site está no ramo C enquanto a marca já é conhecida.</p></div><div class="mn-box"><span class="mn-lbl">Meu concorrente aparece em todas as rodadas e eu em nenhuma.</span><p>Ótimo: você tem um caso de estudo grátis. Rode a verificação 5 do Capítulo 13 nas duas páginas e leia os dois textos procurando preço, data, bairro e a pergunta exata. Em quase todo caso, a diferença está escrita ali — e é copiável.</p></div>',mo:'m1'},{id:'d4',t:'Dúvidas: site, perfil e plano',h:'<p class="mn-lead">Sobre o site, o Perfil da Empresa, bloqueio de treinamento e o plano.</p><div class="mn-box"><span class="mn-lbl">Meu site é Wix, WordPress, Shopify ou Loja Integrada. O que muda?</span><p>Nada no método, e pouco na técnica. Todos servem HTML sem depender de JavaScript para o texto principal, todos permitem editar título, preço e data, e todos têm onde colar o bloco de dados estruturados (em geral, em “código personalizado” ou “cabeçalho”). O que mais muda é o robots.txt: no Wix e no Shopify ele é gerenciado pela plataforma — confira o que ela está bloqueando.</p></div><div class="mn-box"><span class="mn-lbl">Preciso de um site novo?</span><p>Quase nunca. As verificações da Parte 5 decidem: se o conteúdo existe sem JavaScript e o robô recebe a mesma página que você, o site serve. Site novo é a solução mais cara para um problema que costuma ser uma faixa de preço faltando.</p></div><div class="mn-box"><span class="mn-lbl">Não tenho site, só Instagram e Perfil da Empresa no Google.</span><p>Você pode medir do mesmo jeito — e provavelmente vai cair no ramo C. Um site de uma página, com as perguntas da carteira respondidas, preço e endereço, resolve a maior parte. É a tarefa mais importante do seu plano, na frente de qualquer outra.</p></div><div class="mn-box"><span class="mn-lbl">E o Perfil da Empresa no Google, conta?</span><p>Muito, para negócio local: é uma das fontes que a IA mais consulta para endereço, horário e avaliações. Nome, endereço e telefone lá têm que ser idênticos aos do site. Categoria certa, horário atualizado, e responda avaliações — a IA lê as respostas.</p></div><div class="mn-box"><span class="mn-lbl">Devo bloquear o treinamento de IA no meu site?</span><p>É uma decisão sua, e as duas respostas são legítimas. O que não pode é bloquear os robôs de <i>busca</i> junto, por engano — é o erro mais caro do método. O Capítulo 13 mostra como separar.</p></div><div class="mn-box"><span class="mn-lbl">Já sei que não apareço. Posso pular a Fase 0?</span><p>Não. Você sabe que não aparece; não sabe <i>por quê</i>. E sem o retrato do antes, no dia 90 você não vai conseguir dizer se alguma coisa mudou. A Fase 0 é a única que não dá para recuperar depois.</p></div><div class="mn-box"><span class="mn-lbl">Tenho mais de uma unidade, em cidades diferentes.</span><p>Uma carteira por cidade, com as perguntas de descoberta trocando o nome da cidade. Meça a maior primeiro; as outras entram no ciclo seguinte. Nome, endereço e telefone de cada unidade precisam estar separados e consistentes.</p></div><div class="mn-box"><span class="mn-lbl">Vendo para empresas, não para pessoas. Serve?</span><p>Serve, e é onde a citação mais pesa: comprador de empresa usa IA para montar a lista curta antes de qualquer reunião. Troque a cidade pelo recorte que ele usa — porte, setor, problema — e o resto do método é idêntico.</p></div><div class="mn-box"><span class="mn-lbl">Tenho loja virtual, não serviço.</span><p>As perguntas mudam de forma (“onde comprar X com entrega rápida?”, “X ou Y, qual vale mais?”) e os porteiros pesam ainda mais: preço, especificação e data são exatamente o que a IA procura em produto. O bloco de dados estruturados de produto, com preço e disponibilidade, é obrigatório.</p></div><div class="mn-box"><span class="mn-lbl">O que faço no dia 91?</span><p>Lê o resultado (Capítulo 7) e decide entre três caminhos: repetir o ciclo com a mesma carteira para confirmar a tendência; ampliar — nova carteira, novas páginas; ou parar, se o canal não justifica para o seu caso. Qualquer uma é uma decisão informada. O que não faz é trocar a carteira e começar a medir de novo sem ter lido a primeira.</p></div><div class="mn-box"><span class="mn-lbl">Quanto isso custa se eu não fizer nada?</span><p>Não dá para saber sem medir — e é exatamente por isso que o método começa medindo. A Fase 0 custa três semanas de vinte a quarenta minutos por dia e responde se o canal importa para você. É o orçamento mais barato de decisão que existe neste assunto.</p></div>',mo:'m2'},{id:'d5',t:'As doze verificações técnicas, sem terminal',h:'<p class="mn-lead">Tudo com navegador e ferramentas gratuitas. Meia hora que decide se as outras oitenta e nove tarefas fazem sentido. A aba Técnico tem o passo a passo já com o seu domínio.</p>\n<div class="mn-tw"><table>\n<thead><tr><th scope="col">#</th><th scope="col">O que verificar</th><th scope="col">Onde (sem terminal)</th><th scope="col">Aprovado quando</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Domínio abre, com e sem www</td><td>Navegador</td><td>Mesmo endereço final</td></tr>\n<tr><td>2</td><td>Cadeia de redirecionamento</td><td>httpstatus.io</td><td>≤ 2 saltos, termina em 200</td></tr>\n<tr><td>3</td><td>Certificado válido</td><td>Cadeado · ssllabs.com</td><td>Seguro, &gt; 15 dias</td></tr>\n<tr><td>4</td><td>robots.txt libera busca</td><td>/robots.txt · P15</td><td>Sem Disallow para busca</td></tr>\n<tr><td>5</td><td>Robô recebe a mesma página</td><td>Search Console, teste ao vivo</td><td>Captura e HTML com o texto</td></tr>\n<tr><td>6</td><td>Conteúdo existe sem JavaScript</td><td>Ctrl+U, Ctrl+F</td><td>A frase aparece no código</td></tr>\n<tr><td>7</td><td>Sitemap válido</td><td>/sitemap.xml · Search Console</td><td>Abre e “Sucesso”</td></tr>\n<tr><td>8</td><td>Canônica autorreferente</td><td>Ctrl+U · Search Console</td><td>Aponta para a própria URL</td></tr>\n<tr><td>9</td><td>Dado estruturado presente</td><td>validator.schema.org</td><td>≥ 1 bloco, sem erro</td></tr>\n<tr><td>10</td><td>Primeira resposta do servidor</td><td>PageSpeed Insights</td><td>Item “tempo de resposta inicial” não aparece</td></tr>\n<tr><td>11</td><td>Nome, endereço e telefone iguais</td><td>Planilha · Perfil da Empresa</td><td>Idênticos em todo canal</td></tr>\n<tr><td>12</td><td>Proteção não bloqueia robô</td><td>Search Console · httpstatus.io · Cloudflare Events</td><td>Sem Block/Challenge; 200 para os robôs</td></tr>\n</tbody></table></div>\n<div class="mn-key"><p class="mn-lbl">ORDEM DO REPARO</p><h4>Se reprovou</h4><p><b>12 e 4 primeiro</b> — se algo bloqueia o robô, nada mais importa. Depois <b>6</b>, o mais caro e decisivo. Depois 1, 2, 3 e 8, baratos. Só então 9, 10 e 11. O prompt P19 ordena a sua lista; o P16 explica qualquer relatório ou erro que você não entendeu; o P17 escreve a mensagem para a hospedagem.</p></div>\n<h4>Cloudflare, em uma linha por item</h4>\n<ul>\n<li><b>AI Crawl Control › Crawlers:</b> OAI-SearchBot, ChatGPT-User, PerplexityBot, Perplexity-User, Claude-SearchBot e Claude-User em <b>Allow</b>. Treinamento: decisão sua.</li>\n<li><b>robots.txt gerenciado:</b> hoje declara search=yes e bloqueia só treinamento. Vale o arquivo publicado — abra /robots.txt depois de ligar.</li>\n<li><b>AI Labyrinth</b> e <b>Bot Fight Mode</b> (plano free): desligados. <b>SSL Full (strict)</b>, cache de HTML, Brotli, HTTP/3: ligados.</li>\n<li><b>Confirme no registro</b> (Security › Events), não no painel.</li>\n</ul>\n<h4>Dados estruturados sem escrever código</h4>\n<p>WordPress: Rank Math (gratuito) → Títulos e Meta → Local SEO. Wix: Configurações de SEO da página → dados estruturados. Qualquer outro: gerador gratuito da Merkle ou o prompt P18, validado em validator.schema.org. Desde maio de 2026 o Google não mostra mais o destaque de perguntas frequentes — o que vale é a pergunta e a resposta visíveis no texto.</p>\n<h4>Bing e IndexNow: o fato, a lenda e os vinte minutos</h4>\n<p><b>Comprovado:</b> a busca do ChatGPT nasceu sobre o Bing (out/2024); em fev/2025, 87% das citações do SearchGPT batiam com o top 20 do Bing (100 perguntas, “direcional”). <b>Observado:</b> em set/2026, uma investigação de campo viu o ChatGPT consultando pelo menos oito provedores — índice próprio, Google via intermediários, Bing, Yelp, TripAdvisor — e concluiu que “visibilidade no Bing não é substituto de visibilidade no ChatGPT”. A OpenAI não confirmou.</p>\n<p><b>A leitura honesta:</b> Bing é um dos caminhos e o índice do Copilot — não o atalho. Faça pelo custo: importe o site do Search Console no Bing Webmaster Tools, envie o sitemap, ligue o IndexNow (Rank Math, Yoast, AIOSEO, SEOPress; Wix e Shopify já enviam; Crawler Hints na Cloudflare) e confira a página em URL Inspection. Google não participa do IndexNow e nenhum fornecedor de IA documenta recebê-lo. A aba Técnico tem o passo a passo.</p>',ta:['T4','T6','T7']}]},{id:'p12',tag:'LOCAL',t:'Busca local e o Perfil da Empresa',s:[{id:'l1',t:'Os três fatores do resultado local',h:'<p class="mn-lead">Para negócio local, a disputa é com os dez ou vinte negócios que a IA considera “perto” de quem perguntou. E o lugar onde ela mais olha não é o seu site: é o seu Perfil da Empresa no Google.</p>\n<p>O Google declara três fatores para ordenar resultados locais — e o Modo IA usa o mesmo mapa por baixo. Não dá para pagar por posição; dá para preencher tudo.</p>\n<div class="mn-tw"><table>\n<thead><tr><th scope="col">Fator</th><th scope="col">O que é</th><th scope="col">O que você controla</th></tr></thead>\n<tbody>\n<tr><td><b>Relevância</b></td><td>O quanto o perfil bate com o que a pessoa procurou.</td><td>Categoria principal certa; serviços escritos, com preço; descrição com o que você faz e onde.</td></tr>\n<tr><td><b>Distância</b></td><td>A que distância você está de quem procura — ou da cidade escrita na busca.</td><td>Endereço exato e verificado; área de cobertura, se atende em domicílio; bairro e cidades vizinhas escritos no site.</td></tr>\n<tr><td><b>Destaque</b></td><td>O quanto você é conhecido: avaliações, notas, menções, links.</td><td>Avaliações recentes, com resposta; nome, endereço e telefone iguais em todo canal; menções em sites do setor e da cidade.</td></tr>\n</tbody></table></div>\n<h4>De onde cada motor tira o dado local</h4>\n<ul>\n<li><b>ChatGPT</b> — índice de parceiros (Microsoft), localização aproximada de quem pergunta, mapa no celular; profissionais relataram (dez/2025) que o cartão local espelha o Perfil da Empresa. <span class="mn-mid">Observado</span></li>\n<li><b>Modo IA / Gemini</b> — índice do Google, Perfil da Empresa e Maps, avaliações do Google. <span class="mn-mid">Documentado</span></li>\n<li><b>Perplexity</b> — rastreio próprio da web; dados do Yelp anunciados para restaurantes nos EUA; mapas não documentados.</li>\n</ul>\n<p><b>A conclusão prática:</b> o que é comum aos três é o seu site e o seu Perfil. Mesmos dados, mesmas palavras, mesmos preços, mesmo horário. Se um contradiz o outro, você perde para quem tem os dois alinhados — mesmo sendo menor.</p>',ta:['T8']},{id:'l2',t:'O Perfil da Empresa, item por item',h:'<p class="mn-lead">O perfil é gratuito: google.com/business, ou “Gerenciar perfil” ao buscar o seu negócio logado. A aba Local marca os quinze itens; aqui está o porquê de cada um.</p>\n<ol>\n<li><b>Verifique o perfil.</b> Vídeo (fachada, interior, prova de que é seu) é o mais rápido.</li>\n<li><b>Nome real, e só ele.</b> Cidade, bairro, slogan ou palavra-chave no nome violam as diretrizes e podem suspender o perfil.</li>\n<li><b>Categoria principal: a mais específica.</b> “Clínica de estética”, não “Clínica”. Poucas secundárias.</li>\n<li><b>Endereço exato — ou área de cobertura</b> para quem atende em domicílio. Nunca caixa postal ou endereço virtual.</li>\n<li><b>Telefone local e site certo:</b> o mesmo do site; o campo “site” vai para a página que responde às perguntas.</li>\n<li><b>Horário, inclusive feriados.</b> A IA responde “está aberto agora?”.</li>\n<li><b>Descrição de até 750 caracteres</b> com as palavras da carteira — sem promoção, sem link (prompt P20).</li>\n<li><b>Serviços com faixa de preço.</b> O porteiro do Capítulo 3 dentro do perfil.</li>\n<li><b>Fotos suas, não de banco.</b> Uma por semana.</li>\n<li><b>Atributos verdadeiros, uma atualização por semana, perguntas e respostas</b> com as perguntas da carteira.</li>\n</ol>\n<div class="mn-key"><p class="mn-lbl">O QUE DÁ SUSPENSÃO</p><h4>Nenhuma tática deste método passa perto</h4><p>Palavra-chave no nome, endereço falso ou virtual, mais de um perfil por local, avaliação comprada ou trocada por desconto, resposta com ofensa. A recuperação leva semanas.</p></div>\n<h4>O site e o perfil, um espelho do outro</h4>\n<ul>\n<li>Uma página por serviço, com bairro e cidades atendidas no texto.</li>\n<li>Os mesmos preços no perfil (Serviços) e na página. O mesmo horário no rodapé e no perfil.</li>\n<li>Mapa incorporado na página de contato, no mesmo endereço.</li>\n<li>O bloco LocalBusiness (aba Técnico) com exatamente os mesmos dados.</li>\n</ul>\n<h4>Diretórios: poucos, certos, iguais</h4>\n<p>Apple Business Connect (mapa do iPhone), Bing Places (índice do Copilot e de parte do ChatGPT), Instagram e Facebook com os mesmos dados, dois ou três diretórios do setor, imprensa e associações locais. Cinquenta diretórios com variações do nome são cinquenta contradições.</p>',ta:['T9']},{id:'l3',t:'Avaliações: o ciclo que a IA lê',h:'<p class="mn-lead">Avaliação é o dado mais lido por pessoas e por máquinas no negócio local — e o mais mal cuidado.</p>\n<div class="mn-tw"><table>\n<caption>BrightLocal, Local Consumer Review Survey 2026 — 1.002 consumidores adultos nos EUA. Observado; o comportamento brasileiro não foi medido com o mesmo rigor.</caption>\n<tbody>\n<tr><td><b>97%</b></td><td>leem avaliações antes de escolher um negócio local; 41% sempre.</td></tr>\n<tr><td><b>68%</b></td><td>só consideram negócios com 4 estrelas ou mais (eram 55% um ano antes).</td></tr>\n<tr><td><b>74%</b></td><td>olham as avaliações dos últimos três meses.</td></tr>\n<tr><td><b>80%</b></td><td>preferem negócios que respondem a todas; 50% rejeitam resposta genérica.</td></tr>\n<tr><td><b>45%</b></td><td>já usam o ChatGPT ou similares para recomendações locais.</td></tr>\n</tbody></table></div>\n<ol>\n<li><b>Peça na hora certa:</b> logo depois do serviço, por WhatsApp, com o link “Pedir avaliações” do perfil. A todos, não só a quem elogiou (prompt P22).</li>\n<li><b>Nunca compre, troque ou filtre.</b> Desconto, brinde ou sorteio por avaliação viola as diretrizes e é detectável.</li>\n<li><b>Responda todas, em até 48 horas, sem modelo.</b> Cite o serviço e o bairro uma vez; a resposta é conteúdo público lido pela máquina (prompt P21).</li>\n<li><b>Negativa: fatos, sem discutir.</b> Agradeça, reconheça em uma frase, diga o que foi feito, convide a resolver pelo telefone. Nunca revele dados do cliente, nunca peça para apagar.</li>\n<li><b>Leia o que dizem de você:</b> é dado de fidelidade. O que se repete nas avaliações é o que a IA vai repetir ao descrever você.</li>\n</ol>',ta:['T9']},{id:'l4',t:'Como o local entra na medição',h:'<p class="mn-lead">A carteira já tem perguntas com bairro e cidade. Quando a IA responde uma delas, anote — além de marca e domínio — se o perfil apareceu (nome com nota e endereço, ou um mapa).</p>\n<ul>\n<li><b>Perfil aparece, site não:</b> você está no mapa, mas a página que responde não existe ou não está indexada. Ramo C do site com o perfil salvando — Parte 5 e Capítulo 9.</li>\n<li><b>Site aparece, perfil não:</b> categoria errada, perfil não verificado ou endereço fora da área da pergunta. Reparo na aba Local.</li>\n<li><b>Nenhum dos dois, e os concorrentes citados têm nota e endereço:</b> perfil incompleto ou nome divergente do site. Comece pelo item 1.</li>\n</ul>\n<h4>Dois casos que confundem</h4>\n<ul>\n<li><b>Atende em domicílio:</b> perfil com endereço oculto e área de cobertura; no site, a mesma área por extenso; na carteira, “atende em domicílio em [cidade]?”.</li>\n<li><b>Mais de uma unidade:</b> um perfil por unidade, cada um com telefone, horário e página própria (bairro no título). Uma carteira por cidade.</li>\n</ul>'}]}],SECOES={};MANUAL.forEach(a=>a.s.forEach(e=>{SECOES[e.id]={...e,pid:a.id,ptag:a.tag,pt:a.t}}));const ORDEM_SEC=MANUAL.flatMap(a=>a.s.map(a=>a.id));function semAcento(a){return(a||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}const SEC_TXT={};function buscarManual(a){const e=semAcento(a).trim();if(e.length<3)return[];const o=e.s
