escreve um preço, horário ou serviço que você não pratica mais. Ou a página não tem data nenhuma.</p>\n <p><b>Correção:</b> atualizar e <b>datar de forma visível</b>. Recência é um dos quatro porteiros — data antiga não é detalhe estético, derruba a citação.</p>\n </div>\n <div class="mn-bl">\n <p>4</p>\n <h4>Localização incompatível</h4>\n <p><b>Sintoma:</b> você aparece para a cidade errada, ou some quando a pergunta inclui o nome do seu bairro.</p>\n <p><b>Correção:</b> nome, endereço e telefone idênticos em todos os canais, e a região de atendimento escrita como o cliente fala — incluindo bairro e cidades vizinhas que você atende.</p>\n </div>\n </div>\n\n <div class="mn-bl"><b>Por que “lacuna de informação” engana tanta gente.</b> É o tipo de falha que mais parece problema de autoridade e não é. A empresa conclui “a IA prefere as grandes” quando, na prática, a página do concorrente diz o preço e a dela não.</div>\n\n <p>O passo a passo dos quatro testes (4.4) fica no modo completo — é o roteiro de quem vai executar.\n </p>',ta:['T11','T12'],mo:'m3'},{id:'s44',t:'4.4 Como fazer cada análise, passo a passo',h:'<p class="mn-deep">Quatro testes. Todos rodam em navegador anônimo, sem ferramenta paga. Registre tudo numa planilha simples: uma linha por rodada.</p>\n\n <div class="mn-bl">\n <p class="mn-lbl">ANTES DE COMEÇAR — HIGIENE OBRIGATÓRIA</p>\n <h4>Sem isso, você está medindo o seu próprio histórico</h4>\n <p>Use <b>janela anônima</b> e conta deslogada. A IA personaliza pelo histórico: se você já pesquisou a sua própria empresa cinquenta vezes, ela vai te mostrar. Confira também a <b>localização</b> que o navegador está informando — resposta local muda inteira com o CEP. E anote <b>data, hora e motor</b> em toda rodada.</p>\n </div>\n\n <h4 class="mn-deep">Teste A — A IA busca na internet?</h4>\n <ol>\n <li>Faça a pergunta em janela anônima, sem dar o nome da sua empresa.</li>\n <li>Observe se a resposta traz <b>fontes citadas</b> ou o indicador de busca. Sem fontes = respondeu de memória.</li>\n <li>Repita 7 vezes. Anote quantas ativaram busca.</li>\n <li><b>Como ler:</b> em uma configuração estudada, <span class="mn-num">57,8%</span> das rodadas do ChatGPT não ativaram busca. Se a sua taxa de ativação é baixa, o problema não é o seu site — é a forma da pergunta. Perguntas completas ativam muito mais que termos soltos.</li>\n </ol>\n\n <h4 class="mn-deep">Teste B — Meu site entra na lista de fontes?</h4>\n <ol>\n <li>Nas rodadas que ativaram busca, abra a lista de fontes citadas.</li>\n <li>Anote <b>todos</b> os domínios citados, não só o seu. Essa lista é o mapa de onde a IA vai buscar no seu setor.</li>\n <li>Marque sim/não para o seu domínio em cada rodada.</li>\n <li><b>Como ler:</b> zero aparições em 7 rodadas de 20 perguntas = Ramo C, problema de recuperação. Aparece às vezes = você está no jogo.</li>\n </ol>\n\n <h4 class="mn-deep">Teste C — Sendo lida, sou escolhida?</h4>\n <ol>\n <li>Separe só as rodadas em que o seu domínio apareceu nas fontes.</li>\n <li>Dentro dessas, conte em quantas o <b>nome da sua empresa</b> foi citado no corpo da resposta.</li>\n <li><b>Como ler:</b> esse é o número que separa Ramo A de Ramo B. Alto = trabalhe qualidade. Baixo = a página está desalinhada, vá para a seção 4.3.</li>\n <li>Faça o mesmo com os dois concorrentes mais citados. A comparação diz mais que o seu número isolado.</li>\n </ol>\n\n <h4 class="mn-deep">Teste D — O que dizem sobre mim está certo?</h4>\n <ol>\n <li>Nas rodadas em que você apareceu, copie a frase inteira sobre a sua empresa.</li>\n <li>Classifique: <b>correta</b>, <b>incompleta</b>, <b>errada</b>, e o tom em positivo, neutro ou negativo.</li>\n <li>Para cada erro, ache a origem: quase sempre é um canal seu com informação divergente — um diretório antigo, um horário desatualizado no perfil, um preço velho no site.</li>\n <li><b>Como ler:</b> em auditoria de referência, só <span class="mn-num">51,5%</span> das frases geradas eram totalmente sustentadas pela fonte citada. Ser citado errado conta como aparição em qualquer painel do mercado — e é resultado ruim.</li>\n </ol>',ta:['T5','T10'],mo:'m3'},{id:'s45',t:'4.5 Como interpretar o que você viu',h:'<div class="mn-tw">\n <table>\n <caption>Da observação à ação, sem etapa intermediária de achismo.</caption>\n <thead><tr><th scope="col">O que você viu</th><th scope="col">O que significa</th><th scope="col">O que fazer</th></tr></thead>\n <tbody>\n <tr><td>A IA quase nunca busca nas suas perguntas</td><td>As perguntas do teste não são as que o cliente faz, ou são curtas demais</td><td>Reescreva a carteira de perguntas em frases completas, como o cliente fala</td></tr>\n <tr><td>Seu domínio nunca aparece nas fontes</td><td><span class="mn-no">Ramo C</span> Recuperação</td><td>Auditoria técnica. Redação agora é desperdício</td></tr>\n <tr><td>Domínio aparece, marca não é citada</td><td><span class="mn-mid">Ramo B</span> Página desalinhada</td><td>Classificar na 4.3 e fazer reparo dirigido</td></tr>\n <tr><td>Marca aparece em 1 ou 2 de 7 rodadas</td><td><span class="mn-ok">Ramo A</span> Qualidade</td><td>Os quatro porteiros na página que já é citada</td></tr>\n <tr><td>Aparece no ChatGPT e some no Google AI Mode</td><td>Fontes diferentes: um puxa de Bing e bases de lugares, o outro do índice do Google</td><td>Tratar Bing Places e Perfil da Empresa como canais separados</td></tr>\n <tr><td>Concorrente menor aparece mais que você</td><td>Quase sempre a página dele responde à pergunta e a sua responde à categoria</td><td>Compare os dois títulos lado a lado antes de concluir que é autoridade</td></tr>\n <tr><td>A descrição sobre você está errada</td><td>Informação divergente entre os seus canais</td><td>Achar o canal desatualizado e corrigir na origem</td></tr>\n <tr><td>O número muda muito entre semanas</td><td>Provavelmente ruído, não efeito</td><td>Não decidir nada. Ir para a Parte 5 e medir com janela e repetição corretas</td></tr>\n </tbody>\n </table>\n </div>',ta:['T10'],mo:'m3'}]},{id:'p5',tag:'PARTE 5',t:'Medição',r:'Se você ler só uma parte antes de assinar um contrato, que seja esta. Ela dá o critério para saber se um relatório é informação ou é ruído.',s:[{id:'s51',t:'5.1 Por que uma consulta não vale nada',h:'<p>A margem de erro de uma medição isolada é tão grande que ela não distingue 20% de 60%.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Margem de erro conforme o número de repetições da mesma pergunta, no mesmo dia</p><p class="mn-fig-s">Quanto menor a barra, mais confiável. Valores medidos em 4 motores ao longo de 45 dias.</p><p class="mn-fig-a">Gráfico: margem de erro cai de 0,370 com 1 repetição para 0,081 com 7 e 0,062 com 8.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> com <b>uma</b> consulta a margem de erro é <span class="mn-num">0,370</span> — na prática, a medição não informa nada. Com <b>7 repetições da mesma pergunta no mesmo dia</b> ela cai para <span class="mn-num">0,081</span>, e aí sim uma diferença começa a significar alguma coisa. Sete é o piso, não o ideal.\n <span class="mn-src">Fonte: Schulte, Bleeker e Kaufmann (2026), arXiv 2604.07585. Valores da configuração estudada — use como limiar de decisão, não como previsão exata do seu erro.</span></p></div>',ta:['T2'],mo:'m1'},{id:'s52',t:'5.2 Por que uma semana não vale nada',h:'<div class="mn-fig"><p class="mn-fig-t">Margem de erro conforme o tamanho da janela de observação</p><p class="mn-fig-s">Mesmo com repetição correta, uma janela curta ainda produz número instável.</p><p class="mn-fig-a">Gráfico: margem de erro cai de 0,322 com 1 dia para 0,107 com 10 dias e 0,033 com 24 dias.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> relatório semanal não tem janela suficiente para dizer se algo mudou. <b>10 dias</b> é o mínimo para margem abaixo de 0,10; <b>24 dias</b> para chegar perto de 0,05. É por isso que o plano da Parte 6 não faz nenhuma leitura decisória antes do dia 76 — antes disso o número existe, mas não sustenta decisão.\n <span class="mn-src">Fonte: Schulte et al. (2026). Mesma configuração da figura anterior.</span></p></div>',ta:['T2','T3'],mo:'m1'},{id:'s53',t:'5.3 Calculadora: o seu plano de medição é suficiente?',h:'<p>Preencha com o que você — ou o seu fornecedor — pretende fazer. A calculadora aplica os limiares publicados e mostra o volume real de consultas por trás da promessa.</p>\n\n \n\n <div class="mn-warn">\n <p class="mn-lbl">USE ISSO NA NEGOCIAÇÃO</p>\n <h4>O plano de entrada de qualquer ferramenta do mercado roda abaixo do limiar</h4>\n <p>Um plano de <span class="mn-num">US$ 29</span> por mês costuma incluir 15 perguntas. Com 7 repetições por dia em 3 motores, 15 perguntas já são <b>315 consultas por dia</b>. Nenhum plano de entrada permite isso — ele roda 1 consulta por pergunta, o que a figura 5.1 mostra ser inútil. Pergunte ao fornecedor quantas repetições ele faz. É a pergunta que quase ninguém faz e que separa serviço de enfeite.</p>\n </div>',ir:['medir','Abrir a calculadora de suficiência'],ta:['T3'],mo:'m1'},{id:'s54',t:'5.4 Montar a carteira de perguntas',h:'<p class="mn-deep">Uma carteira boa cobre <b>quatro intenções</b>, com pelo menos três formas de dizer a mesma coisa. Sem as paráfrases você mede uma frase, não uma necessidade.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Modelo preenchido para uma clínica de estética em Sorocaba. Troque o negócio e a cidade, mantenha a estrutura.</caption>\n <thead><tr><th scope="col">Intenção</th><th scope="col">Para que serve</th><th scope="col">Três formas de perguntar</th></tr></thead>\n <tbody>\n <tr>\n <td><b>1. Descoberta</b><br><span>a mais importante</span></td>\n <td>O cliente não sabe o seu nome. É aqui que a visibilidade real acontece</td>\n <td>“Qual clínica de estética você indica em Sorocaba?”<br>“Onde fazer depilação a laser em Sorocaba?”<br>“Clínicas de estética boas perto do centro de Sorocaba”</td>\n </tr>\n <tr>\n <td><b>2. Comparação</b></td>\n <td>Mede se você entra na disputa quando o cliente já está escolhendo</td>\n <td>“Melhores clínicas de depilação a laser em Sorocaba”<br>“Qual a diferença entre as clínicas de estética de Sorocaba?”<br>“Vale mais a pena fazer laser na clínica X ou na Y?”</td>\n </tr>\n <tr>\n <td><b>3. Problema</b></td>\n <td>O cliente descreve a dor, não o serviço. Costuma ser a intenção mais mal coberta</td>\n <td>“Tenho pelos encravados, o que resolve de vez?”<br>“Como tirar manchas de sol do rosto em Sorocaba?”<br>“Quanto custa fechar as axilas com laser?”</td>\n </tr>\n <tr>\n <td><b>4. Validação</b><br><span class="mn-mid">não confunda com as outras</span></td>\n <td>O cliente já sabe o nome. Serve só para checar <b>fidelidade</b>, nunca para medir visibilidade</td>\n <td>“O que você sabe sobre a Clínica Tal de Sorocaba?”<br>“A Clínica Tal é confiável?”<br>“Quais serviços a Clínica Tal oferece?”</td>\n </tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl">\n <p class="mn-lbl">REGRAS DA CARTEIRA</p>\n <h4>Quatro decisões que evitam retrabalho depois</h4>\n <p><b>1.</b> Entre 20 e 30 perguntas. Menos que 20 não cobre o assunto; mais que 30 encarece sem ganho proporcional.<br>\n <b>2.</b> No máximo 25% da carteira em intenção de validação. Elas quase sempre dão “sim” e inflam o resultado.<br>\n <b>3.</b> Congele a carteira antes de começar. Trocar pergunta no meio quebra a comparação com o baseline.<br>\n <b>4.</b> Guarde a resposta inteira, não só o sim/não. Quando você descobrir que estava contando errado — e vai descobrir —, sem o texto original a série histórica se perde.</p>\n </div>',ir:['carteira','Abrir a carteira de perguntas'],ta:['T1'],mo:'m1'},{id:'s55',t:'5.5 Calculadora: a mudança foi real ou foi acaso?',h:'<p class="mn-deep">Você mediu antes, fez o trabalho, mediu depois. O número subiu. A pergunta que importa é se subiu além da margem de erro.</p>',ir:['medir','Abrir o teste de significância'],mo:'m4'},{id:'s56',t:'5.6 O painel que sustenta uma reunião',h:'<p>Sete indicadores. Nenhum deles é “posição”, porque posição não existe neste canal.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Indicadores, com o que cada um responde e onde cada um engana.</caption>\n <thead><tr><th scope="col">Indicador</th><th scope="col">O que é</th><th scope="col">Como ler</th><th scope="col">Referência em 90 dias</th></tr></thead>\n <tbody>\n <tr><td><b>Taxa de detecção</b></td><td>Em quantas rodadas de cada 100 a marca apareceu</td><td>Sempre com a faixa de erro junto. Sem ela o número não é comparável</td><td>Subir além da faixa de erro</td></tr>\n <tr><td><b>Cobertura de perguntas</b></td><td>Perguntas com pelo menos uma aparição, sobre o total</td><td>Distingue “apareço muito em duas perguntas” de “apareço um pouco em todas”</td><td>40–60% em nicho geográfico</td></tr>\n <tr><td><b>Presença nas fontes</b></td><td>Perguntas em que o seu domínio foi citado, mesmo sem a marca aparecer</td><td>É o termômetro de recuperação. Se está em zero, o resto não sai do lugar</td><td>Acima da taxa de detecção</td></tr>\n <tr><td><b>Comparativo com concorrentes</b></td><td>A sua detecção contra a dos concorrentes, nas mesmas perguntas</td><td>Protege contra confundir crescimento da plataforma com resultado seu</td><td>Ganhar posição relativa</td></tr>\n <tr><td><b>Fidelidade</b></td><td>Aparições em que a descrição sobre você está correta</td><td>Aparição com informação errada é resultado negativo, não positivo</td><td>Acima de 90%</td></tr>\n <tr><td><b>Sentimento</b></td><td>Tom da menção: positivo, neutro ou negativo</td><td>É a métrica que o mercado passa a cobrar em 2026</td><td>Sem menção negativa recorrente</td></tr>\n <tr><td><b>Visitas vindas de IA</b><br><span class="mn-mid">indicador atrasado</span></td><td>Sessões no site com origem em ferramentas de IA</td><td>Demora a reagir e sofre influência do crescimento das plataformas. <b>Nunca use como métrica principal</b></td><td>Tendência, não meta</td></tr>\n </tbody>\n </table>\n </div>',ir:['medir','Abrir o painel'],ta:['T16','T17'],mo:'m4'},{id:'s57',t:'5.7 As seis armadilhas',h:'<p>Todas já apareceram em relatório de fornecedor. Todas inflam o resultado.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Erros de medição que transformam ruído em gráfico ascendente.</caption>\n <thead><tr><th scope="col">Armadilha</th><th scope="col">Por que infla</th><th scope="col">Correção</th></tr></thead>\n <tbody>\n <tr><td>Descartar as rodadas em que a IA não citou ninguém</td><td>O denominador encolhe e a taxa sobe sozinha</td><td>Rodada sem citação é dado, não falha. Entra na conta</td></tr>\n <tr><td>Ler o resultado cedo demais</td><td>Mudança estrutural leva de 2 a 4 semanas para aparecer na citação</td><td>Nenhuma leitura decisória antes de 4 semanas do fim da mudança</td></tr>\n <tr><td>Uma consulta por pergunta</td><td>Margem de erro de 0,370: o número é praticamente aleatório</td><td>Mínimo de 7 repetições por pergunta, por dia</td></tr>\n <tr><td>Medir um motor só</td><td>Cada motor puxa de fontes diferentes; um bom resultado não transfere</td><td>Mínimo de 3 motores, relatados separadamente</td></tr>\n <tr><td>Contar aparição sem checar o que foi dito</td><td>Citação errada entra como vitória</td><td>Auditoria de fidelidade por amostra, todo mês</td></tr>\n <tr><td>Comparar sem concorrente</td><td>O canal cresceu sozinho; parte da alta não é sua</td><td>Sempre medir os mesmos concorrentes nas mesmas perguntas</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O CRITÉRIO EM UMA FRASE</p>\n <h4>Se o relatório não declara quantas repetições e qual a janela, ele não é mensurável</h4>\n <p>Não importa quão bonito seja o painel. Sem <b>número de repetições</b>, <b>número de perguntas</b>, <b>motores</b> e <b>janela de agregação</b> declarados, não dá para saber se a linha que subiu significa alguma coisa. Essa é a pergunta única que você pode fazer a qualquer fornecedor — inclusive a nós.</p>\n </div>',ta:['T3','T16'],mo:'m4'}]},{id:'p6',tag:'PARTE 6',t:'Execução',r:'O plano completo de 90 dias: quem faz o quê, quando, e — o mais importante — em que ordem.',s:[{id:'s61',t:'6.1 O plano inteiro em uma imagem',h:'<p>Cinco frentes correndo em paralelo, 18 tarefas, 4 marcos. As barras com contorno vermelho são o caminho crítico: atrasou uma delas, atrasou o projeto inteiro.</p>\n\n \n\n <div class="mn-tw">\n <table>\n <caption>Os quatro marcos, com o critério objetivo de cada um. Sem o critério, marco vira data no calendário.</caption>\n <thead><tr><th scope="col">Marco</th><th scope="col">Dia</th><th scope="col">Só está cumprido quando…</th><th scope="col">Se não cumprir</th></tr></thead>\n <tbody>\n <tr><td><b>M1</b> Baseline válido</td><td class="mn-num">21</td><td>14 dias de coleta contínua, 7 repetições por pergunta por dia, em pelo menos 3 motores, com a resposta bruta guardada</td><td>Não avance para conteúdo. Sem baseline você não vai conseguir provar nada no dia 90</td></tr>\n <tr><td><b>M2</b> Fundação pronta</td><td class="mn-num">45</td><td>100% das páginas-alvo indexadas, zero URLs concorrentes para a mesma intenção, e dados da empresa idênticos em todos os canais</td><td>Adie a Fase 2. Reparo de conteúdo sobre base quebrada não produz efeito mensurável</td></tr>\n <tr><td><b>M3</b> Páginas reparadas</td><td class="mn-num">70</td><td>Toda página do diagnóstico com preço ou faixa, data real, especificação e evidência — e nenhuma afirmação sem fonte</td><td>Registre o que ficou de fora. O relatório do dia 90 precisa dizer o que foi feito, não só o que mudou</td></tr>\n <tr><td><b>M4</b> Relatório</td><td class="mn-num">90</td><td>Comparação entre o baseline e a janela de 28 dias, com margem de erro declarada e os concorrentes medidos nas mesmas perguntas</td><td>Se a diferença não sai da margem, o resultado é “não deu para afirmar”. Isso é um resultado, não um fracasso</td></tr>\n </tbody>\n </table>\n </div>',ir:['programa','Abrir o calendário do programa']},{id:'s62',t:'6.2 Fase 0 — Medir antes de mexer D1 a D21',h:'<p>É a fase que quase todo mundo pula, e é a única que não dá para recuperar depois. Sem baseline, no dia 90 você tem um número solto e nenhuma forma de saber se ele é bom.</p>\n\n <ol>\n <li><b>Escreva as perguntas antes de olhar o site.</b> 20 a 30 perguntas, quatro intenções, três formas de dizer cada uma. Modelo pronto na seção 5.4.</li>\n <li><b>Congele a carteira.</b> Salve num arquivo com data. Trocar pergunta depois quebra a comparação.</li>\n <li><b>Monte o coletor.</b> Uma rotina diária que faz 7 chamadas por pergunta em cada motor e grava a <b>resposta inteira</b>, não só o sim/não.</li>\n <li><b>Rode 14 dias sem mexer em nada no site.</b> Qualquer mudança nesse período contamina o baseline.</li>\n <li><b>Em paralelo, faça a auditoria técnica.</b> Indexação, robots.txt, renderização de JavaScript, canônicas, velocidade.</li>\n <li><b>Classifique as falhas</b> com a árvore da seção 4.1 e a matriz da 4.3. Esse documento define o trabalho das próximas 10 semanas.</li>\n </ol>',ta:['T1','T2','T3','T4','T5'],mo:'m1'},{id:'s63',t:'6.3 Fase 1 — Fazer a IA conseguir ler você D15 a D45',h:'<p>Prioridade máxima porque é o gargalo. Enquanto esta fase não fecha, tudo o que for escrito rende zero.</p>\n\n <ol>\n <li><b>Desbloqueie o rastreamento.</b> Confira robots.txt e se a página renderiza sem JavaScript. Critério de pronto: 100% das páginas-alvo aparecendo numa busca por <span class="mn-num">site:seudominio</span>.</li>\n <li><b>Elimine páginas concorrendo entre si.</b> Duas páginas suas disputando a mesma pergunta se anulam. Escolha uma, redirecione a outra.</li>\n <li><b>Padronize os dados da empresa.</b> Nome, endereço, telefone e categoria <b>idênticos</b> — caractere por caractere — no site, no Perfil da Empresa no Google, no Bing Places e nos diretórios. Divergência aqui vira descrição errada na resposta da IA.</li>\n <li><b>Uma página por pergunta real.</b> Não por variação de palavra-chave. O Google AI Mode quebra uma pergunta em várias e busca uma fonte para cada pedaço — você precisa cobrir o conjunto, não o termo.</li>\n <li><b>Crie os perfis do seu setor.</b> Para negócio local: Perfil da Empresa e Bing Places. Para software: os diretórios de avaliação do nicho.</li>\n </ol>',ta:['T6','T7','T8','T9'],mo:'m2'},{id:'s64',t:'6.4 Fase 2 — Fazer a IA escolher você D30 a D70',h:'<p>Só agora se escreve. E se escreve o reparo que o diagnóstico apontou, não uma receita igual para todas as páginas.</p>\n\n <ol>\n <li><b>Aplique o reparo do tipo certo.</b> Intenção divergente pede remapeamento; lacuna de informação pede o dado que falta; informação velha pede atualização e data. Receita uniforme é o erro que a Parte 4 inteira existe para evitar.</li>\n <li><b>Coloque os quatro porteiros.</b> Preço ou faixa de preço escrita, data real e visível, especificações concretas, comparação honesta com as alternativas.</li>\n <li><b>Tire o “talvez”.</b> Troque “pode oferecer resultados” por afirmação verificável com a evidência ao lado. Linguagem hesitante perde citação.</li>\n <li><b>Enxugue.</b> Corte o que não responde. Página menor e mais densa pode superar a longa — foi o que um estudo de 2026 mostrou ao encurtar páginas em 53% e manter desempenho competitivo.</li>\n <li><b>Traga dado próprio.</b> Um número que só você tem — tempo médio de atendimento, número de procedimentos, resultado medido — vale mais que dez adjetivos.</li>\n </ol>\n\n <div class="mn-warn">\n <p class="mn-lbl">RESTRIÇÃO INEGOCIÁVEL</p>\n <h4>Não invente estatística para preencher a lacuna</h4>\n <p>Adicionar número falso aumenta a citação no curto prazo e destrói a credibilidade quando alguém confere. Além do problema ético, existe o técnico: um sistema de detecção publicado em 2026 identifica conteúdo otimizado para IA com F1 de <span class="mn-num">0,944</span>, inclusive nas variantes disfarçadas. <b>O critério é evidência verificável, datada e atribuída</b> — não “tem número na página”.</p>\n </div>',ta:['T10','T11','T12','T13'],mo:'m3'},{id:'s65',t:'6.5 Fase 3 — Existir fora do seu site D45 a D90',h:'<p>A unidade de trabalho aqui não é a página. É a <strong>rede de lugares onde a sua marca é mencionada</strong> — e ela pesa mais do que quase todo mundo imagina.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">O que anda junto com aparecer nos resumos de IA do Google</p><p class="mn-fig-s">Correlação medida em 75 mil marcas. Escala de 0 a 1.</p><div class="mn-bar"><span>Menções no YouTube</span><i style="width:73.7%"></i><b>0,737</b></div><div class="mn-bar"><span>Menções na web em geral</span><i style="width:66.4%"></i><b>0,664</b></div><div class="mn-bar"><span>Links com o nome da marca</span><i style="width:52.7%"></i><b>0,527</b></div><div class="mn-bar"><span>Buscas pelo nome da marca</span><i style="width:39.2%"></i><b>0,392</b></div><div class="mn-bar neu"><span>Backlinks (o que o SEO clássico persegue)</span><i style="width:21.8%"></i><b>0,218</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> ser <b>falado</b> anda muito mais junto com aparecer na IA do que ser <b>linkado</b>. Isso inverte a prioridade de orçamento da maioria das agências, que ainda vende link.\n <span class="mn-src"><b>Cuidado com a leitura.</b> Correlação não é causa. Marcas grandes naturalmente têm mais menções <em>e</em> mais visibilidade — a causa por baixo pode ser simplesmente o tamanho da marca. <span class="mn-mid">Inferência</span> A direção é consistente o bastante para priorizar menção sobre link, mas não sustenta a promessa de que “comprar menções faz você aparecer”. Fonte: Ahrefs, 75 mil marcas.</span></p></div>\n\n <ol>\n <li><b>Vídeo com transcrição.</b> É a correlação mais alta da tabela e a menos disputada em português. Um vídeo por semana respondendo a uma pergunta real da carteira.</li>\n <li><b>Entrar nas listas “melhores X em Y”.</b> São as páginas que a IA lê para montar indicação. Descubra quais são: elas estão na lista de fontes que você coletou no Teste B da Parte 4.</li>\n <li><b>Programa de avaliações.</b> Volume e recência importam. Peça avaliação no momento de maior satisfação, e responda a todas — inclusive as ruins, especialmente as ruins.</li>\n <li><b>Presença editorial de terceiros.</b> Uma matéria, um podcast, uma participação. Não precisa de veículo grande; precisa ser conteúdo que a IA consiga ler e atribuir.</li>\n </ol>\n\n <div class="mn-bl">\n <p class="mn-lbl">O QUE NÃO FAZER NESTA FASE</p>\n <h4>Comprar menção é o caminho mais rápido para o filtro de spam</h4>\n <p>Os mesmos filtros antispam da busca comum se aplicam às respostas de IA — está na documentação oficial do Google. E existe um agravante estrutural: quanto mais gente adota a mesma tática, menor o ganho de cada um. Num teste com 54 combinações de método e setor, só <b>3</b> foram positivas de forma significativa.</p>\n </div>',ta:['T14','T15'],mo:'m4'},{id:'s66',t:'6.6 Fase 4 — Ler o resultado D76 a D90',h:'<p>A fase mais curta e a mais fácil de estragar.</p>\n\n <ol>\n <li><b>Compare baseline contra janela de 28 dias.</b> Nunca semana contra semana: a variação natural do canal é maior que quase todo efeito real.</li>\n <li><b>Calcule a margem de erro dos dois lados</b> e verifique se a diferença sai dela. A calculadora da seção 5.5 faz isso.</li>\n <li><b>Compare também os concorrentes.</b> Se todo mundo subiu, quem subiu foi a plataforma, não você.</li>\n <li><b>Separe o que é reconhecimento do que é descoberta.</b> Perguntas com o nome da empresa quase sempre dão positivo e não medem visibilidade.</li>\n <li><b>Audite a fidelidade por amostra.</b> Leia 30 respostas em que você apareceu e classifique se a descrição está correta.</li>\n <li><b>Escreva o que não deu certo.</b> Um relatório que só mostra o que subiu não é relatório, é peça de venda.</li>\n </ol>\n\n <div class="mn-key">\n <p class="mn-lbl">O RESULTADO QUE NINGUÉM QUER ANUNCIAR</p>\n <h4>“Não deu para afirmar” é uma conclusão legítima</h4>\n <p>Se a diferença não sai da margem de erro, o correto é dizer exatamente isso — e mostrar quantas rodadas seriam necessárias para conseguir afirmar. Um fornecedor que <b>nunca</b> entrega esse resultado em 90 dias, para nenhum cliente, provavelmente não está medindo: está narrando.</p>\n </div>',ta:['T16','T17','T18'],mo:'m4'},{id:'s67',t:'6.7 Quem faz o quê',h:'<p>Quatro papéis. Podem ser quatro pessoas ou duas acumulando funções — o que não pode é ficar sem dono.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Faz = executa. Aprova = decide. Apoia = fornece informação. Recebe = é informado.</caption>\n <thead><tr><th scope="col">Fase</th><th scope="col">Estrategista</th><th scope="col">Redator</th><th scope="col">Dev / Analytics</th><th scope="col">Cliente</th></tr></thead>\n <tbody>\n <tr><td><b>0.</b> Medir antes de mexer</td><td><span>Faz</span></td><td><span>—</span></td><td><span class="mn-ok">Faz</span></td><td><span class="mn-mid">Aprova</span></td></tr>\n <tr><td><b>1.</b> Fazer a IA ler</td><td><span class="mn-ok">Apoia</span></td><td><span>—</span></td><td><span>Faz</span></td><td><span class="mn-mid">Apoia</span></td></tr>\n <tr><td><b>2.</b> Fazer a IA escolher</td><td><span class="mn-ok">Aprova</span></td><td><span>Faz</span></td><td><span>—</span></td><td><span class="mn-mid">Apoia</span></td></tr>\n <tr><td><b>3.</b> Existir fora do site</td><td><span>Faz</span></td><td><span class="mn-ok">Apoia</span></td><td><span>—</span></td><td><span class="mn-mid">Faz</span></td></tr>\n <tr><td><b>4.</b> Ler o resultado</td><td><span>Faz</span></td><td><span>—</span></td><td><span class="mn-ok">Apoia</span></td><td><span class="mn-mid">Recebe</span></td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>O papel que mais some.</b> “Cliente” não é figurante: o programa de avaliações e a informação real sobre preço e serviço só saem de dentro da empresa. Projeto sem dono do lado do cliente trava na Fase 3.</div>',ta:['T17']},{id:'s68',t:'6.8 Esforço e custo',h:'<p>Dimensionamento para um negócio de porte médio, um mercado, um idioma.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Dedicação por fase, em fração de uma pessoa em tempo integral. <span class="mn-mid">Estimativa</span> Números de planejamento, não de contrato.</caption>\n <thead><tr><th scope="col">Fase</th><th scope="col">Estrategista</th><th scope="col">Redator</th><th scope="col">Dev</th><th scope="col">Cliente</th></tr></thead>\n <tbody>\n <tr><td><b>0.</b> D1–21</td><td class="mn-num">0,3</td><td class="mn-num">—</td><td class="mn-num">0,4</td><td class="mn-num">0,05</td></tr>\n <tr><td><b>1.</b> D15–45</td><td class="mn-num">0,2</td><td class="mn-num">—</td><td class="mn-num">0,4</td><td class="mn-num">0,1</td></tr>\n <tr><td><b>2.</b> D30–70</td><td class="mn-num">0,2</td><td class="mn-num">0,5</td><td class="mn-num">0,05</td><td class="mn-num">0,1</td></tr>\n <tr><td><b>3.</b> D45–90</td><td class="mn-num">0,3</td><td class="mn-num">0,2</td><td class="mn-num">—</td><td class="mn-num">0,15</td></tr>\n <tr><td><b>4.</b> D76–90</td><td class="mn-num">0,15</td><td class="mn-num">—</td><td class="mn-num">0,1</td><td class="mn-num">—</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-box">\n <p class="mn-lbl">ONDE O DINHEIRO REALMENTE VAI</p>\n <h4>A ferramenta é o item mais barato do projeto</h4>\n <p>Com a configuração mínima defensável — 30 perguntas, 3 motores, 7 repetições por dia — dá cerca de <b>19 mil consultas por mês</b>. Rodando por API própria, isso costuma custar algumas centenas de reais mensais; em ferramenta pronta, os planos que <em>realmente</em> permitem esse volume não são os de entrada. <span class="mn-mid">Estimativa</span> Use a calculadora da seção 5.3 com o seu custo por consulta.</p>\n <p>O custo dominante é <b>pessoa</b>: a Fase 2 sozinha consome meio redator por seis semanas. Qualquer proposta em que o painel custa mais que a execução está vendendo o item errado.</p>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">SE VOCÊ SÓ PUDER FAZER UMA COISA</p>\n <h4>Rode a Fase 0 e pare</h4>\n <p>Vinte perguntas, sete repetições, catorze dias. Custa uma semana de trabalho de meio período e responde a pergunta que decide todo o resto: <b>qual dos três ramos da Parte 4 é o seu.</b> Sem isso, qualquer contrato de 90 dias é aposta. Com isso, você negocia sabendo o que está comprando — e consegue recusar o que não precisa.</p>\n </div>'}]},{id:'p7',tag:'PARTE 7',t:'Ferramentas',r:'Quanto custa, o que cada plano realmente entrega, e como decidir entre comprar pronto ou montar o seu.',s:[{id:'s71',t:'7.1 O que existe e quanto custa',h:'<p>Preços de tabela consultados em <b>setembro de 2026</b>. Este é o dado que envelhece mais rápido do manual — confira antes de decidir.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Planos de entrada. A última coluna é calculada: quantas consultas por dia seriam necessárias para atingir o piso estatístico da Parte 5 — 7 repetições por pergunta, em 3 motores.</caption>\n <thead><tr><th scope="col">Ferramenta</th><th scope="col">Entrada</th><th scope="col">Perguntas incluídas</th><th scope="col">Repetições publicadas</th><th scope="col">Consultas/dia necessárias</th></tr></thead>\n <tbody>\n <tr><td><b>Rankscale</b></td><td class="mn-num">€20/mês</td><td>“ilimitado” no plano de entrada</td><td><span class="mn-no">Não divulga</span></td><td>—</td></tr>\n <tr><td><b>Otterly.ai</b> Lite</td><td class="mn-num">US$29/mês</td><td class="mn-num">15</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">315</td></tr>\n <tr><td><b>Peec AI</b></td><td class="mn-num">€75–89/mês</td><td class="mn-num">~25</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">525</td></tr>\n <tr><td><b>Semrush AI Toolkit</b></td><td class="mn-num">US$99/mês</td><td class="mn-num">~25</td><td>300 consultas/dia no total</td><td class="mn-num">525</td></tr>\n <tr><td><b>Profound</b> Starter</td><td class="mn-num">US$99/mês</td><td class="mn-num">50</td><td><b>1.500 respostas/mês</b> — dá 1 por pergunta por dia</td><td class="mn-num">1.050</td></tr>\n <tr><td><b>Scrunch AI</b></td><td class="mn-num">US$100–250/mês</td><td class="mn-num">~100</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">2.100</td></tr>\n <tr><td><b>AthenaHQ</b></td><td class="mn-num">US$295/mês</td><td>3.600 créditos/mês</td><td><span class="mn-no">Não divulga</span></td><td>—</td></tr>\n <tr><td><b>Otterly.ai</b> Premium</td><td class="mn-num">US$489/mês</td><td class="mn-num">400</td><td><span class="mn-no">Não divulga</span></td><td class="mn-num">8.400</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">DETALHE CARO QUE PASSA BATIDO</p>\n <h4>O motor que mais cita costuma ser cobrado à parte</h4>\n <p>Na Otterly.ai, os quatro motores inclusos em todos os planos são ChatGPT, AI Overviews, Perplexity e Copilot. <b>Google AI Mode, Gemini e Claude são complementos pagos</b>, de US$9 a US$439 por mês conforme o plano. Volte à figura da seção 1.4: o AI Mode responde por <b>54,3%</b> das citações medidas. Você pode assinar a ferramenta e continuar cego para a maior superfície do mercado.</p>\n </div>',ta:['T2']},{id:'s72',t:'7.2 A coluna que ninguém publica',h:'<p>Procurei a frequência de execução em três análises independentes do setor. Todas registram a mesma coisa: <strong>não divulgado</strong>.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><b>0 de 9</b><span>ferramentas comparadas publicam quantas vezes repetem a mesma pergunta por dia</span></div>\n <div class="mn-bl"><b>1×</b><span>por dia é o que dá para calcular do único fornecedor que publica volume de respostas</span></div>\n <div class="mn-bl"><b>0,370</b><span>é a margem de erro de 1 repetição — a medição não distingue 20% de 60%</span></div>\n <div class="mn-bl"><b>7×</b><span>por dia é o piso publicado na literatura para a estimativa parar de balançar</span></div>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">A CONTA DA PROFOUND, PASSO A PASSO</p>\n <h4>50 perguntas, 1.500 respostas por mês</h4>\n <p>1.500 ÷ 50 = <b>30 respostas por pergunta por mês</b>. Trinta dias no mês. Portanto: <b>1 rodada por pergunta por dia</b>, somando todos os motores. É o plano de entrada da ferramenta mais capitalizada do setor, e ele roda exatamente na configuração que a figura 5.1 mostra ser não informativa.</p>\n <p>Isso não quer dizer que a ferramenta seja ruim. Quer dizer que <b>o plano de entrada não serve para provar resultado</b> — serve para acompanhar tendência grossa. Se o contrato promete comprovação, o plano precisa ser outro.</p>\n </div>\n\n <div class="mn-bl"><b>Por que ninguém publica.</b> <span class="mn-mid">Inferência</span> Repetição é o principal custo variável dessas ferramentas: cada rodada é uma chamada paga de API. Publicar o número transformaria a comparação em disputa de custo por consulta — e tornaria explícito que os planos baratos rodam pouco.</div>'},{id:'s73',t:'7.3 Comprar pronto ou montar o seu?',h:'<p>Não existe resposta única. Existe uma pergunta que resolve: <strong>você precisa provar resultado ou acompanhar tendência?</strong></p>\n\n <div class="mn-bl">\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que faz sentido</dt><dd class="mn-lead">Plano de entrada de US$20 a US$30, ou o teste manual grátis da seção 7.5. Nos dois casos você está comprando <b>direção</b>, não prova.</dd></div>\n <div class="mn-bl"><dt>O que exigir</dt><dd>Que o AI Mode do Google esteja incluso, e não como complemento pago. É a superfície que mais cita.</dd></div>\n <div class="mn-bl"><dt>Onde não gastar</dt><dd>Não pague por relatório semanal bonito. Com 1 rodada por pergunta, a linha que sobe e desce é ruído.</dd></div>\n <div class="mn-bl"><dt>Custo mensal</dt><dd><b>R$ 0 a R$ 200</b> <span class="mn-mid">Estimativa</span></dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>Por quê</dt><dd class="mn-lead">Nenhum plano de entrada permite 7 repetições por pergunta por dia. Para chegar lá numa ferramenta pronta você entra no tier de centenas de dólares — e ainda assim não controla o protocolo.</dd></div>\n <div class="mn-bl"><dt>O que você ganha</dt><dd>Controle sobre repetições, janela e denominador. Guarda a resposta bruta. E consegue responder “quantas rodadas?” sem desviar do assunto.</dd></div>\n <div class="mn-bl"><dt>O que você paga</dt><dd>Chamadas de API mais o tempo de quem monta. A arquitetura está na seção 7.4.</dd></div>\n <div class="mn-bl"><dt>Custo mensal</dt><dd><b>Centenas de reais em API</b>, para 30 perguntas × 3 motores × 7 rodadas <span class="mn-mid">Estimativa</span></dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que faz sentido</dt><dd class="mn-lead">A escala de perguntas e idiomas justifica o produto pronto. Mas não entregue a validação do resultado a quem vende o resultado.</dd></div>\n <div class="mn-bl"><dt>O que exigir por contrato</dt><dd>Número de repetições por pergunta por dia, janela de agregação, e <b>acesso à resposta bruta</b>. Sem o texto original você não consegue reprocessar nem auditar.</dd></div>\n <div class="mn-bl"><dt>Auditoria paralela</dt><dd>Rode o seu próprio coletor em 20 perguntas críticas. Serve de controle: se os dois discordam muito, a diferença é o protocolo.</dd></div>\n <div class="mn-bl"><dt>Custo mensal</dt><dd><b>US$300 a US$800</b> em ferramenta, mais o coletor de auditoria <span class="mn-mid">Estimativa</span></dd></div>\n </dl>\n </div>\n </div>'},{id:'s74',t:'7.4 Montar o seu coletor',h:'<p class="mn-deep">A arquitetura é simples e não exige time de dados. Sete blocos.</p>\n\n \n\n <div class="mn-bl">\n <table>\n <caption>Esquema mínimo de três tabelas. Nomes ilustrativos.</caption>\n <thead><tr><th scope="col">Tabela</th><th scope="col">Guarda</th><th scope="col">Campos que não podem faltar</th></tr></thead>\n <tbody>\n <tr><td><span class="mn-num">perguntas</span></td><td>A carteira congelada</td><td>id, texto, intenção, cliente, idioma, cidade, data de congelamento</td></tr>\n <tr><td><span class="mn-num">rodadas</span></td><td>Uma linha por consulta</td><td>id, pergunta_id, motor, versão do modelo, data e hora, localização informada, <b>resposta bruta</b>, buscou_na_web (sim/não)</td></tr>\n <tr><td><span class="mn-num">leituras</span></td><td>O que o extrator concluiu</td><td>rodada_id, marca_apareceu, posição, domínios citados, tom, descrição correta (sim/não), versão do extrator</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>Por que “versão do extrator”.</b> Guardando a versão, você consegue reprocessar todo o histórico quando melhorar a lógica e comparar as duas leituras. Sem isso, cada melhoria no extrator cria uma quebra artificial na série.</div>',ta:['T2']},{id:'s75',t:'7.5 O que dá para fazer sem gastar nada',h:'<p>Antes de assinar qualquer coisa, este teste responde a pergunta mais importante — e custa uma tarde.</p>\n\n <ol>\n <li><b>Escolha 10 perguntas de descoberta.</b> Nada de perguntas com o nome da sua empresa.</li>\n <li><b>Abra uma janela anônima</b> e confira a localização que o navegador informa.</li>\n <li><b>Rode cada pergunta 7 vezes</b> em ChatGPT, Google AI Mode e Perplexity. São 210 consultas — cerca de três horas.</li>\n <li><b>Anote numa planilha:</b> uma linha por rodada, com pergunta, motor, se buscou na web, se a sua marca apareceu, e quais domínios foram citados.</li>\n <li><b>Calcule</b> em quantas das 210 você apareceu. Esse número, com a calculadora da seção 5.5, já é um baseline defensável.</li>\n </ol>\n\n <div class="mn-box">\n <p class="mn-lbl">ONDE ESSE MÉTODO QUEBRA</p>\n <h4>Serve para diagnosticar, não para acompanhar</h4>\n <p>Manual funciona bem para descobrir <b>qual dos três ramos da Parte 4 é o seu</b> — que é a decisão de maior valor do processo inteiro. O que ele não faz é rodar todo dia por 90 dias sem alguém perder a paciência. A partir do momento em que a medição vira rotina, ou você automatiza ou você compra. Fazer manualmente por três meses é o caminho mais caro dos três.</p>\n </div>',ta:['T2']}]},{id:'p8',tag:'PARTE 8',t:'Casos e metas defensáveis',r:'O que os casos publicados realmente mostram, o que dá para prometer sem esticar, e como auditar uma proposta antes de assinar.',s:[{id:'s81',t:'8.1 O melhor caso que existe, desmontado',h:'<p>Um estudo de 2026 acompanhou páginas tratadas e não tratadas num site real. É a evidência de campo mais forte disponível. Veja o que acontece com o número quando se desconta o que teria acontecido de qualquer jeito.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">De 5,7 vezes para 1,82 vez</p><p class="mn-fig-s">Aumento nas visitas vindas do ChatGPT, antes e depois do desconto.</p><p class="mn-fig-a">Cascata: aumento bruto de 5,7 vezes nas páginas tratadas; as páginas não tratadas subiram 3,5 vezes sozinhas; o ganho realmente atribuível é 1,82 vez, com intervalo de 1,31 a 2,54.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> o número que uma agência colocaria no slide é <b>5,7×</b>. O número honesto é <b>1,82×</b> — e mesmo esse vem com uma faixa larga e um teste de controle que não foi conclusivo. Quem promete cinco vezes está vendendo o crescimento da plataforma como se fosse trabalho seu.\n <span class="mn-src">Fonte: Watanabe &amp; Nakayashiki (2026), série temporal controlada. Sugestivo, não causalmente estabelecido.</span></p></div>'},{id:'s82',t:'8.2 Os casos que circulam, com a metodologia aberta',h:'<div class="mn-tw">\n <table>\n <caption>O resultado alegado vale pouco sem a coluna do meio.</caption>\n <thead><tr><th scope="col">Caso</th><th scope="col">O que alegam</th><th scope="col">Como foi medido</th><th scope="col">O que dá para aproveitar</th></tr></thead>\n <tbody>\n <tr><td><b>Watanabe &amp; Nakayashiki</b> (2026)</td><td>5,7× nas visitas vindas do ChatGPT</td><td><span class="mn-ok">Série temporal com grupo de comparação</span> Placebo temporal não conclusivo</td><td>O método de desconto. É o que transforma 5,7 em 1,82</td></tr>\n <tr><td><b>Rioja</b> (2026)</td><td>Citação de 10% para 46% em 6 semanas, em 50 termos</td><td><span class="mn-mid">Baseline de 3 semanas, janela anônima, repetição</span> Um site só, sem controle, autor interessado</td><td>A disciplina de medir antes. Não o percentual</td></tr>\n <tr><td><b>Casos de agência</b> (vários)</td><td>3,2× · +559% · 6× em testes gratuitos</td><td><span class="mn-no">Sem grupo de controle</span> As plataformas cresciam 30–50% por trimestre no período</td><td>Praticamente nada. Parte do ganho é a plataforma</td></tr>\n <tr><td><b>Aggarwal et al.</b> (KDD 2024)</td><td>“+40% de visibilidade”</td><td><span class="mn-no">Contexto fixo, documentos já entregues ao modelo</span></td><td>O mecanismo. Nunca o número como promessa</td></tr>\n <tr><td><b>Puerto et al.</b> (2025)</td><td>Resultado negativo: 3 de 54 combinações positivas</td><td><span class="mn-ok">1.900 buscas, 16.360 documentos, vários setores</span></td><td>O corretivo mais importante da área. Ganho erode com adoção</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">O TESTE DE UMA PERGUNTA</p>\n <h4>“O que aconteceu com as páginas que vocês não tocaram?”</h4>\n <p>Se a resposta for “não medimos”, o número apresentado é bruto e você não tem como saber quanto dele é trabalho. Essa única pergunta separa o caso de <b>1,82×</b> dos casos de <b>6×</b>.</p>\n </div>'},{id:'s83',t:'8.3 Metas que dá para assinar',h:'<p>Nenhuma delas é posição, porque posição não existe neste canal. Todas são faixas, porque faixa é o que a evidência sustenta.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Referências para 90 dias, partindo de um baseline medido. <span class="mn-mid">Estimativa</span> Faixas de planejamento, calibradas pela literatura — não garantias.</caption>\n <thead><tr><th scope="col">Situação inicial</th><th scope="col">Meta realista em 90 dias</th><th scope="col">O que <u>não</u> prometer</th></tr></thead>\n <tbody>\n <tr><td><b>Ramo C</b> — domínio nunca citado</td><td>Sair de zero e chegar a aparecer nas fontes em parte das perguntas. A taxa de detecção de marca pode continuar baixa</td><td>Qualquer número de detecção. Você ainda está resolvendo o gargalo anterior</td></tr>\n <tr><td><b>Ramo B</b> — citado como fonte, marca ausente</td><td>Cobertura de perguntas subindo para a faixa de <b>40% a 60%</b> em nicho geográfico</td><td>Prazo curto. O reparo tem atraso de 2 a 4 semanas para aparecer</td></tr>\n <tr><td><b>Ramo A</b> — já aparece pouco</td><td>Taxa de detecção subindo <b>além da margem de erro</b> medida. É o critério, não um percentual fixo</td><td>Multiplicador. “Dobrar a detecção” não tem base na literatura</td></tr>\n <tr><td><b>Visitas vindas de IA</b></td><td>Da ordem de <b>1,3× a 2,5×</b>, depois de descontar o crescimento da plataforma</td><td>5× ou mais. Esse é o número bruto de um caso, não o efeito</td></tr>\n <tr><td><b>Fidelidade</b></td><td>Acima de <b>90%</b> das menções descrevendo a empresa corretamente</td><td>100%. A IA erra mesmo com dados consistentes</td></tr>\n </tbody>\n </table>\n </div>',ta:['T18']},{id:'s84',t:'8.4 Auditar uma proposta antes de assinar',h:'<p>Doze sinais de alerta. Três ou mais marcados e vale pedir esclarecimento por escrito antes de fechar.</p>',ir:['diag','Abrir as perguntas de auditoria']},{id:'s85',t:'8.5 As dez perguntas para fazer antes de contratar',h:'<p>Com a resposta que você deveria ouvir ao lado.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Se a resposta divergir muito da coluna da direita, peça a justificativa por escrito.</caption>\n <thead><tr><th scope="col">Pergunte</th><th scope="col">Resposta que sustenta</th></tr></thead>\n <tbody>\n <tr><td>1. Quantas vezes vocês repetem cada pergunta por dia?</td><td>“Sete ou mais, por motor.” Menos que isso precisa de justificativa</td></tr>\n <tr><td>2. Qual a janela de agregação do relatório?</td><td>“Vinte e oito dias corridos, rolante.” Semanal não sustenta decisão</td></tr>\n <tr><td>3. Quantas perguntas e quais intenções?</td><td>“Vinte a trinta, com descoberta, comparação, problema e validação separadas”</td></tr>\n <tr><td>4. Quais motores, e o AI Mode está incluso?</td><td>“Pelo menos três, com AI Mode incluído no preço”</td></tr>\n <tr><td>5. As rodadas em que a IA não buscou entram na conta?</td><td>“Entram no denominador.” Se não, o número está inflado</td></tr>\n <tr><td>6. Vocês medem concorrentes nas mesmas perguntas?</td><td>“Sim, os mesmos três, nas mesmas perguntas”</td></tr>\n <tr><td>7. Eu recebo a resposta bruta?</td><td>“Sim, exportável.” Sem isso não há auditoria possível</td></tr>\n <tr><td>8. O que vocês fazem se o resultado não sair da margem de erro?</td><td>“Reportamos que não deu para afirmar e mostramos quantas rodadas faltariam”</td></tr>\n <tr><td>9. Qual foi o resultado do último cliente que <b>não</b> deu certo?</td><td>Qualquer resposta concreta. “Nunca aconteceu” é sinal de que não medem</td></tr>\n <tr><td>10. O que acontece nos primeiros 21 dias?</td><td>“Baseline. Não mexemos no site.” Quem começa escrevendo pulou o diagnóstico</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O ATALHO</p>\n <h4>Se você só puder fazer uma pergunta, faça a primeira</h4>\n <p>“Quantas repetições por pergunta por dia?” é a única pergunta cuja resposta não dá para improvisar. Quem mede sabe o número de cabeça. Quem não mede desvia para o painel.</p>\n </div>',ta:['T18']}]},{id:'p9',tag:'PARTE 9',t:'Tendências',r:'Sete movimentos com evidência já publicada, e o que fazer em relação a cada um nos próximos 60 dias.',s:[{id:'s91',t:'9.1 O que já aconteceu',h:'<p>A linha do tempo importa porque explica a direção. Repare que os dois movimentos mais recentes são de <strong>monetização</strong>.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Doze meses que mudaram o canal</p><p class="mn-fig-s">Marcos verificáveis, com fonte primária quando existe.</p><p class="mn-fig-a">Linha do tempo: fevereiro de 2026, OpenAI começa a testar anúncios no ChatGPT nos Estados Unidos; maio de 2026, Google publica o guia oficial; I/O 2026, protocolo de comércio agêntico expandido; 11 de agosto de 2026, anúncios ficam ativos no Brasil; setembro de 2026, fechamento deste manual.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> o teste de anúncios começou nos EUA em fevereiro e, em <b>11 de agosto de 2026</b>, ficou ativo no Brasil, no Reino Unido, no México, no Japão e na Coreia do Sul — nos planos Free e Go; Plus, Pro, Business, Enterprise e Education seguem sem anúncios. Não é mais “o que vem por aí”: já está acontecendo no seu mercado.\n <span class="mn-src">Fontes: OpenAI (comunicado oficial sobre teste de anúncios); cobertura da expansão de 11/ago/2026; Google Search Central (guia de mai/2026).</span></p></div>'},{id:'s92',t:'9.2 As sete tendências',h:'<div class="mn-bl">\n <div class="mn-bl">\n <p>1</p>\n <h4>O AI Mode é o campo que decide</h4>\n <p><b>O dado:</b> 54,3% das citações medidas no setor de mídia. Mais que ChatGPT e Perplexity somados. E, ao contrário do resumo do topo, ali <b>ou você é citado ou não existe</b>.</p>\n <p><b>Faça em 60 dias:</b> separe a medição de AI Overviews e AI Mode. São superfícies diferentes com ecossistemas de fonte diferentes. E confira se a sua ferramenta cobre o AI Mode sem cobrar à parte.</p>\n </div>\n <div class="mn-bl">\n <p>2</p>\n <h4>Estar bem no Google já não prevê citação</h4>\n <p><b>O dado:</b> as páginas do top 10 respondiam por cerca de 76% das citações em meados de 2025 e por volta de 38% no início de 2026.</p>\n <p><b>Faça em 60 dias:</b> pare de usar posição como indicador aproximado. O que passou a pesar é relevância no nível do trecho e <b>consistência da informação entre fontes</b> — audite isso fora do site, não só dentro.</p>\n </div>\n <div class="mn-bl">\n <p>3</p>\n <h4>O espaço orgânico está sendo comprimido</h4>\n <p><b>O dado:</b> anúncios ativos no ChatGPT no Brasil desde agosto de 2026, nos planos gratuitos. O Google já roda anúncios dentro do resumo de IA.</p>\n <p><b>Faça em 60 dias:</b> trate a citação orgânica como ativo com prazo. <span class="mn-mid">Inferência</span> O padrão do orgânico do Google tende a se repetir: a camada paga cresce e a orgânica encolhe. Quem constrói posição agora paga menos por ela.</p>\n </div>\n <div class="mn-bl">\n <p>4</p>\n <h4>A compra acontece dentro da resposta</h4>\n <p><b>O dado:</b> protocolos de comércio agêntico em produção nos dois ecossistemas, lendo <b>feeds estruturados</b> direto. No I/O 2026 isso se estendeu a reserva de hotel e delivery local.</p>\n <p><b>Faça em 60 dias:</b> se você vende produto ou serviço agendável, a saúde do feed passa a determinar se você aparece. Zero produtos reprovados, atualização em 24h.</p>\n </div>\n <div class="mn-bl">\n <p>5</p>\n <h4>Sentimento substitui contagem</h4>\n <p><b>O dado:</b> só 51,5% das frases geradas eram totalmente sustentadas pela fonte citada. Contar aparições sem ler o que foi dito registra erro como acerto.</p>\n <p><b>Faça em 60 dias:</b> adicione classificação de tom ao seu coletor. É trivial de implementar e ainda é diferencial — a maioria dos painéis só conta.</p>\n </div>\n <div class="mn-bl">\n <p>6</p>\n <h4>Pergunta ativa a IA; termo não</h4>\n <p><b>O dado:</b> 13,7% de ativação de resumo de IA na média, contra 64,7% em buscas escritas como pergunta. Quase cinco vezes mais.</p>\n <p><b>Faça em 60 dias:</b> reorganize a arquitetura de conteúdo por perguntas reais. É a mesma lógica que o AI Mode usa quando quebra uma pergunta em várias.</p>\n </div>\n <div class="mn-bl">\n <p>7</p>\n <h4>Procedência do conteúdo</h4>\n <p><b>O dado:</b> o Google expandiu marcação de origem e credenciais de procedência na busca e no navegador.</p>\n <p><b>Faça em 60 dias:</b> nada de grande. <span class="mn-mid">Especulação</span> Se procedência verificável virar sinal de confiança na escolha de fontes, conteúdo com autoria certificada ganha vantagem estrutural. Vale monitorar, não vale investir pesado ainda.</p>\n </div>\n </div>\n\n <div class="mn-fig"><p class="mn-fig-t">A queda que sustenta a tendência 2</p><p class="mn-fig-s">Fatia das citações em resumos de IA que vinham de páginas do top 10 orgânico.</p><div class="mn-bar"><span>Meados de 2025</span><i style="width:76%"></i><b>~76%</b></div><div class="mn-bar"><span>Início de 2026</span><i style="width:38%"></i><b>~38%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> em pouco mais de meio ano, a fatia caiu pela metade. Reforço independente: <b>53%</b> dos domínios citados nos resumos de IA não estavam no top 10 orgânico daquela busca. Continuar tratando posição como termômetro de visibilidade em IA é medir a coisa errada.\n <span class="mn-src">Fontes: análises de citação em resumos de IA, 2025–2026; Ahrefs (sobreposição citação × orgânico).</span></p></div>'},{id:'s93',t:'9.3 O que monitorar daqui pra frente',h:'<div class="mn-bl">\n <table>\n <caption>Cinco sinais que mudariam as recomendações deste manual.</caption>\n <thead><tr><th scope="col">Sinal</th><th scope="col">Por que muda o jogo</th><th scope="col">Onde acompanhar</th></tr></thead>\n <tbody>\n <tr><td>Anúncios dentro das respostas <b>locais</b></td><td>Hoje não há compra de posição na resposta orgânica local. Se houver, o cálculo de retorno muda inteiro</td><td>Comunicados oficiais da OpenAI e do Google Ads</td></tr>\n <tr><td>Filtro contra conteúdo otimizado para IA</td><td>Já existe detecção publicada com F1 de 0,944. Se algum motor passar a filtrar, a camada persuasiva morre e sobra a estrutural</td><td>Documentação de spam do Google; anúncios dos motores</td></tr>\n <tr><td>Dados de citação <b>em português</b></td><td>Todo percentual deste manual vem de estudo em inglês. O primeiro benchmark sério em português recalibra tudo</td><td>Publicações acadêmicas e estudos de mercado nacionais</td></tr>\n <tr><td>Mudança na fonte de dados locais do ChatGPT</td><td>Ele lê Perfil da Empresa e bases de lugares. Trocar de fornecedor muda onde vale investir</td><td>Anúncios de parceria da OpenAI</td></tr>\n <tr><td>Cobrança pelo acesso de robôs</td><td>Se ler o seu site virar transação paga, a economia da citação muda para os dois lados</td><td>Padrões de licenciamento de conteúdo para IA</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">VALIDADE DESTE MATERIAL</p>\n <h4>Trate os números como perecíveis</h4>\n <p>Os dados foram fechados em <b>setembro de 2026</b>. Os achados experimentais — os quatro porteiros, as curvas de margem de erro, a taxonomia de falhas — devem envelhecer bem, porque descrevem mecanismo. Já os percentuais de mercado, os preços de ferramenta e a lista de países com anúncios envelhecem em <b>meses</b>. Reveja em <b>março de 2027</b>.</p>\n </div>'}]},{id:'p10',tag:'PARTE 10',t:'Anexos',r:'Os modelos prontos. Esta parte é feita para ser impressa ou copiada, não lida.',s:[{id:'a1',t:'A1 · Checklist mestre dos 90 dias',h:'<p>Os dezoito itens que fecham os quatro marcos. O estado fica salvo no seu navegador.</p>',ir:['programa','Abrir o checklist dos 90 dias']},{id:'a2',t:'A2 · Modelo da carteira de perguntas',h:'<p class="mn-deep">Copie a estrutura. Três formas de dizer cada necessidade, no máximo um quarto da carteira em validação.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Estrutura em branco. Meta: 20 a 30 linhas no total.</caption>\n <thead><tr><th scope="col">#</th><th scope="col">Intenção</th><th scope="col">Pergunta, escrita como o cliente fala</th><th scope="col">Cidade / idioma</th><th scope="col">Concorrentes a marcar</th></tr></thead>\n <tbody>\n <tr><td class="mn-num">01</td><td>Descoberta</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">02</td><td>Descoberta</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">03</td><td>Descoberta</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">…</td><td>Comparação</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">…</td><td>Problema</td><td>_______________________</td><td>________</td><td>________</td></tr>\n <tr><td class="mn-num">…</td><td>Validação <span class="mn-mid">máx. 25%</span></td><td>_______________________</td><td>________</td><td>________</td></tr>\n </tbody>\n </table>\n </div>',ir:['carteira','Abrir a carteira de perguntas']},{id:'a3',t:'A3 · Modelo da matriz de diagnóstico',h:'<p class="mn-deep">Uma linha por pergunta da carteira. Preencher depois dos 14 dias de baseline.</p>\n\n <div class="mn-bl">\n <table>\n <caption>É este documento — e não o painel — que define o trabalho das dez semanas seguintes.</caption>\n <thead><tr><th scope="col">Pergunta</th><th scope="col">Ativou busca?</th><th scope="col">Domínio citado?</th><th scope="col">Marca citada?</th><th scope="col">Ramo</th><th scope="col">Tipo de falha</th><th scope="col">Ação</th></tr></thead>\n <tbody>\n <tr><td>___________</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td>A · B · C</td><td>intenção · informação · data · local</td><td>___________</td></tr>\n <tr><td>___________</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td>A · B · C</td><td>intenção · informação · data · local</td><td>___________</td></tr>\n <tr><td>___________</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td class="mn-num">_/7</td><td>A · B · C</td><td>intenção · informação · data · local</td><td>___________</td></tr>\n </tbody>\n </table>\n </div>',ir:['diag','Abrir a matriz de diagnóstico']},{id:'a4',t:'A4 · Estrutura do relatório mensal',h:'<p class="mn-deep">Sete blocos. O sexto é o que separa relatório de peça de venda.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Estrutura mínima. Um relatório sem os blocos 4, 6 e 7 não permite auditoria.</caption>\n <thead><tr><th scope="col">#</th><th scope="col">Bloco</th><th scope="col">O que precisa estar escrito</th></tr></thead>\n <tbody>\n <tr><td class="mn-num">1</td><td>Protocolo</td><td>Número de perguntas, repetições por dia, motores, janela de agregação, período coberto. <b>Sempre na primeira página</b></td></tr>\n <tr><td class="mn-num">2</td><td>Taxa de detecção</td><td>O número, com a faixa de erro de 95% ao lado. Comparado ao baseline, nunca ao mês anterior isolado</td></tr>\n <tr><td class="mn-num">3</td><td>Cobertura e fontes</td><td>Perguntas com pelo menos uma aparição, e presença do domínio nas citações</td></tr>\n <tr><td class="mn-num">4</td><td>Concorrentes</td><td>Os mesmos três, nas mesmas perguntas, no mesmo período</td></tr>\n <tr><td class="mn-num">5</td><td>Fidelidade e tom</td><td>Amostra de 30 menções, classificadas em correta, incompleta ou errada, e o tom</td></tr>\n <tr><td class="mn-num">6</td><td>O que não deu certo</td><td>Ações executadas sem efeito mensurável, e o que ficou de fora do prazo</td></tr>\n <tr><td class="mn-num">7</td><td>Decisão</td><td>Uma frase: seguir, ajustar ou parar — e o que sustenta a escolha</td></tr>\n </tbody>\n </table>\n </div>',ta:['T17','T18']},{id:'a5',t:'A5 · Bibliografia',h:'<p class="mn-deep">Oito trabalhos. Se for ler três, leia o primeiro, o segundo e o quinto.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Nível de evidência conforme a escada da seção 3.1.</caption>\n <thead><tr><th scope="col">Trabalho</th><th scope="col">Nível</th><th scope="col">Por que ler</th></tr></thead>\n <tbody>\n <tr><td><b>Martinez</b> (2026). <em>A Critical Survey of Generative Engine Optimization 2023–2026</em>. arXiv 2607.14035</td><td><span class="mn-ok">Revisão</span></td><td>A única síntese honesta da área. Hierarquia de confiança por afirmação e protocolo de medição</td></tr>\n <tr><td><b>Vishwakarma, Kumar e Jamidar</b> (SIGIR 2026). <em>What Gets Cited</em>. arXiv 2605.25517</td><td><span class="mn-ok">C</span></td><td>252 mil rodadas, 6 modelos, marcas anonimizadas. De onde vêm os quatro porteiros</td></tr>\n <tr><td><b>Schulte, Bleeker e Kaufmann</b> (2026). <em>Don\'t Measure Once</em>. arXiv 2604.07585</td><td><span class="mn-ok">B</span></td><td>Define o padrão de medição: 7 a 8 repetições, janela de 2 a 4 semanas. Código e dados públicos</td></tr>\n <tr><td><b>Tian et al.</b> (2026). <em>Diagnosing and Repairing Citation Failures</em>. arXiv 2603.09296</td><td><span class="mn-mid">C/D</span></td><td>A taxonomia de falhas que sustenta a Parte 4 inteira</td></tr>\n <tr><td><b>Puerto et al.</b> (2025). <em>C-SEO Bench</em></td><td><span class="mn-ok">B/C</span></td><td>O corretivo. Receita genérica quase não transfere, e o ganho erode com a adoção</td></tr>\n <tr><td><b>Kim et al.</b> (2026). <em>SAGEO Arena</em></td><td><span class="mn-ok">B</span></td><td>O único teste do caminho completo. Mostra que otimizar o texto pode piorar a recuperação</td></tr>\n <tr><td><b>Aggarwal et al.</b> (KDD 2024). arXiv 2311.09735</td><td><span class="mn-no">E</span></td><td>O trabalho fundacional. Leia sabendo que o “+40%” é condicional a um contexto fixo</td></tr>\n <tr><td><b>Google Search Central</b>. <em>Optimizing your website for generative AI features</em> (mai/2026)</td><td><span>Fonte primária</span></td><td>O que <b>não</b> fazer, dito pela própria plataforma</td></tr>\n </tbody>\n </table>\n </div>'},{id:'a6',t:'A6 · Nota metodológica',h:'<p>Como os números deste manual foram tratados, para você poder discordar com base.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Três origens diferentes, com pesos diferentes. Estão misturadas em todo material do mercado; aqui estão separadas.</caption>\n <thead><tr><th scope="col">Origem</th><th scope="col">Como aparece no texto</th><th scope="col">Quanto confiar</th></tr></thead>\n <tbody>\n <tr><td><b>Achado experimental</b><br>revisado ou aceito em conferência</td><td>Citado com autor e ano, e com o desenho do estudo descrito</td><td>Alto para o mecanismo. Menor para transferir o número ao seu caso</td></tr>\n <tr><td><b>Dado de mercado</b><br>de empresa que vende ferramenta do setor</td><td>Citado com a fonte nomeada</td><td>Direcional. Há incentivo comercial em números altos. Nunca use como meta</td></tr>\n <tr><td><b>Raciocínio próprio</b></td><td>Marcado com <span class="mn-mid">Inferência</span> ou <span class="mn-mid">Especulação</span></td><td>É opinião fundamentada, não evidência. Discorde à vontade</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O QUE ESTE MANUAL NÃO FAZ</p>\n <h4>Três limites honestos</h4>\n <p><b>1.</b> Quase todo estudo citado é em inglês, com dados dos Estados Unidos. Não existe, até setembro de 2026, benchmark público sólido sobre quais fontes a IA cita em perguntas feitas em português. Os percentuais são <b>direção</b>, não valores do seu setor.</p>\n <p><b>2.</b> Nenhuma técnica aqui tem efeito causal comprovado sobre receita. O que está sustentado é influência sobre citação, e mesmo essa varia por motor e ao longo do tempo.</p>\n <p><b>3.</b> O canal está sendo monetizado enquanto você lê. Um plano de doze meses aposta que a janela orgânica continua aberta — e essa aposta não está sob o seu controle.</p>\n </div>\n\n <div class="mn-box">\n <p class="mn-lbl">A FRASE QUE RESUME O MANUAL</p>\n <h4>O padrão-ouro não é uma técnica de escrita</h4>\n <p>É um ciclo de <b>diagnóstico e medição estatisticamente válido</b> aplicado sobre fundamentos de recuperação sólidos. Quem entrega isso tem um produto defensável. Quem entrega reescrita persuasiva com relatório de uma consulta por semana está vendendo ruído com aparência de gráfico.</p>\n </div>',ta:['T3']}]},{id:'p11',tag:'COLETA',t:'A rotina e as dúvidas',r:'Como coletar, o que conta como aparecer, e as 24 dúvidas da primeira semana.',s:[{id:'d1',t:'A rotina de coleta, passo a passo',h:'<p class="mn-lead">Cinco perguntas por dia, três motores, sete rodadas cada. Quarenta minutos. É o que você faz quase todo dia, por noventa dias.</p>\n<h4>Preparação, uma vez só</h4>\n<ol>\n<li><b>Escolha o horário.</b> O mesmo todo dia. Rotina com hora fixa sobrevive; rotina “quando der” morre na segunda semana.</li>\n<li><b>Tenha os três motores à mão.</b> ChatGPT em chatgpt.com, sem login. Modo IA do Google: faça uma busca e clique na aba “Modo IA”. Perplexity em perplexity.ai, sem login. Se o Modo IA não aparecer na janela anônima, use uma conta do Google criada só para medir — e anote.</li>\n<li><b>Prepare a planilha</b> — ou use a tela Medir, que já vem pronta e mostra as perguntas de hoje.</li>\n<li><b>Imprima a carteira numerada.</b> Você vai copiar e colar, e é fácil pular uma.</li>\n</ol>\n<h4>O dia de coleta, minuto a minuto</h4>\n<ol>\n<li><b>Veja quais são as cinco perguntas de hoje.</b> Dia 1: perguntas 1 a 5. Dia 2: 6 a 10. No dia 7, volta para 1 a 5. Se perdeu um dia, retome de onde parou.</li>\n<li><b>Abra uma janela anônima.</b> Chrome: Ctrl+Shift+N (Cmd+Shift+N no Mac). Celular: “nova guia anônima”.</li>\n<li><b>Cole a pergunta exatamente como está na carteira.</b> Sem mudar uma palavra, sem cumprimentar. Espere a resposta inteira.</li>\n<li><b>Anote as duas coisas.</b> A sua marca aparece no texto? O seu site aparece nas fontes? E, em uma palavra, quem mais apareceu.</li>\n<li><b>Feche a janela e abra outra.</b> Rodada 2. Cada rodada é uma conversa nova, porque a anterior contamina a próxima. Até a rodada 7.</li>\n<li><b>Mesma pergunta, próximo motor.</b> Sete no Modo IA, sete no Perplexity. Depois a pergunta 2. Ao fim, 105 conversas.</li>\n<li><b>Confira antes de fechar.</b> Rodada em que a IA perguntou de volta não vale — refaça só ela.</li>\n</ol>\n<div class="mn-warn"><span class="mn-lbl">O que não fazer</span>Não use a mesma conversa para duas rodadas. Não faça a pergunta logado. Não “ajude” a IA com contexto. Não mude a redação porque a resposta veio estranha. Não pule a anotação “porque foi igual” — a igualdade é dado.</div>\n<div class="mn-key"><span class="mn-lbl">Três tamanhos</span><b>Mínimo:</b> 20 perguntas, 2 motores, 5 rodadas, 4 perguntas por dia — 15 a 20 min, erro ≈ ±5 pontos. <b>Padrão:</b> 30 perguntas, 3 motores, 7 rodadas, 5 por dia — 40 a 50 min, erro ≈ ±3. <b>Com API:</b> tudo, todo dia — erro ≈ ±1,5.</div>',ta:['T2','T3'],mo:'m1',ir:['medir','Abrir a tela Medir']},{id:'d2',t:'Isso conta como aparecer?',h:'<p class="mn-lead">A dúvida que mais aparece na primeira semana. Duas colunas, duas anotações por rodada.</p>\n<h4>Marca no texto — o seu nome aparece na resposta?</h4>\n<ul>\n<li><span class="mn-ok">sim</span> Nome completo ou variação inequívoca (“Aurora Estética”).</li>\n<li><span class="mn-ok">sim</span> Aparece só para dizer que não recomenda — e anote fidelidade = não.</li>\n<li><span class="mn-ok">sim</span> Aparece numa lista de dez, em nono.</li>\n<li><span class="mn-no">não</span> Só o nome do concorrente.</li>\n<li><span class="mn-mid">refaça</span> A IA pergunta de volta em vez de responder: rodada inválida.</li>\n</ul>\n<h4>Site nas fontes — o seu site aparece entre os links?</h4>\n<ul>\n<li><span class="mn-ok">sim</span> O seu domínio em qualquer link ou fonte.</li>\n<li><span class="mn-ok">sim</span> Uma página sua citada com o nome errado no texto — e fidelidade = não.</li>\n<li><span class="mn-no">não</span> Só o seu Instagram ou o Perfil do Google (anote à parte).</li>\n<li><span class="mn-no">não</span> Nenhum link e nenhuma fonte na resposta.</li>\n<li><span class="mn-no">não</span> Um diretório que fala de você.</li>\n</ul>\n<div class="mn-key"><span class="mn-lbl">Anote também quem apareceu no seu lugar</span>Uma palavra por rodada. No fim de uma semana você tem a lista de quem a IA prefere quando você some — e essa lista é o começo do diagnóstico.</div>',ta:['T3'],mo:'m1',ir:['medir','Abrir a tela Medir']},{id:'d3',t:'Dúvidas: coleta e o que conta',h:'<p class="mn-lead">As dúvidas da primeira semana de coleta, respondidas sem rodeio.</p><div class="mn-box"><span class="mn-lbl">Preciso pagar o ChatGPT Plus ou o Perplexity Pro?</span><p>Não. Meça com a versão gratuita, sem login, porque é o que a maioria dos seus clientes usa. Versão paga responde diferente — e você não quer medir a resposta que só quem paga recebe.</p></div><div class="mn-box"><span class="mn-lbl">O que é exatamente “janela anônima”?</span><p>Uma janela do navegador que nasce sem histórico, sem login e sem cookies, e apaga tudo quando fecha. Chrome: Ctrl+Shift+N (Cmd+Shift+N no Mac). Safari: “Nova janela privada”. No celular, “nova guia anônima” no menu do navegador. Cada rodada é uma janela nova.</p></div><div class="mn-box"><span class="mn-lbl">Posso fazer a coleta pelo celular?</span><p>Pode, e muita gente prefere: a janela anônima está no menu do navegador e o app do Método roda no celular. Só evite os aplicativos nativos do ChatGPT e do Perplexity para medir, porque eles ficam logados — use o navegador.</p></div><div class="mn-box"><span class="mn-lbl">A IA me perguntou algo de volta em vez de responder. Conta?</span><p>Não. Rodada em que a IA pede mais informação (“em qual bairro?”) não é uma resposta. Feche, abra outra janela e refaça só essa rodada. Se acontecer sempre com a mesma pergunta, a pergunta está vaga demais — mas você só troca no próximo ciclo.</p></div><div class="mn-box"><span class="mn-lbl">A resposta veio em inglês ou para outra cidade.</span><p>A pergunta tem a cidade dentro justamente para isso. Se mesmo assim a IA responde para outro lugar, anote como “não apareceu” e siga — é o que o cliente receberia. Se for sistemático, confira se o navegador está informando o país certo.</p></div><div class="mn-box"><span class="mn-lbl">O Modo IA do Google não aparece na minha janela anônima.</span><p>Ele está sendo liberado por conta, então às vezes não aparece sem login. Crie uma conta do Google só para medir, sem nenhum histórico, e use-a apenas para isso. Anote que fez assim. Se ainda não aparecer, use o Gemini como terceiro motor e mantenha a escolha até o fim do ciclo.</p></div><div class="mn-box"><span class="mn-lbl">Quanto tempo leva, de verdade?</span><p>No protocolo padrão, 105 conversas por dia, cerca de 40 a 50 minutos. No mínimo, 40 conversas, 15 a 20 minutos. Nos dois casos, quase todo dia por 90 dias. Se você não tem esse tempo, delegue a coleta — é trabalho de instrução simples — e fique com a leitura.</p></div><div class="mn-box"><span class="mn-lbl">Posso pedir para alguém da equipe coletar?</span><p>Sim, e é a delegação mais barata do método. Entregue o Capítulo 6, a carteira impressa e a regra do que conta como aparecer. Revise as primeiras 20 linhas anotadas junto com a pessoa. Depois disso, ela faz sozinha.</p></div><div class="mn-box"><span class="mn-lbl">Perdi três dias de coleta. Estraguei tudo?</span><p>Não. Retome de onde parou na rotação e siga. O que estraga é trocar as perguntas ou ler o resultado cedo demais. Dias perdidos só empurram a leitura para mais tarde.</p></div><div class="mn-box"><span class="mn-lbl">A IA citou meu site mas com o nome da clínica errado.</span><p>Conta como “site nas fontes: sim” e “marca no texto: não” — e anote a fidelidade como falha. É um caso importante: você está sendo lido e descrito errado. Confira se o nome está igual no site, no Perfil da Empresa no Google e nas redes.</p></div><div class="mn-box"><span class="mn-lbl">Apareci, mas a IA disse que não me recomenda.</span><p>Conta como “marca no texto: sim” e “fidelidade: não”. Anote o motivo que ela deu — quase sempre é uma informação desatualizada ou uma avaliação antiga que ela encontrou. Isso vira uma tarefa de reparo específica.</p></div><div class="mn-box"><span class="mn-lbl">Só apareceu o meu Instagram, não o meu site.</span><p>Marca no texto: sim (se o nome está lá). Site nas fontes: não. Anote à parte que a fonte foi o Instagram. Se isso se repete, a IA está achando você nas redes e não no site — sinal de que o site está no ramo C enquanto a marca já é conhecida.</p></div><div class="mn-box"><span class="mn-lbl">Meu concorrente aparece em todas as rodadas e eu em nenhuma.</span><p>Ótimo: você tem um caso de estudo grátis. Rode a verificação 5 do Capítulo 13 nas duas páginas e leia os dois textos procurando preço, data, bairro e a pergunta exata. Em quase todo caso, a diferença está escrita ali — e é copiável.</p></div>',mo:'m1'},{id:'d4',t:'Dúvidas: site, perfil e plano',h:'<p class="mn-lead">Sobre o site, o Perfil da Empresa, bloqueio de treinamento e o plano.</p><div class="mn-box"><span class="mn-lbl">Meu site é Wix, WordPress, Shopify ou Loja Integrada. O que muda?</span><p>Nada no método, e pouco na técnica. Todos servem HTML sem depender de JavaScript para o texto principal, todos permitem editar título, preço e data, e todos têm onde colar o bloco de dados estruturados (em geral, em “código personalizado” ou “cabeçalho”). O que mais muda é o robots.txt: no Wix e no Shopify ele é gerenciado pela plataforma — confira o que ela está bloqueando.</p></div><div class="mn-box"><span class="mn-lbl">Preciso de um site novo?</span><p>Quase nunca. As verificações da Parte 5 decidem: se o conteúdo existe sem JavaScript e o robô recebe a mesma página que você, o site serve. Site novo é a solução mais cara para um problema que costuma ser uma faixa de preço faltando.</p></div><div class="mn-box"><span class="mn-lbl">Não tenho site, só Instagram e Perfil da Empresa no Google.</span><p>Você pode medir do mesmo jeito — e provavelmente vai cair no ramo C. Um site de uma página, com as perguntas da carteira respondidas, preço e endereço, resolve a maior parte. É a tarefa mais importante do seu plano, na frente de qualquer outra.</p></div><div class="mn-box"><span class="mn-lbl">E o Perfil da Empresa no Google, conta?</span><p>Muito, para negócio local: é uma das fontes que a IA mais consulta para endereço, horário e avaliações. Nome, endereço e telefone lá têm que ser idênticos aos do site. Categoria certa, horário atualizado, e responda avaliações — a IA lê as respostas.</p></div><div class="mn-box"><span class="mn-lbl">Devo bloquear o treinamento de IA no meu site?</span><p>É uma decisão sua, e as duas respostas são legítimas. O que não pode é bloquear os robôs de <i>busca</i> junto, por engano — é o erro mais caro do método. O Capítulo 13 mostra como separar.</p></div><div class="mn-box"><span class="mn-lbl">Já sei que não apareço. Posso pular a Fase 0?</span><p>Não. Você sabe que não aparece; não sabe <i>por quê</i>. E sem o retrato do antes, no dia 90 você não vai conseguir dizer se alguma coisa mudou. A Fase 0 é a única que não dá para recuperar depois.</p></div><div class="mn-box"><span class="mn-lbl">Tenho mais de uma unidade, em cidades diferentes.</span><p>Uma carteira por cidade, com as perguntas de descoberta trocando o nome da cidade. Meça a maior primeiro; as outras entram no ciclo seguinte. Nome, endereço e telefone de cada unidade precisam estar separados e consistentes.</p></div><div class="mn-box"><span class="mn-lbl">Vendo para empresas, não para pessoas. Serve?</span><p>Serve, e é onde a citação mais pesa: comprador de empresa usa IA para montar a lista curta antes de qualquer reunião. Troque a cidade pelo recorte que ele usa — porte, setor, problema — e o resto do método é idêntico.</p></div><div class="mn-box"><span class="mn-lbl">Tenho loja virtual, não serviço.</span><p>As perguntas mudam de forma (“onde comprar X com entrega rápida?”, “X ou Y, qual vale mais?”) e os porteiros pesam ainda mais: preço, especificação e data são exatamente o que a IA procura em produto. O bloco de dados estruturados de produto, com preço e disponibilidade, é obrigatório.</p></div><div class="mn-box"><span class="mn-lbl">O que faço no dia 91?</span><p>Lê o resultado (Capítulo 7) e decide entre três caminhos: repetir o ciclo com a mesma carteira para confirmar a tendência; ampliar — nova carteira, novas páginas; ou parar, se o canal não justifica para o seu caso. Qualquer uma é uma decisão informada. O que não faz é trocar a carteira e começar a medir de novo sem ter lido a p
