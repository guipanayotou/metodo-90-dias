<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Programa guiado de 90 dias para fazer a IA indicar o seu negócio: calendário dia a dia, medição com faixa de erro e diagnóstico assistido. Baseado em evidência publicada.">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Método 90 Dias">
<meta property="og:description" content="Programa guiado de 90 dias para fazer a IA indicar o seu negócio.">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230E3226"/><path d="M6 8h12l-8 8h8" stroke="%236FA98B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230E3226"/><path d="M6 8h12l-8 8h8" stroke="%236FA98B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Método 90 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  color-scheme:light;
  --pinho:#0E3226; --pinho-2:#17462F;
  --folha:#2E7D5B; --folha-t:#1B5A40;
  --mar:#2F6F84;   --mar-t:#245867;
  --ocre:#A8781F;  --ocre-t:#7A5510;
  --brasa:#8E4229; --brasa-t:#7A3722;
  --papel:#F2F4EF; --carta:#FFFFFF; --carta-2:#EAEEE7;
  --tinta:#141A17; --tinta-2:#4C574F; --tinta-3:#75817A;
  --linha:#D3DACE; --linha-2:#E3E8DF;
  --sel:rgba(46,125,91,.12);
  --sobre-acento:#FFFFFF;
  --sombra:0 1px 2px rgba(14,50,38,.06),0 6px 18px -10px rgba(14,50,38,.18);
  --sombra-alta:0 -2px 24px rgba(14,50,38,.14);
  --ff-ui:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --ff-ler:"Newsreader",Georgia,serif;
  --ff-num:"DM Mono",ui-monospace,monospace;
  --r:10px; --r-s:7px;
  --col:640px;
  --barra:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --pinho:#0B2019; --pinho-2:#183A2B;
    --folha:#4FA47C; --folha-t:#6FBE96;
    --mar:#5A9FB5;   --mar-t:#7FBACD;
    --ocre:#D6A544;  --ocre-t:#E2BB6B;
    --brasa:#D06B48; --brasa-t:#DE8969;
    --papel:#0F1512; --carta:#18201B; --carta-2:#212B24;
    --tinta:#E6EDE8; --tinta-2:#A6B3AB; --tinta-3:#7E8C85;
    --linha:#2C3A32; --linha-2:#232E28;
    --sel:rgba(79,164,124,.16);
    --sobre-acento:#08130E;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.6);
    --sombra-alta:0 -2px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --pinho:#0B2019;
  --folha:#4FA47C; --folha-t:#6FBE96;
  --mar:#5A9FB5;   --mar-t:#7FBACD;
  --ocre:#D6A544;  --ocre-t:#E2BB6B;
  --brasa:#D06B48; --brasa-t:#DE8969;
  --papel:#0F1512; --carta:#18201B; --carta-2:#212B24;
  --tinta:#E6EDE8; --tinta-2:#A6B3AB; --tinta-3:#7E8C85;
  --linha:#2C3A32; --linha-2:#232E28;
  --sel:rgba(79,164,124,.16);
  --sobre-acento:#08130E;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.6);
  --sombra-alta:0 -2px 28px rgba(0,0,0,.5);
}

/* ═══════════ BASE ═══════════ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--ff-ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.18;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--folha);outline-offset:2px;border-radius:4px}
.num{font-family:var(--ff-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═══════════ CASCA ═══════════ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:var(--papel);
  border-bottom:1px solid var(--linha);padding:.55rem .9rem;
  display:flex;align-items:center;gap:.6rem}
.topo-marca{display:flex;align-items:center;gap:.45rem;min-width:0}
.topo-marca svg{width:22px;height:22px;flex:none}
.topo-t{font-size:.9rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.topo-sub{font-family:var(--ff-num);font-size:.68rem;color:var(--tinta-3);white-space:nowrap}
.topo-dir{margin-left:auto;display:flex;gap:.3rem;align-items:center}
.icb{width:38px;height:38px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--tinta-2)}
.icb:hover{background:var(--carta-2);color:var(--tinta)}
.icb svg{width:19px;height:19px}

.corpo{flex:1;width:100%;max-width:var(--col);margin:0 auto;
  padding:1rem .9rem calc(var(--barra) + 2.4rem);}

.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--carta);border-top:1px solid var(--linha);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.aba{height:var(--barra);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--tinta-3);font-size:.66rem;font-weight:600;
  position:relative;transition:color .15s}
.aba svg{width:21px;height:21px}
.aba[aria-current="page"]{color:var(--folha-t)}
.aba[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;
  height:2.5px;background:var(--folha);border-radius:0 0 3px 3px}
.aba-pip{position:absolute;top:9px;right:calc(50% - 18px);min-width:15px;height:15px;
  border-radius:8px;background:var(--brasa);color:var(--sobre-acento);font-family:var(--ff-num);
  font-size:.6rem;display:grid;place-items:center;padding:0 3px}

@media (min-width:900px){
  :root{--col:700px}
  .app{flex-direction:row}
  .abas{position:sticky;top:0;bottom:auto;left:auto;right:auto;height:100dvh;
    width:200px;flex:none;grid-template-columns:1fr;grid-auto-rows:min-content;
    align-content:start;gap:2px;padding:5.2rem .6rem 1rem;border-top:0;
    border-right:1px solid var(--linha);background:var(--papel)}
  .aba{height:46px;flex-direction:row;justify-content:flex-start;gap:.7rem;
    padding:0 .8rem;border-radius:var(--r-s);font-size:.86rem}
  .aba[aria-current="page"]{background:var(--sel)}
  .aba[aria-current="page"]::before{top:12px;bottom:12px;left:0;right:auto;
    width:2.5px;height:auto;border-radius:0 3px 3px 0}
  .aba-pip{position:static;margin-left:auto}
  .topo{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--papel)}
  .corpo{padding:4.6rem 1.5rem 4rem}
  .quadro{flex:1;display:flex;justify-content:center}
}

/* ═══════════ PRIMITIVAS ═══════════ */
.pilha{display:flex;flex-direction:column;gap:.9rem}
.pilha-s{display:flex;flex-direction:column;gap:.5rem}
.linha{display:flex;align-items:center;gap:.55rem}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);overflow:hidden}
.cartao-p{padding:.95rem 1rem}
.sec-t{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-3);margin-bottom:.5rem}
.h-tela{font-size:1.6rem;letter-spacing:-.03em}
.h-sec{font-size:1.08rem}
.sub{color:var(--tinta-2);font-size:.9rem;line-height:1.5}
.mini{font-size:.78rem;color:var(--tinta-3);line-height:1.45}

.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;font-weight:700;
  padding:.18rem .45rem;border-radius:5px;background:var(--carta-2);color:var(--tinta-2);
  white-space:nowrap;letter-spacing:.01em}
.chip.ok{background:color-mix(in srgb,var(--folha) 16%,transparent);color:var(--folha-t)}
.chip.at{background:color-mix(in srgb,var(--ocre) 20%,transparent);color:var(--ocre-t)}
.chip.cr{background:color-mix(in srgb,var(--brasa) 18%,transparent);color:var(--brasa-t)}
.chip.dt{background:color-mix(in srgb,var(--mar) 16%,transparent);color:var(--mar-t)}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:46px;padding:.6rem 1.05rem;border-radius:var(--r-s);
  font-size:.92rem;font-weight:700;background:var(--folha);color:var(--sobre-acento);
  transition:filter .15s;border:1px solid transparent}
.bt:hover{filter:brightness(1.08)}
.bt:disabled{opacity:.45;cursor:not-allowed}
.bt.sec{background:var(--carta);color:var(--tinta);border-color:var(--linha)}
.bt.sec:hover{background:var(--carta-2);filter:none}
.bt.fant{background:transparent;color:var(--tinta-2);min-height:40px;padding:.4rem .6rem;font-weight:600}
.bt.fant:hover{color:var(--brasa-t);filter:none}
.bt.larg{width:100%}
.bt svg{width:17px;height:17px;flex:none}

.campo{display:flex;flex-direction:column;gap:.3rem}
.campo>span{font-size:.78rem;font-weight:600;color:var(--tinta-2)}
.campo input,.campo select,.campo textarea{
  width:100%;padding:.62rem .7rem;min-height:46px;border:1px solid var(--linha);
  border-radius:var(--r-s);background:var(--carta);font-size:.95rem}
.campo textarea{min-height:76px;resize:vertical;line-height:1.45}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--folha);outline:none;box-shadow:0 0 0 3px var(--sel)}
.grade2{display:grid;gap:.7rem}
@media(min-width:560px){.grade2{grid-template-columns:1fr 1fr}}

.vazio{text-align:center;padding:2.2rem 1.2rem;color:var(--tinta-2)}
.vazio svg{width:34px;height:34px;color:var(--tinta-3);margin-bottom:.6rem}
.vazio h3{font-size:1rem;margin-bottom:.3rem;color:var(--tinta)}
</style>
<style>
/* ═══════════ HOJE ═══════════ */
.hoje-cab{display:flex;align-items:flex-start;gap:1rem;margin-bottom:.2rem}
.hoje-cab .dia-n{font-family:var(--ff-num);font-size:.74rem;color:var(--tinta-3);letter-spacing:.04em}
.anel{--p:0;width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--folha) calc(var(--p)*1%), var(--linha-2) 0)}
.anel i{width:50px;height:50px;border-radius:50%;background:var(--papel);display:grid;place-items:center;
  font-family:var(--ff-num);font-size:.86rem;font-style:normal;color:var(--tinta)}

.tarefa{display:grid;grid-template-columns:26px 1fr;gap:.7rem;padding:.75rem .9rem;
  border-top:1px solid var(--linha-2);align-items:start;text-align:left;width:100%}
.tarefa:first-of-type{border-top:0}
.tarefa:hover{background:var(--carta-2)}
.tk{width:24px;height:24px;border-radius:6px;border:2px solid var(--linha);
  display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s;background:var(--carta)}
.tk svg{width:14px;height:14px;color:var(--sobre-acento);opacity:0}
.tarefa.feita .tk{background:var(--folha);border-color:var(--folha)}
.tarefa.feita .tk svg{opacity:1}
.tarefa.feita .tarefa-n{color:var(--tinta-3);text-decoration:line-through;text-decoration-color:var(--linha)}
.tarefa-n{font-size:.94rem;font-weight:600;line-height:1.35}
.tarefa-m{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem;align-items:center}
.tarefa-d{font-size:.8rem;color:var(--tinta-2);margin-top:.35rem;line-height:1.45}

.faixa-frente{width:3px;border-radius:2px;align-self:stretch}
.fr-medicao{background:var(--mar)} .fr-tecnico{background:var(--pinho-2)}
.fr-conteudo{background:var(--ocre)} .fr-rede{background:var(--folha)}
.fr-governanca{background:var(--tinta-3)} .fr-reparo{background:var(--brasa)}

/* ═══════════ CALENDÁRIO ═══════════ */
.cal-nav{display:flex;align-items:center;gap:.4rem;margin-bottom:.7rem}
.cal-mes{font-size:1rem;font-weight:700;text-transform:capitalize;flex:1}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:.64rem;font-weight:700;color:var(--tinta-3);text-align:center;
  padding:.3rem 0;letter-spacing:.05em;text-transform:uppercase}
.cal-d{aspect-ratio:1;border-radius:var(--r-s);background:var(--carta);border:1px solid var(--linha-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;padding:2px;transition:border-color .12s}
.cal-d:hover{border-color:var(--folha)}
.cal-d.fora{background:transparent;border-color:transparent;color:var(--tinta-3);opacity:.45}
.cal-d.dentro{background:var(--carta)}
.cal-d.hoje{border-color:var(--folha);border-width:2px}
.cal-d.sel{background:var(--pinho);border-color:var(--pinho)}
.cal-d.sel .cal-n{color:#fff}
.cal-n{font-family:var(--ff-num);font-size:.82rem;line-height:1}
.cal-pts{display:flex;gap:2px;height:5px;align-items:center}
.cal-pts i{width:5px;height:5px;border-radius:50%;display:block}
.cal-marco{position:absolute;top:2px;right:2px;width:7px;height:7px;
  background:var(--pinho);transform:rotate(45deg)}
.cal-d.sel .cal-marco{background:#fff}
.cal-leg{display:flex;flex-wrap:wrap;gap:.5rem .9rem;margin-top:.8rem;font-size:.72rem;color:var(--tinta-2)}
.cal-leg span{display:inline-flex;align-items:center;gap:.32rem}
.cal-leg i{width:8px;height:8px;border-radius:50%}

/* ═══════════ FOLHA ═══════════ */
.folha-fundo{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.5);
  backdrop-filter:blur(2px);animation:aparece .18s ease}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--papel);
  border-radius:16px 16px 0 0;box-shadow:var(--sombra-alta);max-height:88dvh;
  display:flex;flex-direction:column;animation:sobe .22s cubic-bezier(.2,.8,.3,1)}
.folha-p{width:36px;height:4px;border-radius:2px;background:var(--linha);margin:.55rem auto .1rem;flex:none}
.folha-cab{padding:.5rem 1rem .7rem;border-bottom:1px solid var(--linha);flex:none;
  display:flex;align-items:flex-start;gap:.7rem}
.folha-corpo{overflow-y:auto;padding:.9rem 1rem 2rem;-webkit-overflow-scrolling:touch}
@keyframes sobe{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@media(min-width:900px){
  .folha{left:auto;right:0;top:0;bottom:0;width:min(460px,42vw);border-radius:0;
    max-height:none;animation:entra .22s cubic-bezier(.2,.8,.3,1)}
  .folha-p{display:none}
  @keyframes entra{from{transform:translateX(20px);opacity:.5}to{transform:none;opacity:1}}
}

/* ═══════════ ASSISTENTE (diagnóstico) ═══════════ */
.dg{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);overflow:hidden}
.dg-topo{background:var(--pinho);padding:.85rem 1rem;color:#DCE8E0}
.dg-passos{display:flex;gap:5px;margin-bottom:.55rem}
.dg-passos i{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.22)}
.dg-passos i.on{background:var(--folha)}
.dg-passos i.done{background:rgba(255,255,255,.6)}
.dg-etq{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8FB8A2}
.dg-q{padding:1.1rem 1rem .3rem}
.dg-q h3{font-size:1.14rem;line-height:1.28}
.dg-q p{margin-top:.4rem;color:var(--tinta-2);font-size:.86rem;line-height:1.5}
.dg-ops{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1rem 1rem}
.op{display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center;text-align:left;
  padding:.85rem .9rem;border:1.5px solid var(--linha);border-radius:var(--r-s);
  background:var(--carta);transition:all .14s}
.op:hover{border-color:var(--folha);background:var(--sel)}
.op b{display:block;font-size:.95rem;line-height:1.3}
.op span{display:block;font-size:.79rem;color:var(--tinta-2);margin-top:.2rem;line-height:1.45}
.op svg{width:17px;height:17px;color:var(--tinta-3);flex:none}
.op:hover svg{color:var(--folha-t)}
.dg-pe{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;
  border-top:1px solid var(--linha-2);background:var(--carta-2)}

.res{border-radius:var(--r);overflow:hidden;border:1px solid var(--linha);box-shadow:var(--sombra)}
.res-cab{padding:1rem;color:var(--sobre-acento)}
.res-cab.a{background:var(--folha)} .res-cab.b{background:var(--ocre-t)} .res-cab.c{background:var(--brasa)}
.res-cab .et{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.res-cab h3{font-size:1.2rem;margin-top:.25rem}
.res-corpo{background:var(--carta);padding:1rem;display:flex;flex-direction:column;gap:.85rem}
.res-bl>b{display:block;font-size:.72rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--tinta-3);margin-bottom:.22rem}
.res-bl>p{font-size:.9rem;line-height:1.55;color:var(--tinta-2)}
.res-bl>p strong{color:var(--tinta)}

/* ═══════════ MEDIÇÃO ═══════════ */
.step{display:inline-flex;align-items:center;border:1px solid var(--linha);border-radius:8px;
  overflow:hidden;background:var(--carta);flex:none}
.step button{width:38px;height:40px;display:grid;place-items:center;color:var(--tinta-2);font-size:1.1rem}
.step button:hover{background:var(--carta-2);color:var(--tinta)}
.step b{min-width:44px;text-align:center;font-family:var(--ff-num);font-size:.95rem;
  border-left:1px solid var(--linha-2);border-right:1px solid var(--linha-2);line-height:40px}
.mq{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--linha-2)}
.mq:first-child{border-top:0}
.mq-t{flex:1;min-width:0;font-size:.87rem;line-height:1.35}
.mq-t small{display:block;font-size:.7rem;color:var(--tinta-3);margin-top:.15rem}
.motores{display:flex;gap:.4rem;flex-wrap:wrap}
.mot{padding:.45rem .8rem;border-radius:20px;border:1.5px solid var(--linha);
  font-size:.82rem;font-weight:600;background:var(--carta);min-height:40px}
.mot[aria-pressed="true"]{background:var(--mar);border-color:var(--mar);color:var(--sobre-acento)}

.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--linha-2)}
@media(min-width:520px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi>div{background:var(--carta);padding:.8rem .85rem}
.kpi b{display:block;font-family:var(--ff-num);font-size:1.3rem;line-height:1.15;color:var(--tinta)}

ia, um podcast, uma participação. Não precisa ser veículo grande.','Não compre menção: os filtros antispam da busca valem para as respostas de IA.']},{id:'T15',ler:'s65',f:'rede',d0:50,d1:90,n:'Programa de avaliações',pq:'Volume e recência de avaliação alimentam o Perfil da Empresa, que a IA lê e exibe direto na resposta.',o:'Volume e recência de avaliações, com resposta a todas.',p:['Peça avaliação no momento de maior satisfação, não no fim do mês.','Responda a todas — principalmente às ruins. A resposta também é lida.','Nunca fabrique avaliação. É o caminho mais rápido para o filtro de spam.','Meta simples: um fluxo constante, não um pico.']},{id:'T16',ler:'s56',f:'medicao',d0:21,d1:90,ir:'medir',n:'Coleta contínua',pq:'É a coleta contínua que permite dizer, no dia 90, se alguma coisa mudou de verdade.',o:'Manter a medição rodando todo dia até o dia 90.',p:['Mesmo protocolo do baseline: 7 repetições, 3 motores, sessão limpa.','Não mude a carteira. Não mude o número de repetições.','Se falhar um dia, registre a falha em vez de inventar o número.','É a coleta contínua que permite dizer, no dia 90, se algo mudou de verdade.']},{id:'T17',ler:'s67',f:'governanca',d0:60,d1:67,ir:'medir',n:'Leitura intermediária',pq:'Serve para checar a saúde da coleta. Decidir com este número é decidir com ruído.',o:'Olhar o número — e não decidir nada com ele.',p:['Serve para checar se a coleta está saudável, não para avaliar resultado.','Mudança de conteúdo leva de 2 a 4 semanas para aparecer na citação.','Se o número caiu, não reverta nada ainda. Pode ser variação normal.','Anote o que chamou atenção para conferir no dia 90.']},{id:'T18',ler:'s83',f:'governanca',crit:1,d0:76,d1:90,ir:'medir',n:'Janela de 28 dias e relatório',pq:'A primeira leitura que decide: 28 dias de janela, depois do atraso de 2 a 4 semanas entre mudança e efeito.',o:'A primeira leitura que decide alguma coisa.',p:['Compare o baseline com a janela rolante de 28 dias — nunca semana contra semana.','Confira se a di '],corpo:['A mesma pergunta, no mesmo dia, devolve respostas diferentes. Não é o algoritmo mudando — é a natureza da IA. Cerca de 65% das fontes citadas trocam de um dia para o outro.','Isso não impede medir. Define o mínimo: cada consulta é uma [[rodada|rodada]], e uma rodada isolada tem [[margemErro|margem de erro]] de 0,370 — na prática, não distingue 20% de 60%.','E tem mais: numa configuração estudada, **57,8% das rodadas do ChatGPT não ativaram busca nenhuma**. Nessas, não havia como você aparecer. Elas continuam entrando na conta — é o que impede o número de subir sozinho.']},{titulo:'O teste que quase todo mundo faz errado',conceitos:['reconhecimento','intencao'],corpo:['Você pergunta “o que você sabe sobre a minha empresa?”, recebe um parágrafo elogioso e conclui que está bem posicionado. Não está.','O ChatGPT reconhece **99,4%** dos negócios quando você entrega o nome. E os traz em apenas **3,32%** das perguntas de descoberta genérica — aquelas em que o cliente descreve o que precisa sem saber o seu nome.','[[reconhecimento|Reconhecer não é indicar]]. São dois testes separados, e só o segundo mede visibilidade.']}],verificacao:[{p:'Sua página não aparece nas respostas. Qual é a primeira coisa a fazer?',ops:[{t:'Reescrever o texto para ficar mais persuasivo',ok:!1,exp:'É a etapa 4, e ela só funciona depois que a IA consegue ler a página. Começar por aqui é o erro mais comum do mercado — e pode até piorar a recuperação.'},{t:'Descobrir se a IA chega a ler a sua página',ok:!0,exp:'Exato. Se o seu domínio não aparece nem na lista de fontes citadas, o problema é recuperação e nenhuma redação resolve.'},{t:'Comprar menções em blogs do setor',ok:!1,exp:'Os mesmos filtros antispam da busca comum valem para as respostas de IA. E não resolve recuperação.'}]},{p:'Você fez a pergunta uma vez e não apareceu. O que isso prova?',ops:[{t:'Que você não está sendo indicado',ok:!1,exp:'Uma rodada tem margem de erro de 0,370. Ela não distingue uma taxa de 20% de uma de 60% — muito menos prova ausência.'},{t:'Praticamente nada',ok:!0,exp:'Isso mesmo. É uma amostra de tamanho um num canal que varia a cada consulta. Sete repetições por dia é o piso publicado para o número parar de balançar.'},{t:'Que o site tem problema técnico',ok:!1,exp:'Pode ser — mas uma rodada não sustenta essa conclusão. Talvez a IA nem tenha buscado nessa vez.'}]}]},{id:'m1',ler:'s62',n:1,titulo:'Medir antes de mexer',dias:'dias 1 a 21',tarefas:['T1','T2','T3','T4','T5'],promessa:'Ao final você tem um baseline defensável e sabe exatamente qual dos três problemas é o seu.',licoes:[{titulo:'Por que 14 dias sem tocar em nada',conceitos:['baseline','janela','lag'],corpo:['O [[baseline|baseline]] é o retrato do “antes”. É contra ele que tudo será comparado no dia 90 — e é a única fase que não dá para recuperar depois.','Qualquer mudança no site durante a coleta contamina a comparação. Se você corrigir uma página no dia 10, no dia 90 não saberá se o número subiu por causa dela ou por causa de tudo o que veio depois.','Catorze dias não é conservadorismo: com [[janela|janela]] de 10 dias a margem cai abaixo de 0,10, e só perto de 24 dias ela chega a 0,05.']},{titulo:'Uma carteira que mede o que importa',conceitos:['intencao','ativacao','reconhecimento'],corpo:['Vinte a trinta perguntas, escritas **como o cliente fala** — não como você descreve o serviço. Quatro [[intencao|intenções]]: descoberta, comparação, problema e validação.','Descoberta é a que mede visibilidade de verdade. Validação entra no máximo em um quarto da carteira, porque quase sempre dá positivo e infla o resultado.','Frase completa importa: buscas escritas como pergunta acionam o resumo de IA em **64,7%** dos casos, contra 13,7% na média. Termo solto muitas vezes nem faz a IA buscar.']},{titulo:'O denominador honesto',conceitos:['denominador','ativacao','rodada'],corpo:['Taxa de detecção é aparições dividido pelo total de rodadas. O total inclui as rodadas em que a IA não buscou e aquelas em que citou só concorrentes.','Muita ferramenta calcula a taxa só entre respostas que tiveram citação. O número fica inflado sem ninguém mentir explicitamente — é a armadilha mais comum de painel.','Registre tudo, inclusive o que deu errado. [[denominador|Rodada sem citação é dado]], não falha.']},{titulo:'Classificar antes de escrever',conceitos:['ramo','desalinhamento'],corpo:['Terminado o baseline, cada pergunta em que você não apareceu vira um diagnóstico. São [[ramo|três ramos]] com custos muito diferentes: dias, semanas ou meses.','Se a maioria cair no ramo de recuperação, pare o conteúdo e trate só o técnico. Escrever ali é dinheiro jogado fora.','Este documento — a matriz de diagnóstico — define o trabalho das dez semanas seguintes. É o entregável de maior valor do programa inteiro.']}],verificacao:[{p:'No dia 8 do baseline você percebe um erro de preço numa página importante. O que fazer?',ops:[{t:'Corrigir agora, é um erro óbvio',ok:!1,exp:'Corrigir contamina o baseline: no dia 90 você não saberá separar o efeito dessa correção do resto. Anote e corrija na Fase 2.'},{t:'Anotar e corrigir depois do dia 21',ok:!0,exp:'Isso. O baseline precisa retratar o site intacto. Anotar já adianta o trabalho da fase de reparo sem estragar a comparação.'},{t:'Corrigir e recomeçar a contagem dos 14 dias',ok:!1,exp:'Funciona, mas custa duas semanas. Anotar e seguir custa zero — e o erro entra na fila de reparo de qualquer jeito.'}]},{p:'Das 7 rodadas de uma pergunta, em 4 a IA respondeu de memória sem buscar. Como você conta?',ops:[{t:'Considero só as 3 que buscaram',ok:!1,exp:'Aí o denominador encolhe e a taxa sobe sozinha. É exatamente a armadilha que infla painel de fornecedor.'},{t:'Conto as 7 no total, com as aparições que houve',ok:!0,exp:'Correto. As rodadas sem busca são resultado, não erro de coleta. Elas dizem algo real: naquele momento, a pergunta não acionou busca.'},{t:'Refaço até conseguir 7 com busca',ok:!1,exp:'Isso seleciona a amostra a favor do resultado. A taxa de ativação é parte do que você está medindo.'}]}]},{id:'m2',ler:'s63',n:2,titulo:'Fazer a IA conseguir ler você',dias:'dias 15 a 45',tarefas:['T6','T7','T8','T9'],promessa:'Ao final o seu site é elegível: indexado, sem duplicidade e com dados idênticos em todos os canais.',licoes:[{titulo:'Se não aparece na busca comum, não existe para a IA',conceitos:['recuperacao'],corpo:['O teste é de trinta segundos: busque no Google por `site:seudominio.com.br` e veja se as páginas-alvo aparecem.','Se não aparecem, nenhuma delas pode ser [[recuperacao|recuperada]] — e todo trabalho de texto em cima delas rende zero. Robots.txt, renderização por JavaScript e canônicas duplicadas são os três culpados mais comuns.','Duas páginas suas disputando a mesma pergunta se anulam. Escolha uma, redirecione a outra.']},{titulo:'Consistência é o que gera descrição correta',conceitos:['fidelidade'],corpo:['Nome, endereço, telefone e categoria precisam ser **idênticos** — caractere por caractere — no site, no Perfil da Empresa no Google, no Bing Places e nos diretórios.','Divergência entre canais não some: ela vira descrição errada na resposta da IA. E [[fidelidade|citação errada]] é resultado negativo que todo painel de contagem registra como positivo.','O ChatGPT busca via Bing e lê bases de lugares. Só cuidar do Google deixa metade do trabalho de fora.']},{titulo:'Uma página por pergunta, não por palavra',conceitos:['ativacao','recuperacao'],corpo:['O Google AI Mode quebra uma pergunta em várias por baixo dos panos e busca uma fonte para cada pedaço. Você precisa cobrir a constelação, não o termo.','Pegue a sua carteira e mapeie qual página responde a cada pergunta. Pergunta sem página é lacuna. Página sem pergunta provavelmente é ruído.','Essa é a arquitetura que faz sentido para o canal — e, de quebra, aumenta a [[ativacao|ativação de busca]], porque conteúdo organizado por pergunta atrai consulta em forma de pergunta.']}],verificacao:[{p:'Seu domínio aparece na lista de fontes citadas, mas a marca nunca é mencionada no texto. O que isso indica?',ops:[{t:'Problema de recuperação — trabalho técnico',ok:!1,exp:'Não: se o domínio aparece nas fontes, a IA está lendo o site. A recuperação está funcionando.'},{t:'Problema da página específica — conteúdo desalinhado',ok:!0,exp:'Exato. A IA leu e não te indicou. O gargalo está no conteúdo daquela página — e em 62% dos casos é desalinhamento com a pergunta, não falta de texto.'},{t:'Problema de autoridade da marca',ok:!1,exp:'É a conclusão intuitiva e quase sempre errada. Compare a sua página com a do concorrente citado: normalmente a dele responde à pergunta e a sua explica a categoria.'}]},{p:'Por que padronizar nome, endereço e telefone importa para visibilidade em IA?',ops:[{t:'Porque a IA soma pontos por consistência',ok:!1,exp:'Não funciona por pontuação. O efeito é mais direto que isso.'},{t:'Porque informação divergente vira descrição errada',ok:!0,exp:'Isso. E também porque motores diferentes puxam de bases diferentes — divergência faz você aparecer certo num e errado noutro.'},{t:'Porque é exigência do Google Meu Negócio',ok:!1,exp:'Não é exigência formal. É consequência prática de como as respostas são montadas a partir de várias fontes.'}]}]},{id:'m3',ler:'s64',n:3,titulo:'Fazer a IA escolher você',dias:'dias 30 a 70',tarefas:['T10','T11','T12','T13'],promessa:'Ao final cada página do diagnóstico tem o reparo do tipo certo — e os quatro porteiros no lugar.',licoes:[{titulo:'Reparo dirigido, não receita uniforme',conceitos:['desalinhamento','ramo'],corpo:['O erro operacional do mercado é aplicar a mesma reescrita em todo mundo. Antes de escrever, classifique o [[desalinhamento|tipo de falha]].','Intenção divergente pede remapear a página. Lacuna de informação pede o dado que falta. Informação velha pede atualizar e datar. Localização pede consistência e a região escrita como o cliente fala.','No estudo que criou essa taxonomia, o reparo dirigido levou a citação de **57% para 84%**. Aplicado a perguntas que o método nunca tinha visto, o ganho caiu para +14 pontos — ainda relevante, e um lembrete de que resultado de laboratório encolhe no mundo real.']},{titulo:'Os quatro porteiros, na prática',conceitos:['porteiro'],corpo:['Preço ou faixa de preço escrita. “Consulte valores” perde a citação — e trocar isso por uma faixa real é a mudança mais barata e mais forte que existe.','Data de atualização visível e verdadeira. Especificação concreta: o que inclui, quanto tempo, para quem serve. Comparação honesta com as alternativas, inclusive quando você não é a melhor opção.','Repare no que **não** está na lista: formatação bonita. No mesmo teste de 252 mil rodadas, mudar só a organização visual teve efeito zero.']},{titulo:'Menos texto costuma vencer',conceitos:['porteiro'],corpo:['Página maior não é página melhor. Num estudo de 2026, um método que encurtou as páginas em **53%** — cortando ruído e deixando só os pontos de informação — alcançou desempenho competitivo de citação.','Troque linguagem hesitante por afirmação verificável. “Pode oferecer resultados” perde para “inclui X sessões, dura Y minutos, custa a partir de Z”.','E a restrição inegociável: nunca invente estatística para preencher lacuna. Além do problema ético, existe o técnico — um detector publicado identifica conteúdo otimizado para IA com F1 de 0,944, inclusive nas variantes disfarçadas.']}],verificacao:[{p:'A página do seu serviço explica muito bem o procedimento, mas a pergunta do cliente é “quanto custa X na minha cidade”. Qual o reparo?',ops:[{t:'Aumentar o texto explicando melhor o procedimento',ok:!1,exp:'É responder mais alto a uma pergunta que ninguém fez. A página já fala do assunto — o problema é que não responde ao que foi perguntado.'},{t:'Remapear a página para responder preço e local',ok:!0,exp:'Isso. Intenção divergente é o tipo de falha mais comum, e o reparo é responder na mesma moeda da pergunta: valor concreto e a região escrita como o cliente fala.'},{t:'Criar dez páginas novas, uma por variação de palavra-chave',ok:!1,exp:'Isso cria páginas suas competindo entre si e dilui o sinal. Uma página por pergunta real, não por variação de termo.'}]},{p:'Qual destas mudanças tem o maior efeito por menor esforço?',ops:[{t:'Melhorar a formatação e o design da página',ok:!1,exp:'Teve efeito zero no teste controlado de 252 mil rodadas. É o gasto mais fácil de justificar e o menos produtivo.'},{t:'Trocar “consulte valores” por uma faixa de preço',ok:!0,exp:'Preço explícito é porteiro: unânime nos seis modelos testados, com efeito grande. E leva minutos.'},{t:'Publicar três artigos por semana no blog',ok:!1,exp:'Volume sem diagnóstico é o desperdício clássico. Se as páginas atuais têm falha de intenção, mais páginas com a mesma falha não ajudam.'}]}]},{id:'m4',ler:'s65',n:4,titulo:'Existir fora do site e ler o resultado',dias:'dias 45 a 90',tarefas:['T14','T15','T16','T17','T18'],promessa:'Ao final você sabe dizer se mudou alguma coisa — com faixa de erro, e sem enganar a si mesmo.',licoes:[{titulo:'Ser falado pesa mais que ser linkado',conceitos:[],corpo:['Numa análise de 75 mil marcas, menções no YouTube correlacionam **0,737** com aparecer nos resumos de IA e menções na web em geral **0,664** — contra **0,218** dos backlinks.','Isso inverte a prioridade de orçamento da maioria das agências, que ainda vende link.','Cuidado com a leitura: correlação não é causa. Marcas grandes naturalmente têm mais menções **e** mais visibilidade. A direção é consistente o bastante para priorizar menção sobre link, mas não sustenta a promessa de que comprar menção faz você aparecer — e comprar aciona os filtros antispam.']},{titulo:'Por que nada é decidido antes do dia 76',conceitos:['lag','janela','intervalo'],corpo:['Entre publicar a correção e ela aparecer na citação passam de 2 a 4 semanas. É o [[lag|atraso do efeito]].','Some isso à [[janela|janela]] de 28 dias necessária para o número parar de balançar e você chega ao dia 76 como a primeira data em que uma leitura sustenta decisão.','Antes disso o número existe — e olhar para ele é útil para checar se a coleta está saudável. O que não dá é reverter trabalho com base nele.']},{titulo:'Como saber se subiu de verdade',conceitos:['intervalo','agrupamento','margemErro'],corpo:['Compare o baseline com a janela de 28 dias e olhe as [[intervalo|faixas de confiança]]. Se elas se sobrepõem, você **não pode afirmar** que mudou.','E aplique o [[agrupamento|fator de agrupamento]]: sete repetições da mesma pergunta não são sete informações independentes. Ignorar isso estreita a faixa artificialmente e produz vitória que não existe.','Compare também os concorrentes nas mesmas perguntas. Se todos subiram, quem subiu foi a plataforma — o canal cresceu sozinho e parte da sua alta não é sua.']},{titulo:'“Não deu para afirmar” é um resultado',conceitos:['intervalo'],corpo:['Se a diferença não sai da margem, o correto é dizer exatamente isso — e mostrar quantas rodadas seriam necessárias para conseguir afirmar.','A faixa que a evidência sustenta para visitas vindas de IA é da ordem de **1,3 a 2,5 vezes**, depois de descontar o crescimento das plataformas. O melhor caso de campo publicado teve ganho bruto de 5,7× e ganho atribuível de 1,82×.','Quem promete cinco vezes está vendendo o número bruto. Quem **nunca** entrega um “não deu para afirmar”, para nenhum cliente, provavelmente não está medindo — está narrando.']}],verificacao:[{p:'Baseline 18% (faixa 13–24%). Janela atual 24% (faixa 19–30%). O que você reporta?',ops:[{t:'Crescimento de 33% na visibilidade',ok:!1,exp:'As faixas se sobrepõem entre 19% e 24%. O número verdadeiro pode ser o mesmo nos dois períodos — anunciar crescimento aqui é afirmar o que os dados não sustentam.'},{t:'Ainda não dá para afirmar que mudou',ok:!0,exp:'Correto, e é um resultado legítimo. O certo é reportar isso e dizer quantas rodadas a mais seriam necessárias para a diferença sair da margem.'},{t:'Queda, porque a faixa de baixo subiu pouco',ok:!1,exp:'Também não. Sobreposição significa indefinição, não queda.'}]},{p:'Sua detecção subiu 40% e a dos três concorrentes também subiu algo parecido. O que aconteceu?',ops:[{t:'O trabalho funcionou para todo o setor',ok:!1,exp:'Você não trabalhou nos sites dos concorrentes. Se todos subiram junto, a causa provável é externa a você.'},{t:'Provavelmente a plataforma cresceu, não você',ok:!0,exp:'Isso. É exatamente por isso que se mede concorrente nas mesmas perguntas — sem esse controle, o crescimento do canal vira mérito seu no slide.'},{t:'Os concorrentes copiaram a estratégia',ok:!1,exp:'Em 90 dias e com efeito simultâneo, é bem mais provável que seja crescimento da própria plataforma.'}]}]}];function moduloDoDia(a){return a?a<=21?MODULOS[1]:a<=45?MODULOS[2]:a<=70?MODULOS[3]:MODULOS[4]:MODULOS[0]}const LIVRO={t:'Fazer a IA indicar você',sub:'O método de 90 dias, do diagnóstico à prova.',pag:105,onde:'guipanayotou.github.io/metodo-90-dias',caps:[{n:'Abertura',t:'Leia isto primeiro',secs:['p0s0']},{n:'1',t:'A busca virou resposta',secs:['s11','s12','s13','s14','s15','s16']},{n:'2',t:'Como a IA escolhe quem indicar',secs:['s21','s22','s23','s24','s25']},{n:'3',t:'Os quatro porteiros',secs:['s31','s32','s33','s34','s35']},{n:'4',t:'Por que uma rodada não vale nada',secs:['s51','s52','s53']},{n:'5',t:'A sua carteira de perguntas',secs:['s54']},{n:'6',t:'A rotina de coleta, passo a passo',secs:['d1','d2']},{n:'7',t:'O painel que sustenta uma reunião',secs:['s55','s56','s57']},{n:'8',t:'Qual dos três problemas é o seu',secs:['s41','s42']},{n:'9',t:'Os quatro desalinhamentos',secs:['s43','s44','s45']},{n:'10',t:'O plano de 90 dias',secs:['s61','s62','s63','s64','s65','s66','s67','s68']},{n:'11',t:'Ferramentas, custo e o gratuito',secs:['s71','s72','s73','s74','s75']},{n:'12',t:'Metas que dá para aceitar',secs:['s81','s82','s83','s84','s85']},{n:'13',t:'O seu site está acessível à IA?',secs:[]},{n:'14',t:'Cloudflare configurado para ser encontrado',secs:[]},{n:'15',t:'O que a IA lê na sua página',secs:[]},{n:'16',t:'Otimizações que valem e as que não valem',secs:[]},{n:'Dúvidas',t:'Vinte e quatro dúvidas que vão aparecer',secs:['d3','d4']},{n:'A',t:'Checklist mestre dos 90 dias',secs:['a1']},{n:'B',t:'Modelo de carteira e planilha de coleta',secs:['a2']},{n:'C',t:'Matriz de diagnóstico e reparo',secs:['a3']},{n:'D',t:'Estrutura do relatório mensal',secs:['a4']},{n:'E',t:'Glossário',secs:[]},{n:'F',t:'Fontes e nota metodológica',secs:['a5','a6']},{n:'G',t:'Cartão de verificação técnica',secs:[]},{n:'H',t:'Para quem vai contratar',secs:[]}]},CAP_DA_SECAO={};function capDaSecao(a){return CAP_DA_SECAO[a]||null}function rotuloCap(a){return/^[0-9]+$/.test(a.n)?'Capítulo '+a.n:1===a.n.length?'Anexo '+a.n:a.n}function SeloLivro({sec:a}){const e=capDaSecao(a);return e?html`<div className="selo-livro">
    <span className="selo-t">No livro</span>

    <span className="selo-t">Só no app</span>
    <span>Aprofundamento que não está no livro.</span></div>`}function CartaoLivro(){return html`<div className="livro-c">

        renderização, dados estruturados. O app é a execução dela.</p>
    </div>
  </div>`}LIVRO.caps.forEach(a=>(a.secs||[]).forEach(e=>{CAP_DA_SECAO[e]=a}));const MANUAL=[{id:'p0',tag:'PARTE 0',t:'Antes de começar',r:'Três coisas que você precisa saber para o resto fazer sentido.',s:[{id:'p0s0',t:'O que tem em cada parte',h:'<ol>\n <li><i><b>O que mudou</b></i>\n <ol>\n <li><i>A busca virou resposta</i></li>\n <li><i>Os números que importam</i></li>\n <li><i>As três telas onde você pode aparecer</i></li>\n <li><i>Ser citado e receber visita são coisas diferentes</i></li>\n <li><i>Mito × fato, com a fonte oficial</i></li>\n <li><i>O tamanho disso no Brasil</i></li>\n </ol>\n </li>\n <li><i><b>Como a máquina funciona</b></i>\n <ol>\n <li><i>As 6 etapas até você ser citado</i></li>\n <li><i>A conta que ninguém mostra</i></li>\n <li><i>De onde cada IA puxa informação</i></li>\n <li><i>Por que a resposta muda toda vez</i></li>\n <li><i>A IA te conhecer não é a IA te indicar</i></li>\n </ol>\n </li>\n <li><i><b>O que funciona de verdade</b></i>\n <ol>\n <li><i>Como julgar qualquer afirmação sobre o assunto</i></li>\n <li><i>Os 4 porteiros</i></li>\n <li><i>Tabela de alavancas por nível de evidência</i></li>\n <li><i>Pergunta ativa a IA; palavra-chave não</i></li>\n <li><i>O contraponto honesto</i></li>\n </ol>\n </li>\n <li><i><b>Diagnóstico</b></i>\n <ol>\n <li><i>A árvore de decisão: qual dos três problemas é o seu</i></li>\n <li><i>Quando a página é relevante e mesmo assim não é citada</i></li>\n <li><i>Os quatro tipos de desalinhamento</i></li>\n <li><i>Como fazer cada análise, passo a passo</i></li>\n <li><i>Como interpretar o que você viu</i></li>\n </ol>\n </li>\n <li><i><b>Medição</b></i>\n <ol>\n <li><i>Por que uma consulta não vale nada</i></li>\n <li><i>Por que uma semana não vale nada</i></li>\n <li><i>Calculadora: o seu plano é suficiente?</i></li>\n <li><i>Montar a carteira de perguntas</i></li>\n <li><i>Calculadora: foi resultado ou foi acaso?</i></li>\n <li><i>O painel que sustenta uma reunião</i></li>\n <li><i>As seis armadilhas</i></li>\n </ol>\n </li>\n <li><i><b>Execução</b></i>\n <ol>\n <li><i>O plano de 90 dias inteiro em uma imagem</i></li>\n <li><i>Fase 0 — Medir antes de mexer</i></li>\n <li><i>Fase 1 — Fazer a IA conseguir ler você</i></li>\n <li><i>Fase 2 — Fazer a IA escolher você</i></li>\n <li><i>Fase 3 — Existir fora do seu site</i></li>\n <li><i>Fase 4 — Ler o resultado</i></li>\n <li><i>Quem faz o quê</i></li>\n <li><i>Esforço e custo</i></li>\n </ol>\n </li>\n <li><i><b>Ferramentas</b></i>\n <ol>\n <li><i>O que existe e quanto custa</i></li>\n <li><i>A coluna que ninguém publica</i></li>\n <li><i>Comprar pronto ou montar o seu?</i></li>\n <li><i>Montar o seu coletor</i></li>\n <li><i>O que dá para fazer sem gastar nada</i></li>\n </ol>\n </li>\n <li><i><b>Casos e metas defensáveis</b></i>\n <ol>\n <li><i>O melhor caso que existe, desmontado</i></li>\n <li><i>Os casos que circulam, com a metodologia aberta</i></li>\n <li><i>Metas que dá para assinar</i></li>\n <li><i>Auditar uma proposta antes de assinar</i></li>\n <li><i>As dez perguntas antes de contratar</i></li>\n </ol>\n </li>\n <li><i><b>Tendências</b></i>\n <ol>\n <li><i>O que já aconteceu</i></li>\n <li><i>As sete tendências, com a ação de cada uma</i></li>\n <li><i>O que monitorar daqui pra frente</i></li>\n </ol>\n </li>\n <li><i><b>Anexos</b></i>\n <ol>\n <li><i>Checklist mestre dos 90 dias</i></li>\n <li><i>Modelo da carteira de perguntas</i></li>\n <li><i>Modelo da matriz de diagnóstico</i></li>\n <li><i>Estrutura do relatório mensal</i></li>\n <li><i>Bibliografia comentada</i></li>\n <li><i>Nota metodológica</i></li>\n </ol>\n </li>\n </ol>'}]},{id:'p1',tag:'PARTE 1',t:'O que mudou',r:'O tamanho real da mudança, sem exagero e sem pânico. Os números aqui são todos verificáveis.',s:[{id:'s11',t:'1.1 A busca virou resposta',h:'<p>Até pouco tempo atrás, buscar era receber uma lista de links. Hoje, boa parte das buscas devolve um texto pronto, escrito pela IA, citando poucas empresas.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Em quantas buscas do Google aparece um resumo de IA</p><p class="mn-fig-s">Percentual de buscas monitoradas em que o Google exibiu um AI Overview.</p><div class="mn-bar neu"><span>Fevereiro de 2025</span><i style="width:31%"></i><b>31%</b></div><div class="mn-bar"><span>Fevereiro de 2026</span><i style="width:48%"></i><b>48%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> em quase metade das buscas o cliente já lê uma resposta antes de ver qualquer link. Se você não está dentro dessa resposta, para muita gente você não existe naquela busca.\n <span class="mn-src">Fonte: BrightEdge, buscas monitoradas, fev/2025 a fev/2026.</span></p></div>',mo:'m0'},{id:'s12',t:'1.2 Os números que importam',h:'<p>Cuidado com quem só mostra a metade animadora. Os quatro números abaixo, juntos, contam a história inteira.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><b>0,1–1,08%</b><span>do tráfego total de um site vem hoje de IA, dependendo do setor</span></div>\n <div class="mn-bl"><b>+117%</b><span>foi o crescimento desse tráfego em um ano</span></div>\n <div class="mn-bl"><b>4,4×</b><span>é quanto esse visitante converte a mais que o orgânico comum</span></div>\n <div class="mn-bl"><b>78%</b><span>desse tráfego vem só do ChatGPT</span></div>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">LEIA OS QUATRO JUNTOS</p>\n <h4>O volume ainda é pequeno. A qualidade é alta. O crescimento é rápido.</h4>\n <p>Quem só mostra o “4,4× mais conversão” está escondendo que a base é 1% do tráfego. Quem só mostra o “1%” está escondendo que dobrou em um ano e que quem chega já vem quase decidido. A decisão sensata é <b>começar barato agora e medir</b>, não fazer aposta grande nem ignorar.</p>\n </div>',mo:'m0'},{id:'s13',t:'1.3 As três telas onde você pode aparecer',h:'<p>“Aparecer na IA” não é uma coisa só. São três telas diferentes, com regras diferentes.</p>\n\n <div class="mn-tw">\n <table>\n <caption>As três superfícies e o que cada uma faz com o seu tráfego.</caption>\n <thead>\n <tr><th scope="col">Tela</th><th scope="col">Como aparece</th><th scope="col">Ainda mostra links azuis?</th><th scope="col">O que acontece se você não for citado</th></tr>\n </thead>\n <tbody>\n <tr><td><b>AI Overviews</b><br>(resumo no topo do Google)</td><td>Um bloco de texto acima dos resultados normais</td><td><span class="mn-ok">Sim, abaixo</span></td><td>Ainda pode receber clique pela lista tradicional, com taxa menor</td></tr>\n <tr><td><b>AI Mode</b><br>(modo conversa do Google)</td><td>Substitui a página de resultados por uma conversa</td><td><span class="mn-no">Não</span></td><td>Nenhuma visibilidade naquela busca</td></tr>\n <tr><td><b>ChatGPT, Perplexity, Gemini</b></td><td>Resposta em conversa, com links citados</td><td><span class="mn-no">Não</span></td><td>Nenhuma visibilidade naquela conversa</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>Por que isso importa na prática.</b> Medir só o AI Overviews e concluir que “está tudo bem” é um erro comum. As três telas puxam de conjuntos de fontes bem diferentes.</div>',mo:'m0'},{id:'s14',t:'1.4 Ser citado e receber visita são coisas diferentes',h:'<p>Aqui está uma das descobertas mais úteis e menos divulgadas: <strong>a IA que mais cita empresas não é a que mais manda visitantes.</strong></p>\n\n <div class="mn-fig"><p class="mn-fig-t">Duas distribuições opostas</p><p class="mn-fig-s">À esquerda, quem mais cita empresas nas respostas. À direita, quem mais manda gente para o site.</p><div class="mn-bar"><span>Google AI Mode</span><i style="width:54.3%"></i><b>54,3%</b></div><div class="mn-bar"><span>ChatGPT</span><i style="width:19.4%"></i><b>19,4%</b></div><div class="mn-bar"><span>Perplexity</span><i style="width:13.1%"></i><b>13,1%</b></div><div class="mn-bar"><span>Gemini</span><i style="width:6%"></i><b>6,0%</b></div><div class="mn-bar"><span>Copilot</span><i style="width:4%"></i><b>4,0%</b></div><div class="mn-bar"><span>Claude</span><i style="width:2.9%"></i><b>2,9%</b></div><div class="mn-bar"><span>ChatGPT</span><i style="width:78%"></i><b>78%</b></div><div class="mn-bar"><span>Perplexity</span><i style="width:15%"></i><b>15%</b></div><div class="mn-bar"><span>Gemini</span><i style="width:6.4%"></i><b>6,4%</b></div><div class="mn-bar"><span>Claude e outros</span><i style="width:1%"></i><b>&lt;1%</b></div><p class="mn-fig-f"><b>Em uma frase:</b> quem mais fala de você não é quem mais te manda cliente.<br><b>Detalhando:</b> o AI Mode do Google cita muito e manda pouca gente, porque a conversa acontece dentro do Google. O ChatGPT cita menos e manda muito mais. Se o seu objetivo é <b>ser lembrado</b>, olhe citação. Se é <b>receber visita</b>, olhe tráfego. São dois placares.\n <span class="mn-src">Fontes: Conductor (citações, setor de mídia, jan–ago/2026); SE Ranking (tráfego, 63.987 sites).</span></p></div>\n\n <div class="mn-bl"><b>Detalhe técnico.</b> O AI Mode cita mais porque quebra uma pergunta em várias por baixo dos panos e busca uma fonte para cada pedaço — média de 7 citações por resposta, contra 3,9 do ChatGPT.</div>',mo:'m0'},{id:'s15',t:'1.5 Mito × fato',h:'<p>Boa parte do que se vende como “otimização para IA” já foi desmentida pelo próprio Google, em documentação pública de maio de 2026.</p>\n\n <div class="mn-tw">\n <table>\n <caption>O que o Google publicou oficialmente sobre otimização para busca generativa.</caption>\n <thead><tr><th scope="col">O que vendem</th><th scope="col">O que o Google diz</th><th scope="col">Veredito</th></tr></thead>\n <tbody>\n <tr><td>“Você precisa de um arquivo <span class="mn-num">llms.txt</span>”</td><td>O Google não usa esse arquivo. Nem ajuda nem atrapalha</td><td><span class="mn-no">Não faz diferença</span></td></tr>\n <tr><td>“Precisa picotar o conteúdo em pedacinhos”</td><td>Não é necessário. Os sistemas entendem páginas com vários assuntos</td><td><span class="mn-no">Desnecessário</span></td></tr>\n <tr><td>“Precisa de um schema especial para IA”</td><td>Não existe schema específico. Use schema para os resultados ricos da busca comum</td><td><span class="mn-mid">Útil, mas por outro motivo</span></td></tr>\n <tr><td>“Precisa reescrever tudo com linguagem de IA”</td><td>A IA entende sinônimos e sentido. Fazer isso em escala pode virar spam</td><td><span class="mn-no">Pode piorar</span></td></tr>\n <tr><td>“Precisa comprar menções em blogs e fóruns”</td><td>Os mesmos filtros antispam da busca valem para as respostas de IA</td><td><span class="mn-no">Risco</span></td></tr>\n <tr><td>“Formatação bonita aumenta citação”</td><td>Em teste controlado, mudar só a formatação não teve efeito nenhum</td><td><span class="mn-no">Efeito zero</span></td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl">\n <p class="mn-lbl">DADO DE APOIO</p>\n <h4>O caso do llms.txt, em três números</h4>\n <p>Cerca de <span class="mn-num">10,13%</span> dos sites publicaram o arquivo. Em maio de 2026, <span class="mn-num">97%</span> desses arquivos nunca chegaram a ser lidos por nenhum robô. Os estudos estatísticos não encontraram relação entre ter o arquivo e ser mais citado. Perplexity e Claude confirmam que leem; Google diz que ignora.</p>\n </div>',mo:'m0'},{id:'s16',t:'1.6 O tamanho disso no Brasil',h:'<p>O Brasil não é mercado secundário nessa história.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><b>3º</b><span>maior mercado do ChatGPT no mundo, atrás de EUA e Índia</span></div>\n <div class="mn-bl"><b>310 mi</b><span>de acessos ao ChatGPT no país em um único mês</span></div>\n <div class="mn-bl"><b>99%</b><span>do tráfego de IA generativa no Brasil é ChatGPT</span></div>\n <div class="mn-bl"><b>40%</b><span>dos consumidores já usam IA para pesquisar produto antes de comprar</span></div>\n </div>\n\n <p class="mn-src">Fontes: Cadastra + Similarweb (acessos, ago/2025); Talk, Tera e Instituto Kunumi (comportamento do consumidor).</p>\n\n <div class="mn-warn">\n <p class="mn-lbl">RESSALVA IMPORTANTE</p>\n <h4>Quase todo estudo desse tema é em inglês e nos Estados Unidos</h4>\n <p>Não existe, até o fechamento deste material, estudo público com números sólidos sobre quais fontes a IA cita em perguntas feitas em português. Trate os percentuais deste manual como <b>direção</b>, não como valores exatos para o seu setor. A única forma de saber o seu número é medir o seu caso — é disso que trata a Parte 5.</p>\n </div>',mo:'m0'}]},{id:'p2',tag:'PARTE 2',t:'Como a máquina funciona',r:'Se você entender só uma parte deste manual, que seja esta. Ela explica por que a maioria dos serviços de mercado otimiza a etapa errada.',s:[{id:'s21',t:'2.1 As 6 etapas até você ser citado',h:'<p>Entre a pergunta do cliente e o seu nome na resposta existem seis etapas. Você influencia cada uma de um jeito diferente. Toque em cada etapa para ver o que dá para controlar.</p>\n\n <p>\n \n Toque em cada etapa para ver o que dá para controlar nela.\n </p>\n\n <div class="mn-bl">\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">Nem toda pergunta faz a IA buscar na internet. Numa medição, <b>57,8% das rodadas do ChatGPT não ativaram busca nenhuma</b> — o modelo respondeu de memória. Nessas, não há como você aparecer.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Perguntas ativam busca muito mais que palavras soltas. Uma frase começando com “qual”, “como” ou “onde” aumenta bastante a chance de a IA ir buscar.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Escreva conteúdo que responde perguntas reais, com a pergunta escrita do jeito que o cliente fala.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">A IA pega um punhado de páginas para ler antes de responder. Se a sua não está nesse punhado, <b>nada do que você escreveu nela importa</b>. Este é o gargalo real.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Indexação, velocidade, canônicas, autoridade e consistência de dados. Ou seja: SEO clássico bem feito.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Confirme que a página está indexada e elegível para aparecer na busca comum com trecho. Sem isso, o resto não roda.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">A IA reordena os candidatos e só os primeiros entram no espaço de leitura dela. Em teste controlado, <b>estar em 1º da lista contra 2º já muda a citação de forma decisiva</b>.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Mesma alavanca da etapa 2: relevância e autoridade. Não existe atalho de texto que compense estar fora do topo.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Trate posição como consequência de fundamento, não como algo que se resolve reescrevendo o texto.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">Aqui sim o conteúdo da página decide. É a etapa em que agem os quatro porteiros da Parte 3: assunto certo, preço na página, data recente e posição.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Preço explícito, dados técnicos, comparações, data visível e linguagem afirmativa com evidência.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd><b>Esta é a única etapa que se resolve escrevendo.</b> Só que ela vem depois das três anteriores — e é por ela que quase todo serviço de mercado começa.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">Ser citado errado é resultado negativo, mas um painel que só conta citações registra como positivo. Em auditoria de referência, <b>apenas 51,5% das frases eram totalmente sustentadas pela fonte citada</b>.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Consistência de informação entre o seu site, o Perfil da Empresa no Google, os diretórios e as avaliações.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Audite não só se você aparece, mas o que dizem sobre você. Informação divergente entre canais vira descrição errada.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">É a etapa com menos evidência científica de todas. <b>Nenhum estudo revisado mostrou efeito causal estável</b> de otimização sobre clique e conversão.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Pouco, de forma direta. O que dá para fazer é medir com grupo de controle e não confundir crescimento da plataforma com resultado do seu trabalho.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Promessas de receita atreladas a este canal não têm sustentação na literatura. Trate como indicador atrasado, nunca como métrica principal.</dd></div>\n </dl>\n </div>\n\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">A CONCLUSÃO PRÁTICA</p>\n <h4>O gargalo não é a citação. É a recuperação.</h4>\n <p>Quase todo serviço de mercado começa pela etapa 4, reescrevendo textos. Só que reescrever uma página que não é recuperada não produz efeito nenhum. Pior: num teste que mediu o caminho inteiro, mexer só no corpo do texto <b>reduziu</b> a presença entre as 20 primeiras em cerca de 9%, e entre as 10 primeiras depois da reordenação em 16%.</p>\n </div>',ta:['T4','T6'],mo:'m0'},{id:'s22',t:'2.2 A conta que ninguém mostra',h:'<p class="mn-deep">A chance de você ser citado é a multiplicação de três chances menores. Não é uma coisa só.</p>\n\n <div class="mn-bl">\n <span>chance de ser citado</span><span>=</span><br>\n &nbsp;&nbsp;&nbsp;&nbsp;chance de a IA buscar<span>×</span><br>\n &nbsp;&nbsp;&nbsp;&nbsp;chance de você entrar na lista<span>×</span><br>\n &nbsp;&nbsp;&nbsp;&nbsp;chance de ela escolher você\n <p>Exemplo com números plausíveis: se a IA busca em 60% das vezes, você entra na lista em 30% dessas, e é escolhido em 50% dessas — a sua chance real é 0,60 × 0,30 × 0,50 = <b>9%</b>. Aparecer em 9 de cada 100 respostas.</p>\n </div>\n\n <p class="mn-deep">Repare no que isso ensina. Se você dobrar a etapa da escolha, de 50% para 100%, sai de 9% para 18%. Mas se dobrar a entrada na lista, de 30% para 60%, também vai para 18% — e essa segunda alavanca costuma ser mais barata de mexer, porque é higiene técnica.</p>\n\n <div class="mn-bl"><b>Armadilha de painel.</b> Muita ferramenta calcula “fatia de citação” só entre as respostas que tiveram citação, e ignora as que não tiveram. Isso infla o número. O denominador certo inclui as rodadas em que a IA nem buscou.</div>',ta:['T4'],mo:'m0'},{id:'s23',t:'2.3 De onde cada IA puxa informação',h:'<p class="mn-deep">Elas não bebem da mesma fonte. É por isso que você pode ser bem citado em uma e invisível em outra.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Origem principal da informação por motor, com foco em negócio local.</caption>\n <thead><tr><th scope="col">Motor</th><th scope="col">Fonte principal</th><th scope="col">O que você atualiza para influenciar</th></tr></thead>\n <tbody>\n <tr><td><b>ChatGPT</b></td><td>Busca na web via Bing, mais bases de lugares. Em consultas locais, lê e exibe o conteúdo do Perfil da Empresa no Google</td><td>Google Meu Negócio, Bing Places, avaliações, site indexado no Bing</td></tr>\n <tr><td><b>Google AI Mode<br>e AI Overviews</b></td><td>Índice do próprio Google e dados do Maps</td><td>SEO clássico, Google Meu Negócio, consistência de nome, endereço e telefone</td></tr>\n <tr><td><b>Perplexity</b></td><td>Índice próprio, com forte peso de conteúdo editorial e listas “melhores X”</td><td>Presença em publicações e diretórios do seu setor</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-box">\n <p class="mn-lbl">PARA NEGÓCIO LOCAL</p>\n <h4>Não existe compra de posição dentro da resposta orgânica</h4>\n <p>Em consultas locais, o caminho de influência é indireto e conhecido: melhorar o Perfil da Empresa no Google, as avaliações e a consistência dos dados. Uma edição no perfil pode aparecer na resposta da IA em poucos dias, porque essas respostas são geradas com busca ao vivo na maior parte dos casos.</p>\n </div>',ta:['T9','T14'],mo:'m2'},{id:'s24',t:'2.4 Por que a resposta muda toda vez',h:'<p>Esta é a característica mais mal compreendida do canal — e a que mais atrapalha quem contrata serviço sem saber avaliar.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Quanto se repete de uma medição para a outra</p><p class="mn-fig-s">Escala de 0 a 1. Quanto mais perto de 1, mais estável. Quanto mais perto de 0, mais muda.</p><div class="mn-bar"><span>Fontes citadas, de um dia para o outro</span><i style="width:38%"></i><b>0,34–0,42</b></div><div class="mn-bar"><span>Fontes citadas, no mesmo dia</span><i style="width:37%"></i><b>0,32–0,43</b></div><div class="mn-bar"><span>Marcas mencionadas, de um dia para o outro</span><i style="width:52%"></i><b>0,45–0,59</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> cerca de <b>65% das fontes citadas trocam de um dia para o outro</b>. E o mais revelador: quando a mesma pergunta é repetida no mesmo dia, a variação é praticamente a mesma. Ou seja, não é o Google mudando o algoritmo — é a própria natureza da IA. Nomes de marca são um pouco mais estáveis que links, mas ainda variam muito.\n <span class="mn-src">Fonte: Schulte, Bleeker e Kaufmann (Univ. St. Gallen, abr/2026). 4 motores, 45 dias, dados e código públicos.</span></p></div>\n\n <div class="mn-warn">\n <p class="mn-lbl">O QUE FAZER COM ISSO</p>\n <h4>Uma medição isolada não vale nada</h4>\n <p>Uma única consulta tem margem de erro tão grande que a informação é praticamente inútil. Segundo o mesmo estudo, é preciso repetir a <b>mesma pergunta pelo menos 7 vezes por dia</b> para ter uma estimativa razoável de marca, e acompanhar por <b>10 a 24 dias</b> para o número parar de balançar. Relatório semanal com uma consulta por pergunta é ruído com cara de gráfico.</p>\n <p>É por isso que o topo desta página abre com a mesma pergunta feita sete vezes. Aquilo não é efeito visual: é o comportamento real do canal.</p>\n </div>',ta:['T3'],mo:'m1'},{id:'s25',t:'2.5 A IA te conhecer não é a IA te indicar',h:'<p>Este é o teste que quase todo dono de empresa faz errado. Você pergunta “o que você sabe sobre a minha empresa?”, recebe um parágrafo elogioso e conclui que está bem posicionado. Não está.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Reconhecer quando perguntam pelo nome × indicar quando não perguntam</p><p class="mn-fig-s">Estudo com 112 empresas. Percentual de vezes em que a empresa apareceu.</p><div class="mn-bar"><span>ChatGPT — perguntando pelo nome</span><i style="width:99.4%"></i><b>99,4%</b></div><div class="mn-bar"><span>ChatGPT — pedindo indicação genérica</span><i style="width:3.32%"></i><b>3,3%</b></div><div class="mn-bar"><span>Perplexity — perguntando pelo nome</span><i style="width:94.3%"></i><b>94,3%</b></div><div class="mn-bar"><span>Perplexity — pedindo indicação genérica</span><i style="width:8.29%"></i><b>8,3%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> a IA conhece quase todo mundo quando você entrega o nome. Isso não custa nada e não vale nada. O que vale é aparecer quando o cliente <b>não sabe o seu nome</b> e só descreve o que precisa. São dois testes separados e você deve medir os dois.\n <span class="mn-src">Fonte: Sharma (2026), 112 empresas, dois modelos. Estudo em preprint.</span></p></div>',mo:'m0'}]},{id:'p3',tag:'PARTE 3',t:'O que funciona de verdade',r:'Tudo aqui vem de estudo publicado, com o nível de confiança declarado em cada afirmação.',s:[{id:'s31',t:'3.1 Como julgar qualquer afirmação sobre o assunto',h:'<p class="mn-deep">Antes das respostas, a ferramenta para você não depender de ninguém. Toda afirmação sobre visibilidade em IA nasce de um tipo de teste. Uns valem muito mais que outros.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><span>A</span><div class="mn-bl"><h5>Teste de campo com grupo de controle</h5><p>Mede efeito real sobre visita e venda, comparando com quem não recebeu a mudança. É o padrão-ouro. Praticamente não existe neste tema.</p></div></div>\n <div class="mn-bl"><span>B</span><div class="mn-bl"><h5>Motores reais, muitas repetições, vários dias</h5><p>Mostra como a visibilidade se distribui de verdade. Bom para diagnóstico, não prova causa.</p></div></div>\n <div class="mn-bl"><span>C</span><div class="mn-bl"><h5>Motor real, mas com as páginas entregues na mão</h5><p>Mede o efeito depois que a página já foi encontrada. Não diz nada sobre ser encontrada.</p></div></div>\n <div class="mn-bl"><span>D</span><div class="mn-bl"><h5>Simulação completa em laboratório</h5><p>Consegue separar cada etapa. Vale para entender o mecanismo, não para prever o mundo real.</p></div></div>\n <div class="mn-bl"><span>E</span><div class="mn-bl"><h5>Contexto fixo, ou uma IA avaliando outra IA</h5><p>Evidência fraca. É de onde vem a maioria dos números de marketing.</p></div></div>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">USE ISSO NA PRÓXIMA REUNIÃO</p>\n <h4>O famoso “+40% de visibilidade” é o tipo de evidência mais fraco que existe</h4>\n <p>O número vem do estudo que criou o termo, em 2024. Ele mede o aumento da fatia de texto atribuída a uma fonte que <b>já tinha sido colocada</b> num conjunto de cinco documentos. Não significa 40% mais visitas, nem 40% mais chance de ser encontrado. Quem usa esse número como promessa comercial está esticando muito além do que o estudo mostra.</p>\n </div>',mo:'m0'},{id:'s32',t:'3.2 Os 4 porteiros',h:'<p>O teste mais rigoroso já publicado comparou páginas duas a duas, mudando <strong>um único fator por vez</strong>, com nomes de marca escondidos e ordem sorteada. Foram 252 mil rodadas em 6 modelos diferentes. Quatro fatores foram decisivos nos seis modelos.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Força de cada fator na escolha de quem é citado</p><p class="mn-fig-s">Barra maior = fator mais decisivo. Escala comprimida: cada marca vale 10 vezes a anterior.</p><div class="mn-bar"><span>Assunto bate com a pergunta porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Preço está na página porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Data recente e visível porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Posição na lista porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Especificações técnicas</span><i style="width:60%"></i><b>243</b></div><div class="mn-bar"><span>Profundidade da análise</span><i style="width:53%"></i><b>132</b></div><div class="mn-bar"><span>Evidência para o que afirma</span><i style="width:42%"></i><b>46</b></div><div class="mn-bar"><span>Comparação com alternativas</span><i style="width:17%"></i><b>4,7</b></div><div class="mn-bar"><span>Texto sem contradições</span><i style="width:11%"></i><b>2,8</b></div><div class="mn-bar neu"><span>Formatação e organização visual</span><i style="width:1%"></i><b>≈1,0</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> repare na inversão. <b>Colocar o preço na página é porteiro. Deixar a página bonita e organizada não tem efeito nenhum.</b> Trocar “consulte valores” por uma faixa de preço real é uma das mudanças mais baratas e mais fortes que existem.\n <span class="mn-src">Fonte: Vishwakarma, Kumar e Jamidar (Sprinklr), SIGIR 2026. 252.000 rodadas, 6 modelos, 18 fatores.</span></p></div>\n\n <div class="mn-key">\n <p class="mn-lbl">AS QUATRO PERGUNTAS DO PORTEIRO</p>\n <h4>Rode isso em qualquer página antes de qualquer outra coisa</h4>\n <p><b>1.</b> Esta página responde exatamente a pergunta que o cliente faz, ou responde à categoria dela?<br>\n <b>2.</b> Tem preço, faixa de preço ou valor concreto escrito?<br>\n <b>3.</b> Tem data visível, real e atualizada?<br>\n <b>4.</b> A página está indexada e aparecendo na busca comum?</p>\n <p>Quatro “sim” antes de contratar qualquer redação nova.</p>\n </div>',ta:['T4','T6','T8'],mo:'m2'},{id:'s33',t:'3.3 Tabela de alavancas por nível de evidência',h:'<p class="mn-deep">Consolidação de 45 estudos revisados entre 2023 e 2026. Use como filtro de orçamento.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Nível de sustentação de cada alavanca na literatura revisada.</caption>\n <thead><tr><th scope="col">Alavanca</th><th scope="col">Evidência</th><th scope="col">Condição</th><th scope="col">O que fazer</th></tr></thead>\n <tbody>\n <tr><td>Responder exatamente a pergunta</td><td><span class="mn-ok">Forte</span></td><td>Intenção clara, sem inventar dado</td><td>Uma página por pergunta real, não por palavra-chave</td></tr>\n <tr><td>Posição entre os candidatos</td><td><span class="mn-ok">Forte</span></td><td>Página já recuperada</td><td>Resolver com SEO técnico, não com redação</td></tr>\n <tr><td>Dado extraível (número, definição, comparação)</td><td><span class="mn-ok">Moderada a forte</span></td><td>Verdadeiro, datado e atribuído</td><td>Números com fonte. Nunca inventar estatística</td></tr>\n <tr><td>Preço, data e recência</td><td><span class="mn-mid">Moderada</span></td><td>Consulta comercial ou sensível a tempo</td><td>Valor concreto na página e data de atualização</td></tr>\n <tr><td>Estrutura do documento</td><td><span class="mn-mid">Moderada e instável</span></td><td>Efeito diferente em cada etapa</td><td>Testar, não presumir. Pode ajudar numa etapa e atrapalhar noutra</td></tr>\n <tr><td>Fluidez e simplificação do texto</td><td><span class="mn-mid">Fraca a moderada</span></td><td>Varia por setor e por motor</td><td>Escrever para a pessoa primeiro</td></tr>\n <tr><td>Tom de autoridade</td><td><span class="mn-no">Fraca e instável</span></td><td>Pode conflitar com credibilidade</td><td>Confiança não substitui evidência</td></tr>\n <tr><td>Repetir palavra-chave</td><td><span class="mn-no">Nula ou negativa</span></td><td>Vários testes</td><td>Evitar</td></tr>\n <tr><td>Só mudar formatação</td><td><span class="mn-no">Nula</span></td><td>Teste controlado com 252 mil rodadas</td><td>Não gastar orçamento nisso</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>Contraintuitivo e comprovado.</b> Num estudo de 2026, um método que <b>encurtou as páginas em 53%</b>, cortando ruído e deixando só os pontos de informação, alcançou desempenho competitivo de citação. Página menor e mais limpa venceu página maior.</div>',ta:['T8','T10','T12'],mo:'m3'},{id:'s34',t:'3.4 Pergunta ativa a IA; palavra-chave não',h:'<div class="mn-fig"><p class="mn-fig-t">Quando o Google decide mostrar um resumo de IA</p><p class="mn-fig-s">Análise de 55.393 buscas ao longo de 40 dias.</p><div class="mn-bar neu"><span>Busca comum, na média</span><i style="width:13.7%"></i><b>13,7%</b></div><div class="mn-bar"><span>Busca escrita como pergunta</span><i style="width:64.7%"></i><b>64,7%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> uma busca escrita como pergunta tem quase 5 vezes mais chance de acionar a IA. Isso muda a arquitetura do conteúdo: organize o site por <b>perguntas que o cliente faz</b>, e não por lista de termos.\n <span class="mn-src">Fonte: Xu et al. (2026), 55.393 buscas em tendência, 40 dias.</span></p></div>',ta:['T1'],mo:'m1'},{id:'s35',t:'3.5 O contraponto honesto',h:'<p>Um manual que só mostra o lado bom não serve para decidir. Três achados que limitam tudo o que foi dito acima.</p>\n\n <div class="mn-warn">\n <p class="mn-lbl">1. RECEITA GENÉRICA NÃO TRANSFERE</p>\n <h4>Em 54 combinações testadas, só 3 deram resultado positivo</h4>\n <p>Um estudo com cerca de 1.900 buscas e 16.360 documentos aplicou as receitas populares em vários setores. Apenas 3 de 54 combinações método–setor foram positivas de forma significativa, e nenhuma no caso de perguntas e respostas. Pior: <b>quanto mais gente adota a mesma tática, menor fica o ganho de cada um</b>, até virar praticamente soma zero.</p>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">2. OTIMIZAR PODE PIORAR</p>\n <h4>Mexer só no texto reduziu a chance de ser encontrado</h4>\n <p>No único teste que mediu o caminho completo, a reescrita do corpo da página derrubou a presença entre as 20 primeiras em cerca de 9% e a citação final em 6%. O ganho numa etapa foi engolido pela perda em outra. É por isso que a ordem das etapas da Parte 2 não é detalhe.</p>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">3. NINGUÉM PROVOU LIGAÇÃO COM RECEITA</p>\n <h4>A evidência sobre clique e venda é a mais fraca de todas</h4>\n <p>A revisão de 45 estudos conclui que conteúdo já recuperado pode influenciar a resposta, mas <b>nenhuma técnica revisada mostrou efeito causal estável e duradouro sobre descoberta orgânica, clique ou conversão</b>. O melhor caso real disponível registrou aumento bruto de 5,7 vezes nas visitas vindas do ChatGPT — só que as páginas que <b>não</b> receberam tratamento já tinham subido 3,5 vezes sozinhas. O ganho realmente atribuível ficou em <b>1,82 vez</b>, e mesmo assim o teste de placebo não foi conclusivo.</p>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O QUE PROMETER, ENTÃO</p>\n <h4>Um número defensável, em vez de um número bonito</h4>\n <p>A faixa que a evidência sustenta é da ordem de <b>1,3 a 2,5 vezes</b> em visitas vindas de IA, depois de descontar o crescimento natural das plataformas. Quem promete 5 vezes está usando o número bruto e omitindo o desconto. E nenhuma promessa de posição faz sentido num canal onde a resposta muda entre duas consultas seguidas.</p>\n </div>',mo:'m0'}]},{id:'p4',tag:'PARTE 4',t:'Diagnóstico',r:'O erro operacional do mercado é aplicar a mesma receita de reescrita em todo mundo. Aqui você descobre, em uma tarde, qual das três causas é a sua.',s:[{id:'s41',t:'4.1 A árvore de decisão',h:'<p>Rode o teste da Parte 5 primeiro — 20 perguntas, 7 rodadas cada. Depois responda a pergunta abaixo e toque no ramo que corresponde ao seu caso.</p>\n\n <p>\n \n Toque no ramo que descreve o que você viu.\n </p>\n\n <p><b>Nas rodadas em que a IA buscou na internet:</b> a sua marca apareceu na resposta? E o seu site apareceu na lista de fontes citadas?</p>\n\n <div class="mn-bl">\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que isso significa</dt><dd class="mn-lead">Você já passou pelas duas etapas difíceis: a IA encontra o seu site e o considera candidato. O que falta é ser escolhido com mais frequência entre os candidatos. <b>É o problema mais barato de resolver dos três.</b></dd></div>\n <div class="mn-bl"><dt>Onde agir</dt><dd>Nos quatro porteiros da Parte 3, na página específica que já é citada. Preço explícito, data real e visível, especificações, comparação com alternativas e evidência para o que a página afirma.</dd></div>\n <div class="mn-bl"><dt>O que <u>não</u> fazer</dt><dd>Não mexa na estrutura técnica do site. Você já provou que ela funciona. Mudança grande aqui pode derrubar o que já está de pé.</dd></div>\n <div class="mn-bl"><dt>Primeira ação</dt><dd>Pegue a página que aparece nas citações e responda as quatro perguntas do porteiro. Corrija a primeira que der “não”.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que isso significa</dt><dd class="mn-lead">A IA leu o seu site e mesmo assim não indicou o seu negócio. Isso é diagnóstico bom: o gargalo está no <b>conteúdo daquela página específica</b>, não no site inteiro. Em um estudo de 2026, <b>43% das páginas relevantes ao assunto não recebiam nenhuma citação</b> — é o caso mais comum de todos.</dd></div>\n <div class="mn-bl"><dt>Onde agir</dt><dd>Classifique o tipo de falha na seção 4.3 antes de escrever qualquer coisa. Em 62% dos casos o problema é desalinhamento com a intenção da pergunta, não falta de texto.</dd></div>\n <div class="mn-bl"><dt>O que <u>não</u> fazer</dt><dd>Não escreva “mais conteúdo”. Página maior não é página melhor: um método que <b>encurtou as páginas em 53%</b>, cortando ruído, alcançou desempenho competitivo de citação.</dd></div>\n <div class="mn-bl"><dt>Primeira ação</dt><dd>Leia a pergunta que o cliente faz e leia o título da sua página. Se um responde à categoria e o outro pede uma indicação, você achou a falha.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que isso significa</dt><dd class="mn-lead">A IA nem chegou a ler o seu site. <b>Nada que você escrever nele terá efeito</b> enquanto isso não mudar. É o problema mais caro e mais lento — e o único em que reescrever texto é dinheiro jogado fora.</dd></div>\n <div class="mn-bl"><dt>Onde agir</dt><dd>É trabalho técnico de busca: indexação, robots.txt, renderização, canônicas duplicadas, velocidade, e consistência de nome, endereço e telefone entre site, Perfil da Empresa no Google, Bing Places e diretórios.</dd></div>\n <div class="mn-bl"><dt>O que <u>não</u> fazer</dt><dd>Não contrate redação. Não compre ferramenta de monitoramento cara ainda — ela vai passar meses mostrando zero e você já sabe o porquê.</dd></div>\n <div class="mn-bl"><dt>Primeira ação</dt><dd>Busque no Google por <span class="mn-num">site:seudominio.com.br</span> e confira se as páginas-alvo aparecem. Se não aparecem na busca comum, não existem para a IA. Comece por aí.</dd></div>\n </dl>\n </div>\n\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">POR QUE ISSO MUDA O ORÇAMENTO</p>\n <h4>Os três ramos têm custo e prazo muito diferentes</h4>\n <p><b>Ramo A</b> — dias, e cabe no time atual. <b>Ramo B</b> — semanas, exige redação com método. <b>Ramo C</b> — meses, exige desenvolvedor. Um fornecedor que cobra o mesmo pelos três, ou que aplica a mesma receita nos três, não está diagnosticando.</p>\n </div>',ir:['diag','Abrir a árvore guiada'],ta:['T5','T10'],mo:'m3'},{id:'s42',t:'4.2 Quando a página é relevante e mesmo assim não é citada',h:'<p>Este é o dado mais útil da Parte 4. Um estudo de 2026 classificou por que páginas <em>do assunto certo</em> deixam de ser citadas.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">As causas, por peso</p><p class="mn-fig-s">Classificação de falhas de citação em páginas topicamente relevantes.</p><p class="mn-fig-a">Gráfico de rosca: 62,2% desalinhamento com a pergunta, 27,1% qualidade de apresentação, 10,7% outras causas.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> quase dois terços do problema se resolvem <b>remapeando</b> a página para a pergunta real — não escrevendo mais. No mesmo estudo, o reparo dirigido a cada tipo de falha levou a taxa de citação de <span class="mn-num">57,0%</span> para <span class="mn-num">83,7%</span>. Aplicado a perguntas que o método nunca tinha visto, o ganho caiu para <span class="mn-num">+14,3</span> pontos — ainda relevante, e um lembrete útil de que resultado de laboratório encolhe no mundo real.\n <span class="mn-src">Fonte: Tian et al. (2026), arXiv 2603.09296. Preprint.</span></p></div>',ta:['T10','T11'],mo:'m3'},{id:'s43',t:'4.3 Os quatro tipos de desalinhamento',h:'<p>Se você caiu no Ramo B, é aqui que descobre o que exatamente corrigir. Procure o <em>sintoma</em>: ele é observável, você não precisa adivinhar.</p>\n\n <div class="mn-bl">\n <div class="mn-bl">\n <p>1</p>\n <h4>Intenção divergente</h4>\n <p><b>Sintoma:</b> a pergunta pede uma indicação, um preço ou um agendamento — e a sua página explica o que é o serviço.</p>\n <p><b>Correção:</b> a página precisa responder na mesma moeda da pergunta. Se perguntam “quanto custa”, tem que ter valor. Se perguntam “qual você indica”, tem que ter o argumento de escolha, não a enciclopédia do procedimento.</p>\n </div>\n <div class="mn-bl">\n <p>2</p>\n <h4>Lacuna de informação</h4>\n <p><b>Sintoma:</b> a IA cita concorrentes que trazem um dado que você não tem na página — bairro, tipo de equipamento, público atendido, forma de pagamento.</p>\n <p><b>Correção:</b> escreva o que está implícito. O que “todo mundo do ramo sabe” a IA não sabe se não estiver escrito com todas as letras.</p>\n </div>\n <div class="mn-bl">\n <p>3</p>\n <h4>Informação desatualizada</h4>\n <p><b>Sintoma:</b> a IA d
