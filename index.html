escreva a mensagem pronta, curta, com os termos certos. Não invente causas fora do texto; se faltar dado, diga o que copiar da ferramenta.\n\nTexto:\n[cole aqui]\n\nFICHA: seção 7 (a verificação correspondente: resultado e pendência) e seção 12.',depois:'O item 4 é o mais valioso: uma mensagem com os termos certos faz o suporte resolver em uma resposta em vez de cinco. Guarde as que funcionaram.',cap:'13',quando:'Qualquer relatório ou erro de ferramenta.',mem:'7, 12',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:17,t:'mensagem para a hospedagem',texto:'AIndicação · P17 · mensagem para a hospedagem\nEscreva uma mensagem curta e educada ao suporte de [nome da hospedagem] sobre o site [seusite.com.br], pedindo: 1) confirmar se algum firewall, WAF, antibot ou “proteção contra bots” bloqueia ou desafia (challenge/captcha) os user-agents OAI-SearchBot, ChatGPT-User, PerplexityBot, Perplexity-User, Claude-SearchBot, Claude-User e Googlebot — e liberar todos; 2) confirmar que o robots.txt servido é exatamente o arquivo da raiz, sem regras acrescentadas; 3) [opcional — apague se não precisar: um único redirecionamento 301 de http e de www para https://seusite.com.br, e renovação automática do certificado]. Pedir resposta por escrito com o que estava configurado e o que mudou. Até 12 linhas.\nQuando eu colar a resposta deles, me diga o que foi resolvido e o que ficou pendente.\n\nFICHA: seção 7 (verificação 12: mensagem enviada em [data]; resposta; pendências).',depois:'Cole a resposta do suporte de volta e pergunte o que ficou pendente. Depois, refaça as verificações 5 e 12.',cap:'14',quando:'Sem Cloudflare, ou quando a hospedagem precisa liberar robôs.',mem:'7',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:18,t:'dados estruturados',texto:'AIndicação · P18 · dados estruturados\nGere o bloco JSON-LD do tipo [LocalBusiness — ou o mais específico que existir: Dentist, BeautySalon, LegalService, Restaurant…] com estes dados e somente estes — pegue da FICHA o que já existe; o que faltar, deixe o campo de fora: nome exatamente como no Perfil da Empresa; endereço (rua, número, bairro, cidade, UF, CEP); telefone; site; faixa de preço em texto (ex.: “R$ 180 a R$ 400 por sessão”); cidades atendidas; horário; redes. Use "@context": "https://schema.org"; nenhum campo que eu não informei (nem nota, nem avaliação, nem coordenadas).\nDepois: onde eu colo isso na minha plataforma; e lembre-me de validar em validator.schema.org e de repetir preço e endereço no texto visível.\n\nFICHA: seção 7 (verificação 9: bloco gerado em [data]; validado? colado?).',depois:'Cole em validator.schema.org antes de publicar. O bloco escondido confirma o texto visível — não o substitui.',cap:'15',quando:'Verificação 9 reprovada, sem plugin que gere o bloco.',mem:'7',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:19,t:'ordenar os reparos',texto:'AIndicação · P19 · ordenar os reparos\nAqui estão as verificações que reprovaram e os problemas encontrados nas páginas — ou use as seções 7 e 9 da FICHA: [lista].\nOrdene numa tabela — tarefa · esforço (minutos / horas / dias) · quem faz (eu / quem cuida do site / hospedagem) · por que primeiro — com esta prioridade fixa: 1º o que bloqueia o robô (robots.txt, firewall, certificado, laço de redirecionamento); 2º conteúdo que só existe com JavaScript; 3º os porteiros (preço escrito, data visível, título que responde, indexação e canônica); 4º nome/endereço/telefone iguais e Perfil da Empresa; 5º dados estruturados e velocidade; 6º o resto. Marque “esperar” tudo que for redação nova antes do dia 21. Se o meu tempo semanal (FICHA) não der, diga o que fica para o próximo ciclo.\n\nFICHA: seção 12 (lista priorizada, com datas-alvo).',depois:'Uma tarefa por vez, com data na matriz do Anexo C. Se a lista tiver dez itens e o tempo for curto, os cinco primeiros já valem o ciclo.',cap:'16',quando:'Com as reprovações em mãos: a ordem do reparo.',mem:'12',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:20,t:'descrição do Perfil da Empresa',texto:'AIndicação · P20 · descrição do Perfil da Empresa\nEscreva a descrição do meu Perfil da Empresa no Google: até 750 caracteres, português simples e direto, sem promoção, sem link, sem telefone, nome uma vez só. Dados: os da FICHA (negócio, serviços principais, bairro e cidade, cidades atendidas, desde quando, para quem, diferenciais verdadeiros, faixa de preço); o que faltar, pergunte antes de escrever.\nEstrutura: 1ª frase, o que somos e onde; 2ª, para quem e o que fazemos; 3ª, diferenciais e faixa de preço; 4ª, como agendar (sem link). Use as palavras das perguntas da carteira. Conte os caracteres.\nDepois liste o que precisa estar igual no site (o espelho).\n\nFICHA: seção 8 (descrição publicada em [data]).',depois:'Cole no perfil e, no mesmo dia, confira que os mesmos dados estão na página do site — o espelho é o que vale.',cap:'17',quando:'Descrição do Perfil.',mem:'8',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:21,t:'responder uma avaliação',texto:'AIndicação · P21 · responder uma avaliação\nAvaliação de [nota] estrelas, de [nome]:\n[cole aqui]\nEscreva a resposta do proprietário: até 4 linhas, humana e direta; cite o serviço e o bairro ou unidade uma vez, sem propaganda. Positiva: agradeça algo específico que a pessoa escreveu. Negativa: agradeça, reconheça o ponto em uma frase, diga o que foi feito ou vai ser feito — só com fatos que eu der: [fatos] — e convide a resolver por [telefone]; não discuta, não revele dados do cliente, não peça para apagar. Sem “prezado”, sem “lamentamos o transtorno”, sem frase de modelo.\nSe a reclamação repetir uma que já apareceu antes (FICHA, seção 8), me avise: isso é dado de fidelidade.\n\nFICHA: seção 8 (avaliação respondida em [data]; tema recorrente, se houver).',depois:'Troque uma palavra pela sua. A IA lê a resposta como parte do perfil — resposta que parece de gente é o objetivo.',cap:'17',quando:'A cada avaliação recebida.',mem:'8',fase:'Dias 30–70 · Fase 2, a IA escolher você'},{n:22,t:'pedir avaliação',texto:'AIndicação · P22 · pedir avaliação\nEscreva três versões de uma mensagem de WhatsApp (até 4 linhas cada) pedindo avaliação no Google a um cliente que acabou de usar [serviço] na [negócio, bairro]: tom pessoal, sem pressão; meia frase sobre por que ajuda (outras pessoas encontrarem o serviço); o espaço [LINK DA AVALIAÇÃO]; sem desconto, brinde, sorteio ou qualquer troca; sem pedir “5 estrelas” — peça a opinião sincera; termine agradecendo. Uma para o mesmo dia, uma para três dias depois, uma para cliente antigo.\nDiga em que momento do meu atendimento (FICHA) faz mais sentido enviar.\n\nFICHA: seção 8 (pedido de avaliação ativo desde [data]; versão escolhida).',depois:'Use o link de “Pedir avaliações” do perfil. Envie a todos, no mesmo momento do processo. Uma avaliação a cada cinco a dez pedidos é normal.',cap:'17',quando:'Ao montar o pedido de avaliação.',mem:'8',fase:'Dias 30–70 · Fase 2, a IA escolher você'},{n:23,t:'registrar a coleta',texto:'AIndicação · P23 · registrar a coleta\nResumo da minha coleta desde a última vez — por pergunta e motor: apareceu __ de 7 na marca, __ de 7 no site; e os dias feitos:\n[cole aqui — ou “só confirmo: fiz os dias X a Y sem faltar”]\n1) Some ao que já está na FICHA (seção 5) sem apagar o anterior; 2) diga quantos dias e quantas passagens pela carteira já completei, e quantos faltam para o M1 (18 dias de coleta) e para uma leitura (24); 3) aponte anomalias: pergunta com 7 de 7 ou 0 de 7 em todos os motores, dia sem registro, coluna vazia; 4) NÃO conclua nada sobre resultado — só cobertura e consistência. Se eu perguntar “já dá para saber?”, responda com a regra dos 24 dias.\n\nFICHA: seção 5 (dias feitos, última passagem, contagens por pergunta) e seção 13.',depois:'Uma vez por semana basta. A conta da faixa fica no app ou no Anexo B; aqui o que importa é não perder a rotina.',cap:'6',quando:'Uma vez por semana, com o resumo da coleta.',mem:'5, 13',fase:'Dias 1–21 · coleta e Fase 0'},{n:24,t:'leitura do marco',texto:'AIndicação · P24 · leitura do marco\nEstou no dia [__] do plano e quero fechar o marco [M1 / M2 / M3 / M4]. Use o checklist do marco (Capítulo 10) e a FICHA, e me diga item por item: pronto / pendente / não sei — e o que falta em cada pendente. Se algum item crítico estiver pendente, diga que o marco não fecha e o que fazer primeiro; não “fecha com ressalva”.\nSe for o M4: os quatro números com faixa, o teste de sobreposição das faixas (ciclo anterior × atual) e a frase honesta — mudou, ou ainda não dá para afirmar — mais a decisão do próximo ciclo (repetir, ampliar ou parar), com os prós e contras de cada uma.\n\nFICHA: seção 3 (marco fechado em [data], ou pendências), seção 11 (decisão) e seção 12.',depois:'Marco é portão: não passe sem os itens. O M1 é o único que não dá para recuperar depois — se faltar coleta, faça a coleta.',cap:'10',quando:'Em cada marco: M1 (21), M2 (45), M3 (70), M4 (90).',mem:'3, 11, 12',fase:'Dias 1–21 · coleta e Fase 0'},{n:25,t:'as doze verificações',texto:'AIndicação · P25 · as doze verificações\nResultado das verificações do Capítulo 13 — número: aprovada / reprovada / não sei, e o que a ferramenta mostrou:\n[cole aqui]\nSe você consegue abrir páginas, rode você mesmo o que der: [seusite.com.br]/robots.txt, /sitemap.xml, o cadeado (https), o código-fonte de [página] procurando a frase “[uma frase do meio da página]”, a canônica e o bloco application/ld+json — e me mostre o que encontrou, dizendo claramente o que testou e o que não conseguiu.\nDepois: 1) tabela 1 a 12 com o estado de cada uma; 2) as críticas (4, 5, 6 e 12) — alguma reprovada? então nada mais importa até resolver; 3) o que ficou “não sei” e como conferir em um minuto; 4) próximos passos na ordem do reparo (12 e 4; depois 6; depois 1, 2, 3 e 8; depois 9, 10 e 11).\n\nFICHA: seção 7 (mapa 1 a 12, com data) e seção 12.',depois:'Marque “não sei” sem culpa e siga. Uma verificação por vez, na ordem que o assistente devolver.',cap:'13',quando:'Depois de rodar as doze verificações do Capítulo 13.',mem:'7, 12',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:26,t:'Perfil da Empresa, item por item',texto:'AIndicação · P26 · Perfil da Empresa, item por item\nVou responder os 15 itens do Perfil da Empresa (Capítulo 17): 1 verificado; 2 nome real, sem cidade ou serviço colado; 3 categoria principal específica; 4 endereço ou área de cobertura; 5 telefone local e site apontando para a página que responde; 6 horário com feriados; 7 descrição; 8 serviços com preço; 9 fotos suas; 10 atributos e atualização semanal; 11 perguntas e respostas; 12 avaliações respondidas em 48 h; 13 pedido de avaliação no atendimento; 14 Apple Business Connect, Bing Places e redes iguais; 15 site e perfil espelhados.\nMinhas respostas: [cole: item · sim / não / não sei · observação]\nDevolva: 1) o que está ok, pendente e “não sei” (e como conferir); 2) o que pode dar suspensão se estiver errado; 3) os três itens que mais pesam para relevância, distância e destaque no meu caso; 4) a rotina semanal (foto, atualização, respostas, pedidos).\n\nFICHA: seção 8 (itens 1 a 15 com estado e data; rotina semanal combinada).',depois:'Comece pelo que dá suspensão. Depois, vinte minutos por semana na rotina — e marque no app.',cap:'17',quando:'Perfil da Empresa, os quinze itens.',mem:'8',fase:'Dias 15–45 · Fase 1, a IA conseguir ler você'},{n:27,t:'minha página × a do concorrente',texto:'AIndicação · P27 · minha página × a do concorrente\nA IA cita [concorrente] onde eu não apareço. Vou colar o texto das duas páginas (Ctrl+U, ou copiado da tela). Usando só os textos:\n1) O que a página dele responde que a minha não responde — preço, data, bairro, equipamento, público, forma de pagamento, a pergunta exata?\n2) Título e primeira frase de cada uma: qual responde à pergunta do cliente?\n3) O que é copiável (informação que eu também tenho e não escrevi) e o que não é (reputação, tempo de mercado).\n4) Uma lista de até cinco mudanças na MINHA página, na ordem dos porteiros — sem inventar dado meu ([PREENCHER]).\n\nMinha página: [cole]\nPágina dele: [cole]\n\nFICHA: seção 9 (lacunas encontradas, por página) e seção 12.',depois:'Em quase todo caso que parece “a IA prefere os grandes”, a diferença está escrita ali — e é copiável.',cap:'16',quando:'Quando um concorrente é citado no seu lugar.',mem:'9, 12',fase:'Dias 30–70 · Fase 2, a IA escolher você'},{n:28,t:'fechar a sessão',texto:'AIndicação · P28 · fechar a sessão\nVamos encerrar por hoje. 1) Atualize a FICHA inteira com o que mudou nesta conversa, marcando a data em cada seção alterada; 2) mostre a FICHA completa, em texto puro, para eu copiar e guardar; 3) liste os três próximos passos, com o capítulo do livro e o prompt certo de cada um; 4) diga em que dia do plano estou e qual é o próximo marco. Se você tem memória persistente, salve a FICHA nela e me diga que salvou.',depois:'Copie a FICHA para um bloco de notas. É ela que você cola no P29 na próxima vez — sem ela, o assistente começa do zero.',cap:'Abertura',quando:'Fim de toda sessão.',mem:'Tudo o que mudou, com data',fase:'Toda sessão'},{n:29,t:'retomar a conversa',texto:'AIndicação · P29 · retomar a conversa\nAqui está a minha FICHA. Leia e responda em até 5 linhas: em que dia e fase estou, o que ficou pendente na última conversa e o que o método manda fazer hoje. Depois pergunte o que quero fazer — ou sugira o prompt certo.\n\nFICHA:\n[cole a FICHA inteira aqui]',depois:'Se algo na FICHA estiver errado, corrija antes de seguir: o assistente vai tratar tudo que está nela como verdade.',cap:'Abertura',quando:'Início de toda sessão seguinte, colando a FICHA.',mem:'Lê tudo; não altera',fase:'Toda sessão'}],MANUAL=[{id:'p0',tag:'PARTE 0',t:'Antes de começar',r:'Três coisas que você precisa saber para o resto fazer sentido.',s:[{id:'p0s0',t:'O que tem em cada parte',h:'<ol>\n <li><i><b>O que mudou</b></i>\n <ol>\n <li><i>A busca virou resposta</i></li>\n <li><i>Os números que importam</i></li>\n <li><i>As três telas onde você pode aparecer</i></li>\n <li><i>Ser citado e receber visita são coisas diferentes</i></li>\n <li><i>Mito × fato, com a fonte oficial</i></li>\n <li><i>O tamanho disso no Brasil</i></li>\n </ol>\n </li>\n <li><i><b>Como a máquina funciona</b></i>\n <ol>\n <li><i>As 6 etapas até você ser citado</i></li>\n <li><i>A conta que ninguém mostra</i></li>\n <li><i>De onde cada IA puxa informação</i></li>\n <li><i>Por que a resposta muda toda vez</i></li>\n <li><i>A IA te conhecer não é a IA te indicar</i></li>\n </ol>\n </li>\n <li><i><b>O que funciona de verdade</b></i>\n <ol>\n <li><i>Como julgar qualquer afirmação sobre o assunto</i></li>\n <li><i>Os 4 porteiros</i></li>\n <li><i>Tabela de alavancas por nível de evidência</i></li>\n <li><i>Pergunta ativa a IA; palavra-chave não</i></li>\n <li><i>O contraponto honesto</i></li>\n </ol>\n </li>\n <li><i><b>Diagnóstico</b></i>\n <ol>\n <li><i>A árvore de decisão: qual dos três problemas é o seu</i></li>\n <li><i>Quando a página é relevante e mesmo assim não é citada</i></li>\n <li><i>Os quatro tipos de desalinhamento</i></li>\n <li><i>Como fazer cada análise, passo a passo</i></li>\n <li><i>Como interpretar o que você viu</i></li>\n </ol>\n </li>\n <li><i><b>Medição</b></i>\n <ol>\n <li><i>Por que uma consulta não vale nada</i></li>\n <li><i>Por que uma semana não vale nada</i></li>\n <li><i>Calculadora: o seu plano é suficiente?</i></li>\n <li><i>Montar a carteira de perguntas</i></li>\n <li><i>Calculadora: foi resultado ou foi acaso?</i></li>\n <li><i>O painel que sustenta uma reunião</i></li>\n <li><i>As seis armadilhas</i></li>\n </ol>\n </li>\n <li><i><b>Execução</b></i>\n <ol>\n <li><i>O plano de 90 dias inteiro em uma imagem</i></li>\n <li><i>Fase 0 — Medir antes de mexer</i></li>\n <li><i>Fase 1 — Fazer a IA conseguir ler você</i></li>\n <li><i>Fase 2 — Fazer a IA escolher você</i></li>\n <li><i>Fase 3 — Existir fora do seu site</i></li>\n <li><i>Fase 4 — Ler o resultado</i></li>\n <li><i>Quem faz o quê</i></li>\n <li><i>Esforço e custo</i></li>\n </ol>\n </li>\n <li><i><b>Ferramentas</b></i>\n <ol>\n <li><i>O que existe e quanto custa</i></li>\n <li><i>A coluna que ninguém publica</i></li>\n <li><i>Comprar pronto ou montar o seu?</i></li>\n <li><i>Montar o seu coletor</i></li>\n <li><i>O que dá para fazer sem gastar nada</i></li>\n </ol>\n </li>\n <li><i><b>Casos e metas defensáveis</b></i>\n <ol>\n <li><i>O melhor caso que existe, desmontado</i></li>\n <li><i>Os casos que circulam, com a metodologia aberta</i></li>\n <li><i>Metas que dá para assinar</i></li>\n <li><i>Auditar uma proposta antes de assinar</i></li>\n <li><i>As dez perguntas antes de contratar</i></li>\n </ol>\n </li>\n <li><i><b>Tendências</b></i>\n <ol>\n <li><i>O que já aconteceu</i></li>\n <li><i>As sete tendências, com a ação de cada uma</i></li>\n <li><i>O que monitorar daqui pra frente</i></li>\n </ol>\n </li>\n <li><i><b>Anexos</b></i>\n <ol>\n <li><i>Checklist mestre dos 90 dias</i></li>\n <li><i>Modelo da carteira de perguntas</i></li>\n <li><i>Modelo da matriz de diagnóstico</i></li>\n <li><i>Estrutura do relatório mensal</i></li>\n <li><i>Bibliografia comentada</i></li>\n <li><i>Nota metodológica</i></li>\n </ol>\n </li>\n </ol>'},{id:'p0s1',t:'Use a IA como assistente deste método',h:'<p class="mn-lead">A mesma IA que você quer que indique o seu negócio pode trabalhar para você enquanto executa o método. Ela explica, rascunha e testa. Ela não mede.</p>\n<h4>Uma IA, dois papéis</h4>\n<ul>\n<li><b>Motor</b> — o que você <i>mede</i>: janela anônima, sem login, a pergunta exata da carteira, sete conversas novas. Você só lê e anota.</li>\n<li><b>Assistente</b> — quem te <i>ajuda</i>: logado, com contexto, pode ser o mesmo ChatGPT em outra janela. Explica um trecho, rascunha a carteira, reescreve uma página, lê um robots.txt, escreve a mensagem para a hospedagem.</li>\n</ul>\n<div class="mn-key"><p class="mn-lbl">A REGRA</p><h4>Nunca os dois na mesma janela</h4><p>Se você perguntar “a IA me indica?” na sua conta, logado, ela responde com base no seu histórico — e o resultado não vale como medição. Medir é na aba Medir, do jeito do Capítulo 6.</p></div>\n<h4>O Assistente AIndicação</h4>\n<p>O livro vem com um assistente já configurado — com o método inteiro, o manual dos trinta prompts e as regras de honestidade dentro dele. Ele fica na área restrita do leitor. Se preferir, os mesmos prompts funcionam em qualquer IA: ChatGPT, Gemini, Claude ou Copilot, na versão gratuita.</p>\n<h4>A FICHA: a memória da sua execução</h4>\n<p>Nenhuma IA lembra da conversa anterior por conta própria. Quem lembra é a <b>FICHA</b>: um texto com treze seções — negócio, pessoa, plano, carteira, coleta, ramo, técnico, Perfil da Empresa, reparos, números, decisões, pendências e a última conversa.</p>\n<ol>\n<li><b>P0</b> na primeira conversa: ele faz o diagnóstico e devolve a sua FICHA v1.</li>\n<li><b>P29</b> para retomar: você cola a FICHA e ele sabe em que dia e fase você está.</li>\n<li><b>P28</b> para fechar: ele devolve a FICHA atualizada e os três próximos passos.</li>\n</ol>\n<p>Guarde a FICHA num bloco de notas — ela é a versão oficial. Na aba <b>Ferramentas › Assistente</b> o app monta a FICHA com o que você já registrou aqui: perfil, carteira, coleta, ramo, verificações e reparos.</p>\n<h4>Como pedir bem: cinco partes</h4>\n<ol>\n<li><b>Contexto</b> — quem você é, o que vende, em que cidade, para quem (o P0 faz isso uma vez).</li>\n<li><b>Tarefa</b> — uma coisa por vez, começando com um verbo.</li>\n<li><b>Formato</b> — lista, tabela, tamanho, linguagem simples.</li>\n<li><b>Limites</b> — “não invente; onde faltar dado, escreva [PREENCHER]”.</li>\n<li><b>Conferir</b> — peça a fonte, compare com o livro, teste no seu site.</li>\n</ol>\n<h4>O que o assistente não faz</h4>\n<ul>\n<li><b>Não mede</b> visibilidade — e nenhum assistente mede: a resposta muda a cada rodada e depende da conta logada.</li>\n<li><b>Não sabe</b> se o seu site está indexado nem quanto o servidor demora — isso é o Search Console e o PageSpeed (aba Técnico).</li>\n<li><b>Inventa quando falta dado.</b> Um número que ela “lembra” sem fonte é palpite. Por isso todo prompt termina pedindo a fonte e o [PREENCHER].</li>\n</ul>'}]},{id:'p1',tag:'PARTE 1',t:'O que mudou',r:'O tamanho real da mudança, sem exagero e sem pânico. Os números aqui são todos verificáveis.',s:[{id:'s11',t:'1.1 A busca virou resposta',h:'<p>Até pouco tempo atrás, buscar era receber uma lista de links. Hoje, boa parte das buscas devolve um texto pronto, escrito pela IA, citando poucas empresas.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Em quantas buscas do Google aparece um resumo de IA</p><p class="mn-fig-s">Percentual de buscas monitoradas em que o Google exibiu um AI Overview.</p><div class="mn-bar neu"><span>Fevereiro de 2025</span><i style="width:31%"></i><b>31%</b></div><div class="mn-bar"><span>Fevereiro de 2026</span><i style="width:48%"></i><b>48%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> em quase metade das buscas o cliente já lê uma resposta antes de ver qualquer link. Se você não está dentro dessa resposta, para muita gente você não existe naquela busca.\n <span class="mn-src">Fonte: BrightEdge, buscas monitoradas, fev/2025 a fev/2026.</span></p></div>',mo:'m0'},{id:'s12',t:'1.2 Os números que importam',h:'<p>Cuidado com quem só mostra a metade animadora. Os quatro números abaixo, juntos, contam a história inteira.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><b>0,1–1,08%</b><span>do tráfego total de um site vem hoje de IA, dependendo do setor</span></div>\n <div class="mn-bl"><b>+117%</b><span>foi o crescimento desse tráfego em um ano</span></div>\n <div class="mn-bl"><b>4,4×</b><span>é quanto esse visitante converte a mais que o orgânico comum</span></div>\n <div class="mn-bl"><b>78%</b><span>desse tráfego vem só do ChatGPT</span></div>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">LEIA OS QUATRO JUNTOS</p>\n <h4>O volume ainda é pequeno. A qualidade é alta. O crescimento é rápido.</h4>\n <p>Quem só mostra o “4,4× mais conversão” está escondendo que a base é 1% do tráfego. Quem só mostra o “1%” está escondendo que dobrou em um ano e que quem chega já vem quase decidido. A decisão sensata é <b>começar barato agora e medir</b>, não fazer aposta grande nem ignorar.</p>\n </div>',mo:'m0'},{id:'s13',t:'1.3 As três telas onde você pode aparecer',h:'<p>“Aparecer na IA” não é uma coisa só. São três telas diferentes, com regras diferentes.</p>\n\n <div class="mn-tw">\n <table>\n <caption>As três superfícies e o que cada uma faz com o seu tráfego.</caption>\n <thead>\n <tr><th scope="col">Tela</th><th scope="col">Como aparece</th><th scope="col">Ainda mostra links azuis?</th><th scope="col">O que acontece se você não for citado</th></tr>\n </thead>\n <tbody>\n <tr><td><b>AI Overviews</b><br>(resumo no topo do Google)</td><td>Um bloco de texto acima dos resultados normais</td><td><span class="mn-ok">Sim, abaixo</span></td><td>Ainda pode receber clique pela lista tradicional, com taxa menor</td></tr>\n <tr><td><b>AI Mode</b><br>(modo conversa do Google)</td><td>Substitui a página de resultados por uma conversa</td><td><span class="mn-no">Não</span></td><td>Nenhuma visibilidade naquela busca</td></tr>\n <tr><td><b>ChatGPT, Perplexity, Gemini</b></td><td>Resposta em conversa, com links citados</td><td><span class="mn-no">Não</span></td><td>Nenhuma visibilidade naquela conversa</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>Por que isso importa na prática.</b> Medir só o AI Overviews e concluir que “está tudo bem” é um erro comum. As três telas puxam de conjuntos de fontes bem diferentes.</div>',mo:'m0'},{id:'s14',t:'1.4 Ser citado e receber visita são coisas diferentes',h:'<p>Aqui está uma das descobertas mais úteis e menos divulgadas: <strong>a IA que mais cita empresas não é a que mais manda visitantes.</strong></p>\n\n <div class="mn-fig"><p class="mn-fig-t">Duas distribuições opostas</p><p class="mn-fig-s">À esquerda, quem mais cita empresas nas respostas. À direita, quem mais manda gente para o site.</p><div class="mn-bar"><span>Google AI Mode</span><i style="width:54.3%"></i><b>54,3%</b></div><div class="mn-bar"><span>ChatGPT</span><i style="width:19.4%"></i><b>19,4%</b></div><div class="mn-bar"><span>Perplexity</span><i style="width:13.1%"></i><b>13,1%</b></div><div class="mn-bar"><span>Gemini</span><i style="width:6%"></i><b>6,0%</b></div><div class="mn-bar"><span>Copilot</span><i style="width:4%"></i><b>4,0%</b></div><div class="mn-bar"><span>Claude</span><i style="width:2.9%"></i><b>2,9%</b></div><div class="mn-bar"><span>ChatGPT</span><i style="width:78%"></i><b>78%</b></div><div class="mn-bar"><span>Perplexity</span><i style="width:15%"></i><b>15%</b></div><div class="mn-bar"><span>Gemini</span><i style="width:6.4%"></i><b>6,4%</b></div><div class="mn-bar"><span>Claude e outros</span><i style="width:1%"></i><b>&lt;1%</b></div><p class="mn-fig-f"><b>Em uma frase:</b> quem mais fala de você não é quem mais te manda cliente.<br><b>Detalhando:</b> o AI Mode do Google cita muito e manda pouca gente, porque a conversa acontece dentro do Google. O ChatGPT cita menos e manda muito mais. Se o seu objetivo é <b>ser lembrado</b>, olhe citação. Se é <b>receber visita</b>, olhe tráfego. São dois placares.\n <span class="mn-src">Fontes: Conductor (citações, setor de mídia, jan–ago/2026); SE Ranking (tráfego, 63.987 sites).</span></p></div>\n\n <div class="mn-bl"><b>Detalhe técnico.</b> O AI Mode cita mais porque quebra uma pergunta em várias por baixo dos panos e busca uma fonte para cada pedaço — média de 7 citações por resposta, contra 3,9 do ChatGPT.</div>',mo:'m0'},{id:'s15',t:'1.5 Mito × fato',h:'<p>Boa parte do que se vende como “otimização para IA” já foi desmentida pelo próprio Google, em documentação pública de maio de 2026.</p>\n\n <div class="mn-tw">\n <table>\n <caption>O que o Google publicou oficialmente sobre otimização para busca generativa.</caption>\n <thead><tr><th scope="col">O que vendem</th><th scope="col">O que o Google diz</th><th scope="col">Veredito</th></tr></thead>\n <tbody>\n <tr><td>“Você precisa de um arquivo <span class="mn-num">llms.txt</span>”</td><td>O Google não usa esse arquivo. Nem ajuda nem atrapalha</td><td><span class="mn-no">Não faz diferença</span></td></tr>\n <tr><td>“Precisa picotar o conteúdo em pedacinhos”</td><td>Não é necessário. Os sistemas entendem páginas com vários assuntos</td><td><span class="mn-no">Desnecessário</span></td></tr>\n <tr><td>“Precisa de um schema especial para IA”</td><td>Não existe schema específico. Use schema para os resultados ricos da busca comum</td><td><span class="mn-mid">Útil, mas por outro motivo</span></td></tr>\n <tr><td>“Precisa reescrever tudo com linguagem de IA”</td><td>A IA entende sinônimos e sentido. Fazer isso em escala pode virar spam</td><td><span class="mn-no">Pode piorar</span></td></tr>\n <tr><td>“Precisa comprar menções em blogs e fóruns”</td><td>Os mesmos filtros antispam da busca valem para as respostas de IA</td><td><span class="mn-no">Risco</span></td></tr>\n <tr><td>“Formatação bonita aumenta citação”</td><td>Em teste controlado, mudar só a formatação não teve efeito nenhum</td><td><span class="mn-no">Efeito zero</span></td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl">\n <p class="mn-lbl">DADO DE APOIO</p>\n <h4>O caso do llms.txt, em três números</h4>\n <p>Cerca de <span class="mn-num">10,13%</span> dos sites publicaram o arquivo. Em maio de 2026, <span class="mn-num">97%</span> desses arquivos nunca chegaram a ser lidos por nenhum robô. Os estudos estatísticos não encontraram relação entre ter o arquivo e ser mais citado. Perplexity e Claude confirmam que leem; Google diz que ignora.</p>\n </div>',mo:'m0'},{id:'s16',t:'1.6 O tamanho disso no Brasil',h:'<p>O Brasil não é mercado secundário nessa história.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><b>3º</b><span>maior mercado do ChatGPT no mundo, atrás de EUA e Índia</span></div>\n <div class="mn-bl"><b>310 mi</b><span>de acessos ao ChatGPT no país em um único mês</span></div>\n <div class="mn-bl"><b>99%</b><span>do tráfego de IA generativa no Brasil é ChatGPT</span></div>\n <div class="mn-bl"><b>40%</b><span>dos consumidores já usam IA para pesquisar produto antes de comprar</span></div>\n </div>\n\n <p class="mn-src">Fontes: Cadastra + Similarweb (acessos, ago/2025); Talk, Tera e Instituto Kunumi (comportamento do consumidor).</p>\n\n <div class="mn-warn">\n <p class="mn-lbl">RESSALVA IMPORTANTE</p>\n <h4>Quase todo estudo desse tema é em inglês e nos Estados Unidos</h4>\n <p>Não existe, até o fechamento deste material, estudo público com números sólidos sobre quais fontes a IA cita em perguntas feitas em português. Trate os percentuais deste manual como <b>direção</b>, não como valores exatos para o seu setor. A única forma de saber o seu número é medir o seu caso — é disso que trata a Parte 5.</p>\n </div>',mo:'m0'}]},{id:'p2',tag:'PARTE 2',t:'Como a máquina funciona',r:'Se você entender só uma parte deste manual, que seja esta. Ela explica por que a maioria dos serviços de mercado otimiza a etapa errada.',s:[{id:'s21',t:'2.1 As 6 etapas até você ser citado',h:'<p>Entre a pergunta do cliente e o seu nome na resposta existem seis etapas. Você influencia cada uma de um jeito diferente. Toque em cada etapa para ver o que dá para controlar.</p>\n\n <p>\n \n Toque em cada etapa para ver o que dá para controlar nela.\n </p>\n\n <div class="mn-bl">\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">Nem toda pergunta faz a IA buscar na internet. Numa medição, <b>57,8% das rodadas do ChatGPT não ativaram busca nenhuma</b> — o modelo respondeu de memória. Nessas, não há como você aparecer.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Perguntas ativam busca muito mais que palavras soltas. Uma frase começando com “qual”, “como” ou “onde” aumenta bastante a chance de a IA ir buscar.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Escreva conteúdo que responde perguntas reais, com a pergunta escrita do jeito que o cliente fala.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">A IA pega um punhado de páginas para ler antes de responder. Se a sua não está nesse punhado, <b>nada do que você escreveu nela importa</b>. Este é o gargalo real.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Indexação, velocidade, canônicas, autoridade e consistência de dados. Ou seja: SEO clássico bem feito.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Confirme que a página está indexada e elegível para aparecer na busca comum com trecho. Sem isso, o resto não roda.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">A IA reordena os candidatos e só os primeiros entram no espaço de leitura dela. Em teste controlado, <b>estar em 1º da lista contra 2º já muda a citação de forma decisiva</b>.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Mesma alavanca da etapa 2: relevância e autoridade. Não existe atalho de texto que compense estar fora do topo.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Trate posição como consequência de fundamento, não como algo que se resolve reescrevendo o texto.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">Aqui sim o conteúdo da página decide. É a etapa em que agem os quatro porteiros da Parte 3: assunto certo, preço na página, data recente e posição.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Preço explícito, dados técnicos, comparações, data visível e linguagem afirmativa com evidência.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd><b>Esta é a única etapa que se resolve escrevendo.</b> Só que ela vem depois das três anteriores — e é por ela que quase todo serviço de mercado começa.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">Ser citado errado é resultado negativo, mas um painel que só conta citações registra como positivo. Em auditoria de referência, <b>apenas 51,5% das frases eram totalmente sustentadas pela fonte citada</b>.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Consistência de informação entre o seu site, o Perfil da Empresa no Google, os diretórios e as avaliações.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Audite não só se você aparece, mas o que dizem sobre você. Informação divergente entre canais vira descrição errada.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que acontece</dt><dd class="mn-lead">É a etapa com menos evidência científica de todas. <b>Nenhum estudo revisado mostrou efeito causal estável</b> de otimização sobre clique e conversão.</dd></div>\n <div class="mn-bl"><dt>O que você controla</dt><dd>Pouco, de forma direta. O que dá para fazer é medir com grupo de controle e não confundir crescimento da plataforma com resultado do seu trabalho.</dd></div>\n <div class="mn-bl"><dt>Ação</dt><dd>Promessas de receita atreladas a este canal não têm sustentação na literatura. Trate como indicador atrasado, nunca como métrica principal.</dd></div>\n </dl>\n </div>\n\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">A CONCLUSÃO PRÁTICA</p>\n <h4>O gargalo não é a citação. É a recuperação.</h4>\n <p>Quase todo serviço de mercado começa pela etapa 4, reescrevendo textos. Só que reescrever uma página que não é recuperada não produz efeito nenhum. Pior: num teste que mediu o caminho inteiro, mexer só no corpo do texto <b>reduziu</b> a presença entre as 20 primeiras em cerca de 9%, e entre as 10 primeiras depois da reordenação em 16%.</p>\n </div>',ta:['T4','T6'],mo:'m0'},{id:'s22',t:'2.2 A conta que ninguém mostra',h:'<p class="mn-deep">A chance de você ser citado é a multiplicação de três chances menores. Não é uma coisa só.</p>\n\n <div class="mn-bl">\n <span>chance de ser citado</span><span>=</span><br>\n &nbsp;&nbsp;&nbsp;&nbsp;chance de a IA buscar<span>×</span><br>\n &nbsp;&nbsp;&nbsp;&nbsp;chance de você entrar na lista<span>×</span><br>\n &nbsp;&nbsp;&nbsp;&nbsp;chance de ela escolher você\n <p>Exemplo com números plausíveis: se a IA busca em 60% das vezes, você entra na lista em 30% dessas, e é escolhido em 50% dessas — a sua chance real é 0,60 × 0,30 × 0,50 = <b>9%</b>. Aparecer em 9 de cada 100 respostas.</p>\n </div>\n\n <p class="mn-deep">Repare no que isso ensina. Se você dobrar a etapa da escolha, de 50% para 100%, sai de 9% para 18%. Mas se dobrar a entrada na lista, de 30% para 60%, também vai para 18% — e essa segunda alavanca costuma ser mais barata de mexer, porque é higiene técnica.</p>\n\n <div class="mn-bl"><b>Armadilha de painel.</b> Muita ferramenta calcula “fatia de citação” só entre as respostas que tiveram citação, e ignora as que não tiveram. Isso infla o número. O denominador certo inclui as rodadas em que a IA nem buscou.</div>',ta:['T4'],mo:'m0'},{id:'s23',t:'2.3 De onde cada IA puxa informação',h:'<p class="mn-deep">Elas não bebem da mesma fonte. É por isso que você pode ser bem citado em uma e invisível em outra.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Origem principal da informação por motor, com foco em negócio local.</caption>\n <thead><tr><th scope="col">Motor</th><th scope="col">Fonte principal</th><th scope="col">O que você atualiza para influenciar</th></tr></thead>\n <tbody>\n <tr><td><b>ChatGPT</b></td><td>Busca na web via Bing, mais bases de lugares. Em consultas locais, lê e exibe o conteúdo do Perfil da Empresa no Google</td><td>Google Meu Negócio, Bing Places, avaliações, site indexado no Bing</td></tr>\n <tr><td><b>Google AI Mode<br>e AI Overviews</b></td><td>Índice do próprio Google e dados do Maps</td><td>SEO clássico, Google Meu Negócio, consistência de nome, endereço e telefone</td></tr>\n <tr><td><b>Perplexity</b></td><td>Índice próprio, com forte peso de conteúdo editorial e listas “melhores X”</td><td>Presença em publicações e diretórios do seu setor</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-box">\n <p class="mn-lbl">PARA NEGÓCIO LOCAL</p>\n <h4>Não existe compra de posição dentro da resposta orgânica</h4>\n <p>Em consultas locais, o caminho de influência é indireto e conhecido: melhorar o Perfil da Empresa no Google, as avaliações e a consistência dos dados. Uma edição no perfil pode aparecer na resposta da IA em poucos dias, porque essas respostas são geradas com busca ao vivo na maior parte dos casos.</p>\n </div>',ta:['T9','T14'],mo:'m2'},{id:'s24',t:'2.4 Por que a resposta muda toda vez',h:'<p>Esta é a característica mais mal compreendida do canal — e a que mais atrapalha quem contrata serviço sem saber avaliar.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Quanto se repete de uma medição para a outra</p><p class="mn-fig-s">Escala de 0 a 1. Quanto mais perto de 1, mais estável. Quanto mais perto de 0, mais muda.</p><div class="mn-bar"><span>Fontes citadas, de um dia para o outro</span><i style="width:38%"></i><b>0,34–0,42</b></div><div class="mn-bar"><span>Fontes citadas, no mesmo dia</span><i style="width:37%"></i><b>0,32–0,43</b></div><div class="mn-bar"><span>Marcas mencionadas, de um dia para o outro</span><i style="width:52%"></i><b>0,45–0,59</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> cerca de <b>65% das fontes citadas trocam de um dia para o outro</b>. E o mais revelador: quando a mesma pergunta é repetida no mesmo dia, a variação é praticamente a mesma. Ou seja, não é o Google mudando o algoritmo — é a própria natureza da IA. Nomes de marca são um pouco mais estáveis que links, mas ainda variam muito.\n <span class="mn-src">Fonte: Schulte, Bleeker e Kaufmann (Univ. St. Gallen, abr/2026). 4 motores, 45 dias, dados e código públicos.</span></p></div>\n\n <div class="mn-warn">\n <p class="mn-lbl">O QUE FAZER COM ISSO</p>\n <h4>Uma medição isolada não vale nada</h4>\n <p>Uma única consulta tem faixa de erro tão grande que a informação é praticamente inútil. Segundo o mesmo estudo, é preciso repetir a <b>mesma pergunta pelo menos 7 vezes por dia</b> para ter uma estimativa razoável de marca, e acompanhar por <b>10 a 24 dias</b> para o número parar de balançar. Relatório semanal com uma consulta por pergunta é ruído com cara de gráfico.</p>\n <p>É por isso que o topo desta página abre com a mesma pergunta feita sete vezes. Aquilo não é efeito visual: é o comportamento real do canal.</p>\n </div>',ta:['T3'],mo:'m1'},{id:'s25',t:'2.5 A IA te conhecer não é a IA te indicar',h:'<p>Este é o teste que quase todo dono de empresa faz errado. Você pergunta “o que você sabe sobre a minha empresa?”, recebe um parágrafo elogioso e conclui que está bem posicionado. Não está.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Reconhecer quando perguntam pelo nome × indicar quando não perguntam</p><p class="mn-fig-s">Estudo com 112 empresas. Percentual de vezes em que a empresa apareceu.</p><div class="mn-bar"><span>ChatGPT — perguntando pelo nome</span><i style="width:99.4%"></i><b>99,4%</b></div><div class="mn-bar"><span>ChatGPT — pedindo indicação genérica</span><i style="width:3.32%"></i><b>3,3%</b></div><div class="mn-bar"><span>Perplexity — perguntando pelo nome</span><i style="width:94.3%"></i><b>94,3%</b></div><div class="mn-bar"><span>Perplexity — pedindo indicação genérica</span><i style="width:8.29%"></i><b>8,3%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> a IA conhece quase todo mundo quando você entrega o nome. Isso não custa nada e não vale nada. O que vale é aparecer quando o cliente <b>não sabe o seu nome</b> e só descreve o que precisa. São dois testes separados e você deve medir os dois.\n <span class="mn-src">Fonte: Sharma (2026), 112 empresas, dois modelos. Estudo em preprint.</span></p></div>',mo:'m0'}]},{id:'p3',tag:'PARTE 3',t:'O que funciona de verdade',r:'Tudo aqui vem de estudo publicado, com o nível de confiança declarado em cada afirmação.',s:[{id:'s31',t:'3.1 Como julgar qualquer afirmação sobre o assunto',h:'<p class="mn-deep">Antes das respostas, a ferramenta para você não depender de ninguém. Toda afirmação sobre visibilidade em IA nasce de um tipo de teste. Uns valem muito mais que outros.</p>\n\n <div class="mn-bl">\n <div class="mn-bl"><span>A</span><div class="mn-bl"><h5>Teste de campo com grupo de controle</h5><p>Mede efeito real sobre visita e venda, comparando com quem não recebeu a mudança. É o padrão-ouro. Praticamente não existe neste tema.</p></div></div>\n <div class="mn-bl"><span>B</span><div class="mn-bl"><h5>Motores reais, muitas repetições, vários dias</h5><p>Mostra como a visibilidade se distribui de verdade. Bom para diagnóstico, não prova causa.</p></div></div>\n <div class="mn-bl"><span>C</span><div class="mn-bl"><h5>Motor real, mas com as páginas entregues na mão</h5><p>Mede o efeito depois que a página já foi encontrada. Não diz nada sobre ser encontrada.</p></div></div>\n <div class="mn-bl"><span>D</span><div class="mn-bl"><h5>Simulação completa em laboratório</h5><p>Consegue separar cada etapa. Vale para entender o mecanismo, não para prever o mundo real.</p></div></div>\n <div class="mn-bl"><span>E</span><div class="mn-bl"><h5>Contexto fixo, ou uma IA avaliando outra IA</h5><p>Evidência fraca. É de onde vem a maioria dos números de marketing.</p></div></div>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">USE ISSO NA PRÓXIMA REUNIÃO</p>\n <h4>O famoso “+40% de visibilidade” é o tipo de evidência mais fraco que existe</h4>\n <p>O número vem do estudo que criou o termo, em 2024. Ele mede o aumento da fatia de texto atribuída a uma fonte que <b>já tinha sido colocada</b> num conjunto de cinco documentos. Não significa 40% mais visitas, nem 40% mais chance de ser encontrado. Quem usa esse número como promessa comercial está esticando muito além do que o estudo mostra.</p>\n </div>',mo:'m0'},{id:'s32',t:'3.2 Os 4 porteiros',h:'<p>O teste mais rigoroso já publicado comparou páginas duas a duas, mudando <strong>um único fator por vez</strong>, com nomes de marca escondidos e ordem sorteada. Foram 252 mil rodadas em 6 modelos diferentes. Quatro fatores foram decisivos nos seis modelos.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Força de cada fator na escolha de quem é citado</p><p class="mn-fig-s">Barra maior = fator mais decisivo. Escala comprimida: cada marca vale 10 vezes a anterior.</p><div class="mn-bar"><span>Assunto bate com a pergunta porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Preço está na página porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Data recente e visível porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Posição na lista porteiro</span><i style="width:100%"></i><b>&gt;10.000</b></div><div class="mn-bar"><span>Especificações técnicas</span><i style="width:60%"></i><b>243</b></div><div class="mn-bar"><span>Profundidade da análise</span><i style="width:53%"></i><b>132</b></div><div class="mn-bar"><span>Evidência para o que afirma</span><i style="width:42%"></i><b>46</b></div><div class="mn-bar"><span>Comparação com alternativas</span><i style="width:17%"></i><b>4,7</b></div><div class="mn-bar"><span>Texto sem contradições</span><i style="width:11%"></i><b>2,8</b></div><div class="mn-bar neu"><span>Formatação e organização visual</span><i style="width:1%"></i><b>≈1,0</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> repare na inversão. <b>Colocar o preço na página é porteiro. Deixar a página bonita e organizada não tem efeito nenhum.</b> Trocar “consulte valores” por uma faixa de preço real é uma das mudanças mais baratas e mais fortes que existem.\n <span class="mn-src">Fonte: Vishwakarma, Kumar e Jamidar (Sprinklr), SIGIR 2026. 252.000 rodadas, 6 modelos, 18 fatores.</span></p></div>\n\n <div class="mn-key">\n <p class="mn-lbl">AS QUATRO PERGUNTAS DO PORTEIRO</p>\n <h4>Rode isso em qualquer página antes de qualquer outra coisa</h4>\n <p><b>1.</b> Esta página responde exatamente a pergunta que o cliente faz, ou responde à categoria dela?<br>\n <b>2.</b> Tem preço, faixa de preço ou valor concreto escrito?<br>\n <b>3.</b> Tem data visível, real e atualizada?<br>\n <b>4.</b> A página está indexada e aparecendo na busca comum?</p>\n <p>Quatro “sim” antes de contratar qualquer redação nova.</p>\n </div>',ta:['T10','T11','T12'],mo:'m2'},{id:'s33',t:'3.3 Tabela de alavancas por nível de evidência',h:'<p class="mn-deep">Consolidação de 45 estudos revisados entre 2023 e 2026. Use como filtro de orçamento.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Nível de sustentação de cada alavanca na literatura revisada.</caption>\n <thead><tr><th scope="col">Alavanca</th><th scope="col">Evidência</th><th scope="col">Condição</th><th scope="col">O que fazer</th></tr></thead>\n <tbody>\n <tr><td>Responder exatamente a pergunta</td><td><span class="mn-ok">Forte</span></td><td>Intenção clara, sem inventar dado</td><td>Uma página por pergunta real, não por palavra-chave</td></tr>\n <tr><td>Posição entre os candidatos</td><td><span class="mn-ok">Forte</span></td><td>Página já recuperada</td><td>Resolver com SEO técnico, não com redação</td></tr>\n <tr><td>Dado extraível (número, definição, comparação)</td><td><span class="mn-ok">Moderada a forte</span></td><td>Verdadeiro, datado e atribuído</td><td>Números com fonte. Nunca inventar estatística</td></tr>\n <tr><td>Preço, data e recência</td><td><span class="mn-mid">Moderada</span></td><td>Consulta comercial ou sensível a tempo</td><td>Valor concreto na página e data de atualização</td></tr>\n <tr><td>Estrutura do documento</td><td><span class="mn-mid">Moderada e instável</span></td><td>Efeito diferente em cada etapa</td><td>Testar, não presumir. Pode ajudar numa etapa e atrapalhar noutra</td></tr>\n <tr><td>Fluidez e simplificação do texto</td><td><span class="mn-mid">Fraca a moderada</span></td><td>Varia por setor e por motor</td><td>Escrever para a pessoa primeiro</td></tr>\n <tr><td>Tom de autoridade</td><td><span class="mn-no">Fraca e instável</span></td><td>Pode conflitar com credibilidade</td><td>Confiança não substitui evidência</td></tr>\n <tr><td>Repetir palavra-chave</td><td><span class="mn-no">Nula ou negativa</span></td><td>Vários testes</td><td>Evitar</td></tr>\n <tr><td>Só mudar formatação</td><td><span class="mn-no">Nula</span></td><td>Teste controlado com 252 mil rodadas</td><td>Não gastar orçamento nisso</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl"><b>Contraintuitivo e comprovado.</b> Num estudo de 2026, um método que <b>encurtou as páginas em 53%</b>, cortando ruído e deixando só os pontos de informação, alcançou desempenho competitivo de citação. Página menor e mais limpa venceu página maior.</div>',ta:['T10','T11','T12'],mo:'m3'},{id:'s34',t:'3.4 Pergunta ativa a IA; palavra-chave não',h:'<div class="mn-fig"><p class="mn-fig-t">Quando o Google decide mostrar um resumo de IA</p><p class="mn-fig-s">Análise de 55.393 buscas ao longo de 40 dias.</p><div class="mn-bar neu"><span>Busca comum, na média</span><i style="width:13.7%"></i><b>13,7%</b></div><div class="mn-bar"><span>Busca escrita como pergunta</span><i style="width:64.7%"></i><b>64,7%</b></div><p class="mn-fig-f"><b>O que isso quer dizer:</b> uma busca escrita como pergunta tem quase 5 vezes mais chance de acionar a IA. Isso muda a arquitetura do conteúdo: organize o site por <b>perguntas que o cliente faz</b>, e não por lista de termos.\n <span class="mn-src">Fonte: Xu et al. (2026), 55.393 buscas em tendência, 40 dias.</span></p></div>',ta:['T1'],mo:'m1'},{id:'s35',t:'3.5 O contraponto honesto',h:'<p>Um manual que só mostra o lado bom não serve para decidir. Três achados que limitam tudo o que foi dito acima.</p>\n\n <div class="mn-warn">\n <p class="mn-lbl">1. RECEITA GENÉRICA NÃO TRANSFERE</p>\n <h4>Em 54 combinações testadas, só 3 deram resultado positivo</h4>\n <p>Um estudo com cerca de 1.900 buscas e 16.360 documentos aplicou as receitas populares em vários setores. Apenas 3 de 54 combinações método–setor foram positivas de forma significativa, e nenhuma no caso de perguntas e respostas. Pior: <b>quanto mais gente adota a mesma tática, menor fica o ganho de cada um</b>, até virar praticamente soma zero.</p>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">2. OTIMIZAR PODE PIORAR</p>\n <h4>Mexer só no texto reduziu a chance de ser encontrado</h4>\n <p>No único teste que mediu o caminho completo, a reescrita do corpo da página derrubou a presença entre as 20 primeiras em cerca de 9% e a citação final em 6%. O ganho numa etapa foi engolido pela perda em outra. É por isso que a ordem das etapas da Parte 2 não é detalhe.</p>\n </div>\n\n <div class="mn-warn">\n <p class="mn-lbl">3. NINGUÉM PROVOU LIGAÇÃO COM RECEITA</p>\n <h4>A evidência sobre clique e venda é a mais fraca de todas</h4>\n <p>A revisão de 45 estudos conclui que conteúdo já recuperado pode influenciar a resposta, mas <b>nenhuma técnica revisada mostrou efeito causal estável e duradouro sobre descoberta orgânica, clique ou conversão</b>. O melhor caso real disponível registrou aumento bruto de 5,7 vezes nas visitas vindas do ChatGPT — só que as páginas que <b>não</b> receberam tratamento já tinham subido 3,5 vezes sozinhas. O ganho realmente atribuível ficou em <b>1,82 vez</b>, e mesmo assim o teste de placebo não foi conclusivo.</p>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O QUE PROMETER, ENTÃO</p>\n <h4>Um número defensável, em vez de um número bonito</h4>\n <p>A faixa que a evidência sustenta é da ordem de <b>1,3 a 2,5 vezes</b> em visitas vindas de IA, depois de descontar o crescimento natural das plataformas. Quem promete 5 vezes está usando o número bruto e omitindo o desconto. E nenhuma promessa de posição faz sentido num canal onde a resposta muda entre duas consultas seguidas.</p>\n </div>',mo:'m0'}]},{id:'p4',tag:'PARTE 4',t:'Diagnóstico',r:'O erro operacional do mercado é aplicar a mesma receita de reescrita em todo mundo. Aqui você descobre, em uma tarde, qual das três causas é a sua.',s:[{id:'s41',t:'4.1 A árvore de decisão',h:'<p>Rode o teste da Parte 5 primeiro — 20 perguntas, 7 rodadas cada. Depois responda a pergunta abaixo e toque no ramo que corresponde ao seu caso.</p>\n\n <p>\n \n Toque no ramo que descreve o que você viu.\n </p>\n\n <p><b>Nas rodadas em que a IA buscou na internet:</b> a sua marca apareceu na resposta? E o seu site apareceu na lista de fontes citadas?</p>\n\n <div class="mn-bl">\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que isso significa</dt><dd class="mn-lead">Você já passou pelas duas etapas difíceis: a IA encontra o seu site e o considera candidato. O que falta é ser escolhido com mais frequência entre os candidatos. <b>É o problema mais barato de resolver dos três.</b></dd></div>\n <div class="mn-bl"><dt>Onde agir</dt><dd>Nos quatro porteiros da Parte 3, na página específica que já é citada. Preço explícito, data real e visível, especificações, comparação com alternativas e evidência para o que a página afirma.</dd></div>\n <div class="mn-bl"><dt>O que <u>não</u> fazer</dt><dd>Não mexa na estrutura técnica do site. Você já provou que ela funciona. Mudança grande aqui pode derrubar o que já está de pé.</dd></div>\n <div class="mn-bl"><dt>Primeira ação</dt><dd>Pegue a página que aparece nas citações e responda as quatro perguntas do porteiro. Corrija a primeira que der “não”.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que isso significa</dt><dd class="mn-lead">A IA leu o seu site e mesmo assim não indicou o seu negócio. Isso é diagnóstico bom: o gargalo está no <b>conteúdo daquela página específica</b>, não no site inteiro. Em um estudo de 2026, <b>43% das páginas relevantes ao assunto não recebiam nenhuma citação</b> — é o caso mais comum de todos.</dd></div>\n <div class="mn-bl"><dt>Onde agir</dt><dd>Classifique o tipo de falha na seção 4.3 antes de escrever qualquer coisa. Em 62% dos casos o problema é desalinhamento com a intenção da pergunta, não falta de texto.</dd></div>\n <div class="mn-bl"><dt>O que <u>não</u> fazer</dt><dd>Não escreva “mais conteúdo”. Página maior não é página melhor: um método que <b>encurtou as páginas em 53%</b>, cortando ruído, alcançou desempenho competitivo de citação.</dd></div>\n <div class="mn-bl"><dt>Primeira ação</dt><dd>Leia a pergunta que o cliente faz e leia o título da sua página. Se um responde à categoria e o outro pede uma indicação, você achou a falha.</dd></div>\n </dl>\n </div>\n\n \n <div class="mn-bl">\n <dl>\n <div class="mn-bl"><dt>O que isso significa</dt><dd class="mn-lead">A IA nem chegou a ler o seu site. <b>Nada que você escrever nele terá efeito</b> enquanto isso não mudar. É o problema mais caro e mais lento — e o único em que reescrever texto é dinheiro jogado fora.</dd></div>\n <div class="mn-bl"><dt>Onde agir</dt><dd>É trabalho técnico de busca: indexação, robots.txt, renderização, canônicas duplicadas, velocidade, e consistência de nome, endereço e telefone entre site, Perfil da Empresa no Google, Bing Places e diretórios.</dd></div>\n <div class="mn-bl"><dt>O que <u>não</u> fazer</dt><dd>Não contrate redação. Não compre ferramenta de monitoramento cara ainda — ela vai passar meses mostrando zero e você já sabe o porquê.</dd></div>\n <div class="mn-bl"><dt>Primeira ação</dt><dd>Busque no Google por <span class="mn-num">site:seudominio.com.br</span> e confira se as páginas-alvo aparecem. Se não aparecem na busca comum, não existem para a IA. Comece por aí.</dd></div>\n </dl>\n </div>\n\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">POR QUE ISSO MUDA O ORÇAMENTO</p>\n <h4>Os três ramos têm custo e prazo muito diferentes</h4>\n <p><b>Ramo A</b> — dias, e cabe no time atual. <b>Ramo B</b> — semanas, exige redação com método. <b>Ramo C</b> — meses, exige desenvolvedor. Um fornecedor que cobra o mesmo pelos três, ou que aplica a mesma receita nos três, não está diagnosticando.</p>\n </div>',ir:['diag','Abrir a árvore guiada'],ta:['T5','T10'],mo:'m3'},{id:'s42',t:'4.2 Quando a página é relevante e mesmo assim não é citada',h:'<p>Este é o dado mais útil da Parte 4. Um estudo de 2026 classificou por que páginas <em>do assunto certo</em> deixam de ser citadas.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">As causas, por peso</p><p class="mn-fig-s">Classificação de falhas de citação em páginas topicamente relevantes.</p><p class="mn-fig-a">Gráfico de rosca: 62,2% desalinhamento com a pergunta, 27,1% qualidade de apresentação, 10,7% outras causas.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> quase dois terços do problema se resolvem <b>remapeando</b> a página para a pergunta real — não escrevendo mais. No mesmo estudo, o reparo dirigido a cada tipo de falha levou a taxa de citação de <span class="mn-num">57,0%</span> para <span class="mn-num">83,7%</span>. Aplicado a perguntas que o método nunca tinha visto, o ganho caiu para <span class="mn-num">+14,3</span> pontos — ainda relevante, e um lembrete útil de que resultado de laboratório encolhe no mundo real.\n <span class="mn-src">Fonte: Tian et al. (2026), arXiv 2603.09296. Preprint.</span></p></div>',ta:['T10','T11'],mo:'m3'},{id:'s43',t:'4.3 Os quatro tipos de desalinhamento',h:'<p>Se você caiu no Ramo B, é aqui que descobre o que exatamente corrigir. Procure o <em>sintoma</em>: ele é observável, você não precisa adivinhar.</p>\n\n <div class="mn-bl">\n <div class="mn-bl">\n <p>1</p>\n <h4>Intenção divergente</h4>\n <p><b>Sintoma:</b> a pergunta pede uma indicação, um preço ou um agendamento — e a sua página explica o que é o serviço.</p>\n <p><b>Correção:</b> a página precisa responder na mesma moeda da pergunta. Se perguntam “quanto custa”, tem que ter valor. Se perguntam “qual você indica”, tem que ter o argumento de escolha, não a enciclopédia do procedimento.</p>\n </div>\n <div class="mn-bl">\n <p>2</p>\n <h4>Lacuna de informação</h4>\n <p><b>Sintoma:</b> a IA cita concorrentes que trazem um dado que você não tem na página — bairro, tipo de equipamento, público atendido, forma de pagamento.</p>\n <p><b>Correção:</b> escreva o que está implícito. O que “todo mundo do ramo sabe” a IA não sabe se não estiver escrito com todas as letras.</p>\n </div>\n <div class="mn-bl">\n <p>3</p>\n <h4>Informação desatualizada</h4>\n <p><b>Sintoma:</b> a IA descreve um preço, horário ou serviço que você não pratica mais. Ou a página não tem data nenhuma.</p>\n <p><b>Correção:</b> atualizar e <b>datar de forma visível</b>. Recência é um dos quatro porteiros — data antiga não é detalhe estético, derruba a citação.</p>\n </div>\n <div class="mn-bl">\n <p>4</p>\n <h4>Localização incompatível</h4>\n <p><b>Sintoma:</b> você aparece para a cidade errada, ou some quando a pergunta inclui o nome do seu bairro.</p>\n <p><b>Correção:</b> nome, endereço e telefone idênticos em todos os canais, e a região de atendimento escrita como o cliente fala — incluindo bairro e cidades vizinhas que você atende.</p>\n </div>\n </div>\n\n <div class="mn-bl"><b>Por que “lacuna de informação” engana tanta gente.</b> É o tipo de falha que mais parece problema de autoridade e não é. A empresa conclui “a IA prefere as grandes” quando, na prática, a página do concorrente diz o preço e a dela não.</div>\n\n <p>O passo a passo dos quatro testes (4.4) fica no modo completo — é o roteiro de quem vai executar.\n </p>',ta:['T10','T11','T12','T13'],mo:'m3'},{id:'s44',t:'4.4 Como fazer cada análise, passo a passo',h:'<p class="mn-deep">Quatro testes. Todos rodam em navegador anônimo, sem ferramenta paga. Registre tudo numa planilha simples: uma linha por rodada.</p>\n\n <div class="mn-bl">\n <p class="mn-lbl">ANTES DE COMEÇAR — HIGIENE OBRIGATÓRIA</p>\n <h4>Sem isso, você está medindo o seu próprio histórico</h4>\n <p>Use <b>janela anônima</b> e conta deslogada. A IA personaliza pelo histórico: se você já pesquisou a sua própria empresa cinquenta vezes, ela vai te mostrar. Confira também a <b>localização</b> que o navegador está informando — resposta local muda inteira com o CEP. E anote <b>data, hora e motor</b> em toda rodada.</p>\n </div>\n\n <h4 class="mn-deep">Teste A — A IA busca na internet?</h4>\n <ol>\n <li>Faça a pergunta em janela anônima, sem dar o nome da sua empresa.</li>\n <li>Observe se a resposta traz <b>fontes citadas</b> ou o indicador de busca. Sem fontes = respondeu de memória.</li>\n <li>Repita 7 vezes. Anote quantas ativaram busca.</li>\n <li><b>Como ler:</b> em uma configuração estudada, <span class="mn-num">57,8%</span> das rodadas do ChatGPT não ativaram busca. Se a sua taxa de ativação é baixa, o problema não é o seu site — é a forma da pergunta. Perguntas completas ativam muito mais que termos soltos.</li>\n </ol>\n\n <h4 class="mn-deep">Teste B — Meu site entra na lista de fontes?</h4>\n <ol>\n <li>Nas rodadas que ativaram busca, abra a lista de fontes citadas.</li>\n <li>Anote <b>todos</b> os domínios citados, não só o seu. Essa lista é o mapa de onde a IA vai buscar no seu setor.</li>\n <li>Marque sim/não para o seu domínio em cada rodada.</li>\n <li><b>Como ler:</b> zero aparições em 7 rodadas de 20 perguntas = Ramo C, problema de recuperação. Aparece às vezes = você está no jogo.</li>\n </ol>\n\n <h4 class="mn-deep">Teste C — Sendo lida, sou escolhida?</h4>\n <ol>\n <li>Separe só as rodadas em que o seu domínio apareceu nas fontes.</li>\n <li>Dentro dessas, conte em quantas o <b>nome da sua empresa</b> foi citado no corpo da resposta.</li>\n <li><b>Como ler:</b> esse é o número que separa Ramo A de Ramo B. Alto = trabalhe qualidade. Baixo = a página está desalinhada, vá para a seção 4.3.</li>\n <li>Faça o mesmo com os dois concorrentes mais citados. A comparação diz mais que o seu número isolado.</li>\n </ol>\n\n <h4 class="mn-deep">Teste D — O que dizem sobre mim está certo?</h4>\n <ol>\n <li>Nas rodadas em que você apareceu, copie a frase inteira sobre a sua empresa.</li>\n <li>Classifique: <b>correta</b>, <b>incompleta</b>, <b>errada</b>, e o tom em positivo, neutro ou negativo.</li>\n <li>Para cada erro, ache a origem: quase sempre é um canal seu com informação divergente — um diretório antigo, um horário desatualizado no perfil, um preço velho no site.</li>\n <li><b>Como ler:</b> em auditoria de referência, só <span class="mn-num">51,5%</span> das frases geradas eram totalmente sustentadas pela fonte citada. Ser citado errado conta como aparição em qualquer painel do mercado — e é resultado ruim.</li>\n </ol>',ta:['T5','T10'],mo:'m3'},{id:'s45',t:'4.5 Como interpretar o que você viu',h:'<div class="mn-tw">\n <table>\n <caption>Da observação à ação, sem etapa intermediária de achismo.</caption>\n <thead><tr><th scope="col">O que você viu</th><th scope="col">O que significa</th><th scope="col">O que fazer</th></tr></thead>\n <tbody>\n <tr><td>A IA quase nunca busca nas suas perguntas</td><td>As perguntas do teste não são as que o cliente faz, ou são curtas demais</td><td>Reescreva a carteira de perguntas em frases completas, como o cliente fala</td></tr>\n <tr><td>Seu domínio nunca aparece nas fontes</td><td><span class="mn-no">Ramo C</span> Recuperação</td><td>Auditoria técnica. Redação agora é desperdício</td></tr>\n <tr><td>Domínio aparece, marca não é citada</td><td><span class="mn-mid">Ramo B</span> Página desalinhada</td><td>Classificar na 4.3 e fazer reparo dirigido</td></tr>\n <tr><td>Marca aparece em 1 ou 2 de 7 rodadas</td><td><span class="mn-ok">Ramo A</span> Qualidade</td><td>Os quatro porteiros na página que já é citada</td></tr>\n <tr><td>Aparece no ChatGPT e some no Google AI Mode</td><td>Fontes diferentes: um puxa de Bing e bases de lugares, o outro do índice do Google</td><td>Tratar Bing Places e Perfil da Empresa como canais separados</td></tr>\n <tr><td>Concorrente menor aparece mais que você</td><td>Quase sempre a página dele responde à pergunta e a sua responde à categoria</td><td>Compare os dois títulos lado a lado antes de concluir que é autoridade</td></tr>\n <tr><td>A descrição sobre você está errada</td><td>Informação divergente entre os seus canais</td><td>Achar o canal desatualizado e corrigir na origem</td></tr>\n <tr><td>O número muda muito entre semanas</td><td>Provavelmente ruído, não efeito</td><td>Não decidir nada. Ir para a Parte 5 e medir com janela e repetição corretas</td></tr>\n </tbody>\n </table>\n </div>',ta:['T5','T10'],mo:'m3'}]},{id:'p5',tag:'PARTE 5',t:'Medição',r:'Se você ler só uma parte antes de assinar um contrato, que seja esta. Ela dá o critério para saber se um relatório é informação ou é ruído.',s:[{id:'s51',t:'5.1 Por que uma rodada não vale nada',h:'<p>A faixa de erro de uma medição isolada é tão grande que ela não distingue 20% de 60%.</p>\n\n <div class="mn-fig"><p class="mn-fig-t">Faixa de erro conforme o número de rodadas da mesma pergunta, no mesmo dia</p><p class="mn-fig-s">Quanto menor a barra, mais confiável. Valores medidos em 4 motores ao longo de 45 dias.</p><p class="mn-fig-a">Gráfico: a faixa de erro cai de ±37 pontos com 1 rodada para ±8 com 7 rodadas e ±6 com 8.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> com <b>uma</b> rodada a faixa de erro é de <span class="mn-num">±37 pontos</span> — na prática, a medição não informa nada. Com <b>7 rodadas da mesma pergunta no mesmo dia</b> ela cai para <span class="mn-num">±8 pontos</span>, e aí sim uma diferença começa a significar alguma coisa. Sete é o piso, não o ideal.\n <span class="mn-src">Fonte: Schulte, Bleeker e Kaufmann (2026), arXiv 2604.07585. Valores da configuração estudada — use como limiar de decisão, não como previsão exata do seu erro.</span></p></div>',ta:['T2','T3'],mo:'m1'},{id:'s52',t:'5.2 Por que uma semana não vale nada',h:'<div class="mn-fig"><p class="mn-fig-t">Faixa de erro conforme o tamanho da janela de observação</p><p class="mn-fig-s">Mesmo com as rodadas certas, uma janela curta ainda produz número instável.</p><p class="mn-fig-a">Gráfico: a faixa de erro cai de ±32 pontos com 1 dia para ±11 com 10 dias e ±3 com 24 dias.</p><p class="mn-fig-f"><b>O que isso quer dizer:</b> relatório semanal não tem janela suficiente para dizer se algo mudou. <b>10 dias</b> é o mínimo para o erro cair perto de ±11 pontos; <b>24 dias</b> para chegar perto de ±3. É por isso que o plano da Parte 6 não faz nenhuma leitura decisória antes do dia 76 — antes disso o número existe, mas não sustenta decisão.\n <span class="mn-src">Fonte: Schulte et al. (2026). Mesma configuração da figura anterior.</span></p></div>',ta:['T3','T16'],mo:'m1'},{id:'s53',t:'5.3 Calculadora: o seu plano de medição é suficiente?',h:'<p>Preencha com o que você — ou o seu fornecedor — pretende fazer. A calculadora aplica os limiares publicados e mostra o volume real de consultas por trás da promessa.</p>\n\n \n\n <div class="mn-warn">\n <p class="mn-lbl">USE ISSO NA NEGOCIAÇÃO</p>\n <h4>O plano de entrada de qualquer ferramenta do mercado roda abaixo do limiar</h4>\n <p>Um plano de <span class="mn-num">US$ 29</span> por mês costuma incluir 15 perguntas. Com 7 rodadas por dia em 3 motores, 15 perguntas já são <b>315 consultas por dia</b>. Nenhum plano de entrada permite isso — ele roda 1 consulta por pergunta, o que a figura 5.1 mostra ser inútil. Pergunte ao fornecedor quantas rodadas ele faz. É a pergunta que quase ninguém faz e que separa serviço de enfeite.</p>\n </div>',ir:['medir','Abrir a calculadora de suficiência'],ta:['T3'],mo:'m1'},{id:'s54',t:'5.4 Montar a carteira de perguntas',h:'<p class="mn-deep">Uma carteira boa cobre <b>quatro intenções</b>, com pelo menos três formas de dizer a mesma coisa. Sem as paráfrases você mede uma frase, não uma necessidade.</p>\n\n <div class="mn-bl">\n <table>\n <caption>Modelo preenchido para uma clínica de estética em Sorocaba. Troque o negócio e a cidade, mantenha a estrutura.</caption>\n <thead><tr><th scope="col">Intenção</th><th scope="col">Para que serve</th><th scope="col">Três formas de perguntar</th></tr></thead>\n <tbody>\n <tr>\n <td><b>1. Descoberta</b><br><span>a mais importante</span></td>\n <td>O cliente não sabe o seu nome. É aqui que a visibilidade real acontece</td>\n <td>“Qual clínica de estética você indica em Sorocaba?”<br>“Onde fazer depilação a laser em Sorocaba?”<br>“Clínicas de estética boas perto do centro de Sorocaba”</td>\n </tr>\n <tr>\n <td><b>2. Comparação</b></td>\n <td>Mede se você entra na disputa quando o cliente já está escolhendo</td>\n <td>“Melhores clínicas de depilação a laser em Sorocaba”<br>“Qual a diferença entre as clínicas de estética de Sorocaba?”<br>“Vale mais a pena fazer laser na clínica X ou na Y?”</td>\n </tr>\n <tr>\n <td><b>3. Problema</b></td>\n <td>O cliente descreve a dor, não o serviço. Costuma ser a intenção mais mal coberta</td>\n <td>“Tenho pelos encravados, o que resolve de vez?”<br>“Como tirar manchas de sol do rosto em Sorocaba?”<br>“Quanto custa fechar as axilas com laser?”</td>\n </tr>\n <tr>\n <td><b>4. Validação</b><br><span class="mn-mid">não confunda com as outras</span></td>\n <td>O cliente já sabe o nome. Serve só para checar <b>fidelidade</b>, nunca para medir visibilidade</td>\n <td>“O que você sabe sobre a Clínica Tal de Sorocaba?”<br>“A Clínica Tal é confiável?”<br>“Quais serviços a Clínica Tal oferece?”</td>\n </tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-bl">\n <p class="mn-lbl">REGRAS DA CARTEIRA</p>\n <h4>Quatro decisões que evitam retrabalho depois</h4>\n <p><b>1.</b> Entre 20 e 30 perguntas. Menos que 20 não cobre o assunto; mais que 30 encarece sem ganho proporcional.<br>\n <b>2.</b> No máximo 25% da carteira em intenção de validação. Elas quase sempre dão “sim” e inflam o resultado.<br>\n <b>3.</b> Congele a carteira antes de começar. Trocar pergunta no meio quebra a comparação com o baseline.<br>\n <b>4.</b> Guarde a resposta inteira, não só o sim/não. Quando você descobrir que estava contando errado — e vai descobrir —, sem o texto original a série histórica se perde.</p>\n </div>',ir:['carteira','Abrir a carteira de perguntas'],ta:['T1'],mo:'m1'},{id:'s55',t:'5.5 Calculadora: a mudança foi real ou foi acaso?',h:'<p class="mn-deep">Você mediu antes, fez o trabalho, mediu depois. O número subiu. A pergunta que importa é se subiu além da faixa de erro.</p>',ir:['medir','Abrir o teste de significância'],mo:'m4'},{id:'s56',t:'5.6 O painel que sustenta uma reunião',h:'<p>Quatro números — e nenhum deles é “posição”, porque posição não existe neste canal. Os três últimos da tabela são apoio: úteis para entender o contexto, nunca para substituir os quatro.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Indicadores, com o que cada um responde e onde cada um engana.</caption>\n <thead><tr><th scope="col">Indicador</th><th scope="col">O que é</th><th scope="col">Como ler</th><th scope="col">Referência em 90 dias</th></tr></thead>\n <tbody>\n <tr><td><b>Taxa de detecção</b></td><td>Em quantas rodadas de cada 100 a marca apareceu</td><td>Sempre com a faixa de erro junto. Sem ela o número não é comparável</td><td>Subir além da faixa de erro</td></tr>\n <tr><td><b>Cobertura de perguntas</b></td><td>Perguntas com pelo menos uma aparição, sobre o total</td><td>Distingue “apareço muito em duas perguntas” de “apareço um pouco em todas”</td><td>40–60% em nicho geográfico</td></tr>\n <tr><td><b>Presença de domínio</b></td><td>Em quantas rodadas o seu site apareceu nas fontes, mesmo sem a marca no texto</td><td>É o termômetro de recuperação. Se está em zero, o resto não sai do lugar</td><td>Acima da taxa de detecção</td></tr>\n <tr><td><b>Comparativo com concorrentes</b></td><td>A sua detecção contra a dos concorrentes, nas mesmas perguntas</td><td>Protege contra confundir crescimento da plataforma com resultado seu</td><td>Ganhar posição relativa</td></tr>\n <tr><td><b>Fidelidade</b></td><td>Aparições em que a descrição sobre você está correta</td><td>Aparição com informação errada é resultado negativo, não positivo</td><td>Acima de 90%</td></tr>\n <tr><td><b>Sentimento</b></td><td>Tom da menção: positivo, neutro ou negativo</td><td>É a métrica que o mercado passa a cobrar em 2026</td><td>Sem menção negativa recorrente</td></tr>\n <tr><td><b>Visitas vindas de IA</b><br><span class="mn-mid">indicador atrasado</span></td><td>Sessões no site com origem em ferramentas de IA</td><td>Demora a reagir e sofre influência do crescimento das plataformas. <b>Nunca use como métrica principal</b></td><td>Tendência, não meta</td></tr>\n </tbody>\n </table>\n </div>',ir:['medir','Abrir o painel'],ta:['T16','T17'],mo:'m4'},{id:'s57',t:'5.7 As seis armadilhas',h:'<p>Todas já apareceram em relatório de fornecedor. Todas inflam o resultado.</p>\n\n <div class="mn-tw">\n <table>\n <caption>Erros de medição que transformam ruído em gráfico ascendente.</caption>\n <thead><tr><th scope="col">Armadilha</th><th scope="col">Por que infla</th><th scope="col">Correção</th></tr></thead>\n <tbody>\n <tr><td>Descartar as rodadas em que a IA não citou ninguém</td><td>O denominador encolhe e a taxa sobe sozinha</td><td>Rodada sem citação é dado, não falha. Entra na conta</td></tr>\n <tr><td>Ler o resultado cedo demais</td><td>Mudança estrutural leva de 2 a 4 semanas para aparecer na citação</td><td>Nenhuma leitura decisória antes de 4 semanas do fim da mudança</td></tr>\n <tr><td>Uma rodada por pergunta</td><td>Faixa de erro de ±37 pontos: o número é praticamente aleatório</td><td>Mínimo de 7 rodadas por pergunta, por dia</td></tr>\n <tr><td>Medir um motor só</td><td>Cada motor puxa de fontes diferentes; um bom resultado não transfere</td><td>Três motores no protocolo padrão; dois no mínimo, relatados separadamente</td></tr>\n <tr><td>Contar aparição sem checar o que foi dito</td><td>Citação errada entra como vitória</td><td>Auditoria de fidelidade por amostra, todo mês</td></tr>\n <tr><td>Comparar sem concorrente</td><td>O canal cresceu sozinho; parte da alta não é sua</td><td>Sempre medir os mesmos concorrentes nas mesmas perguntas</td></tr>\n </tbody>\n </table>\n </div>\n\n <div class="mn-key">\n <p class="mn-lbl">O CRITÉRIO EM UMA FRASE</p>\n <h4>Se o relatório não declara quantas repetições e qual a janela, ele não é mensurável</h4>\n <p>Não importa quão bonito seja o painel. Sem <b>número de rodadas</b>, <b>número de perguntas</b>, <b>motores</b> e <b>janela de agregação</b> declarados, não dá para saber se a linha que subiu significa alguma coisa. Essa é a pergunta única que você pode fazer a qualquer fornecedor — inclusive a nós.</p>\n </div>',ta:['T3','T16'],mo:'m4'}]},{id:'p6',tag:'PARTE 6',t:'Execução',r:'O plano completo de 90 dias: quem faz o quê, quando, e — o mais importante — em que ordem.',s:[{id:'s61',t:'6.1 O plano inteiro em uma imagem',h:'<p>Cinco fases que se sobrepõem de propósito, 18 tarefas, 4 marcos. A coleta atravessa o plano inteiro, do dia 1 ao dia 90 — e nada de novo começa depois do dia 70, porque não daria tempo de medir. As barras com contorno vermelho são o caminho crítico: atrasou uma delas, atrasou o projeto inteiro.</p>\n\n \n\n <div class="mn-tw">\n <table>\n <caption>Os quatro marcos, com o critério objetivo de cada um. Marco é portão: não se fecha com ressalva.</caption>\n <thead><tr><th scope="col">Marco</th><th scope="col">Dia</th><th scope="col">Só está cumprido quando…</th><th scope="col">Se não cumprir</th></tr></thead>\n <tbody>\n <tr><td><b>M1</b> Ponto de partida fechado</td><td class="mn-num">21</td><td>Carteira de 20 a 30 perguntas congelada com data, pelo menos 18 dias de coleta na rotação (três passagens), cada pergunta classificada em A, B ou C e o ramo dominante identificado</td><td>Não avance para texto. É o único marco que não dá para recuperar depois: se faltou coleta, a resposta é coletar</td></tr>\n <tr><td><b>M2</b> A IA consegue chegar</td><td class="mn-num">45</td><td>As 12 verificações rodadas e as críticas (4, 5, 6 e 12) aprovadas, toda página da carteira aparecendo na busca comum, nome, endereço e telefone iguais em todos os canais, Perfil da Empresa verificado e nada bloqueando robô de busca</td><td>Adie a Fase 2. Reparo de texto sobre base quebrada não produz efeito mensurável</td></tr>\n <tr><td><b>M3</b> Reparos aplicados</td><td class="mn-num">70</td><td>Cada página do ramo B reparada pelo tipo de falha e datada, faixa de preço e data visíveis nas páginas principais — e nada mais muda no site até a leitura</td><td>Registre o que ficou de fora. O relatório precisa dizer o que foi feito, não só o que mudou</td></tr>\n <tr><td><b>M4</b> Leitura do resultado</td><td class="mn-num">90</td><td>Pelo menos 24 dias de coleta depois do último reparo relevante, os quatro números com faixa (ciclo anterior contra o atual), a frase honesta e a decisão do próximo ciclo</td><td>Se as faixas se tocam, o resultado é “ainda não dá para afirmar”. Isso é um resultado, não um fracasso</td></tr>\n </tbody>\n </table>\n </div>',ir:['programa','Abrir o calendário do programa']},{id:'s62',t:'6.2 Fase 0 — Medir antes de mexer D1 a D21',h:'<p>É a fase que quase todo mundo pula, e é a única que não dá para recuperar depois. Sem o ponto de partida, no dia 90 você tem um número solto e nenhuma forma de saber se ele é bom.</p>\n\n <ol>\n <li><b>Escreva as perguntas antes de olhar o site.</b> 20 a 30 perguntas, quatro intenções, escritas como o cliente fala. Modelo pronto na seção 5.4. <i>(D1–7)</i></li>\n <li><b>Prepare a rotina de coleta.</b> Três motores, janela anônima, cinco perguntas por dia, sete rodadas em cada. <i>(D1–10)</i></li>\n <li><b>Congele a carteira</b> com a data. Trocar pergunta depois quebra a comparação.</li>\n <li><b>Rode o baseline completo.</b> Três passagens pela carteira — 18 dias de coleta é o piso do M1 — sem mexer em nada no site. <i>(D3–21)</i></li>\n <li><b>Em paralelo, faça a auditoria técnica</b> das páginas-alvo: as doze verificações, começando pelas críticas (4, 5, 6 e 12). <i>(D5–18)</i></li>\n <li><b>Classifique cada pergunta em A, B ou C</b> com a árvore da seção 4.1. Esse diagnóstico define o trabalho das próximas dez semanas. <i>(D10–21)</i></li>\n </ol>\n\n <p>São cinco tarefas e um marco: o <b>M1, no dia 21</b>.</p>',ta:['T1','T2','T3','T4','T5'],mo:'m1'},{id:'s63',t:'6.3 Fase 1 — Fazer a IA conseguir ler você D15 a D45',h:'<p>Prioridade máxima porque é o gargalo — a etapa 2 do Capítulo 2. Enquanto esta fase não fecha, tudo o que for escrito rende zero.</p>\n\n <ol>\n <li><b>Corrija indexação e canônicas.</b> robots.txt liberado para os robôs de busca, conteúdo que aparece sem JavaScript, uma canônica por página apontando para ela mesma. Critério de pronto: <span class="mn-num">site:seudominio</span> traz a página. <i>(D15–30)</i></li>\n <li><b>Elimine páginas concorrendo entre si.</b> Duas páginas suas disputando a mesma pergunta se anulam. Escolha uma, redirecione a outra.</li>\n <li><b>Velocidade e dados estruturados.</b> Tempo até a primeira resposta abaixo de meio segundo; JSON-LD do tipo certo, só com campo verdadeiro — ele confirma o texto visível, não substitui. <i>(D18–35)</i></li>\n <li><b>Padronize nome, endereço e telefone.</b> Idênticos — caractere por caractere — no site, no Perfil da Empresa no Google, no Bing Places e nos diretórios. Divergência aqui vira descrição errada na resposta da IA. <i>(D20–40)</i></li>\n <li><b>Perfil da Empresa e perfis do setor.</b> Os quinze itens preenchidos, avaliações respondidas, os mesmos dados em toda parte. Para negócio local é o Capítulo 17; para B2B, os diretórios do nicho. <i>(D25–45)</i></li>\n </ol>\n\n <p>São quatro tarefas e um marco: o <b>M2, no dia 45</b>.</p>',ta:['T6','T7','T8','T9'],mo:'m2'},{id:'s64',t:'6.4 Fase 2 — Fazer a IA escolher você D30 a D70',h:'<p>Só agora se escreve. E se escreve o reparo do tipo que o diagnóstico apontou, não uma receita igual para todas as páginas. Uma página por semana — duas ao mesmo tempo e você perde a atribuição.</p>\n\n <ol>\n <li><b>Intenção divergente.</b> A pergunta pede indicação, preço ou agendamento e a página explica o que é o serviço. O título vira a pergunta; a primeira frase responde direto. <i>(D30–50)</i></li>\n <li><b>Lacuna de informação.</b> A IA cita quem traz o dado que falta na sua página. É aqui que entram os quatro porteiros: preço ou faixa escrita, data visível, especificação concreta, e o assunto batendo com a pergunta. <i>(D35–58)</i></li>\n <li><b>Informação desatualizada.</b> Atualize o texto de verdade e date de forma visível. Trocar só a data, sem mudar o conteúdo, é o truque que derruba confiança. <i>(D40–62)</i></li>\n <li><b>Localização incompatível.</b> Bairro, cidade e cidades atendidas escritos no texto visível, como o cliente fala. <i>(D45–70)</i></li>\n <li><b>Em todas:</b> tire o “talvez”, corte o que não responde e traga o dado que só você tem — verdadeiro, datado e atribuído. Registre a data do reparo e reavalie 28 dias depois.</li>\n </ol>\n\n <p>São quatro tarefas e um marco: o <b>M3, no dia 70</b>. Depois dele, nada mais muda no site até a leitura.</p>\n\n <div class="mn-warn">\n <p class="mn-lbl">RESTRIÇÃO INEGOCIÁVEL</p>\n <h4>Não invente estatística para preencher a lacuna</h4>\n <p>Adicionar número falso aumenta a citação no curto prazo e destrói a credibilidade quando alguém confere. Além do problema ético, existe o técnico: um sistema de detecção publicado em 2026 identifica conteúdo otimizado para IA com F1 de <span class="mn-num">0,944</span>, inclusive nas variantes disfarçadas. <b>O critério é evidência verificável, datada e atribuída</b> — não “tem número na página”.</p>\n </div>',ta:['T10','T11','T12','T13'],mo:'m3'},{id:'s65',t:'6.5 Fase 3 — Existir fora do seu site D45 a D90',h:'<p class="mn-lead">Duas tarefas nesta fase: estar presente, com dados corretos, nas fontes que a IA já consulta no seu nicho <i>(D45–75)</i> — e ser citado por veículos do setor <i>(D55–90)</i
