<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Programa guiado de 90 dias para fazer a IA indicar o seu negócio: calendário dia a dia, medição com faixa de erro e diagnóstico assistido. Baseado em evidência publicada.">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Método 90 Dias">
<meta property="og:description" content="Programa guiado de 90 dias para fazer a IA indicar o seu negócio.">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230E3226"/><path d="M6 8h12l-8 8h8" stroke="%236FA98B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230E3226"/><path d="M6 8h12l-8 8h8" stroke="%236FA98B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Método 90 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  color-scheme:light;
  --pinho:#0E3226; --pinho-2:#17462F;
  --folha:#2E7D5B; --folha-t:#1B5A40;
  --mar:#2F6F84;   --mar-t:#245867;
  --ocre:#A8781F;  --ocre-t:#7A5510;
  --brasa:#8E4229; --brasa-t:#7A3722;
  --papel:#F2F4EF; --carta:#FFFFFF; --carta-2:#EAEEE7;
  --tinta:#141A17; --tinta-2:#4C574F; --tinta-3:#75817A;
  --linha:#D3DACE; --linha-2:#E3E8DF;
  --sel:rgba(46,125,91,.12);
  --sobre-acento:#FFFFFF;
  --sombra:0 1px 2px rgba(14,50,38,.06),0 6px 18px -10px rgba(14,50,38,.18);
  --sombra-alta:0 -2px 24px rgba(14,50,38,.14);
  --ff-ui:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --ff-ler:"Newsreader",Georgia,serif;
  --ff-num:"DM Mono",ui-monospace,monospace;
  --r:10px; --r-s:7px;
  --col:640px;
  --barra:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --pinho:#0B2019; --pinho-2:#183A2B;
    --folha:#4FA47C; --folha-t:#6FBE96;
    --mar:#5A9FB5;   --mar-t:#7FBACD;
    --ocre:#D6A544;  --ocre-t:#E2BB6B;
    --brasa:#D06B48; --brasa-t:#DE8969;
    --papel:#0F1512; --carta:#18201B; --carta-2:#212B24;
    --tinta:#E6EDE8; --tinta-2:#A6B3AB; --tinta-3:#7E8C85;
    --linha:#2C3A32; --linha-2:#232E28;
    --sel:rgba(79,164,124,.16);
    --sobre-acento:#08130E;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.6);
    --sombra-alta:0 -2px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --pinho:#0B2019;
  --folha:#4FA47C; --folha-t:#6FBE96;
  --mar:#5A9FB5;   --mar-t:#7FBACD;
  --ocre:#D6A544;  --ocre-t:#E2BB6B;
  --brasa:#D06B48; --brasa-t:#DE8969;
  --papel:#0F1512; --carta:#18201B; --carta-2:#212B24;
  --tinta:#E6EDE8; --tinta-2:#A6B3AB; --tinta-3:#7E8C85;
  --linha:#2C3A32; --linha-2:#232E28;
  --sel:rgba(79,164,124,.16);
  --sobre-acento:#08130E;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px -10px rgba(0,0,0,.6);
  --sombra-alta:0 -2px 28px rgba(0,0,0,.5);
}

/* ═══════════ BASE ═══════════ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--ff-ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.18;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--folha);outline-offset:2px;border-radius:4px}
.num{font-family:var(--ff-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═══════════ CASCA ═══════════ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:var(--papel);
  border-bottom:1px solid var(--linha);padding:.55rem .9rem;
  display:flex;align-items:center;gap:.6rem}
.topo-marca{display:flex;align-items:center;gap:.45rem;min-width:0}
.topo-marca svg{width:22px;height:22px;flex:none}
.topo-t{font-size:.9rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.topo-sub{font-family:var(--ff-num);font-size:.68rem;color:var(--tinta-3);white-space:nowrap}
.topo-dir{margin-left:auto;display:flex;gap:.3rem;align-items:center}
.icb{width:38px;height:38px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--tinta-2)}
.icb:hover{background:var(--carta-2);color:var(--tinta)}
.icb svg{width:19px;height:19px}

.corpo{flex:1;width:100%;max-width:var(--col);margin:0 auto;
  padding:1rem .9rem calc(var(--barra) + 2.4rem);}

.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--carta);border-top:1px solid var(--linha);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
.aba{height:var(--barra);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--tinta-3);font-size:.66rem;font-weight:600;
  position:relative;transition:color .15s}
.aba svg{width:21px;height:21px}
.aba[aria-current="page"]{color:var(--folha-t)}
.aba[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;
  height:2.5px;background:var(--folha);border-radius:0 0 3px 3px}
.aba-pip{position:absolute;top:9px;right:calc(50% - 18px);min-width:15px;height:15px;
  border-radius:8px;background:var(--brasa);color:var(--sobre-acento);font-family:var(--ff-num);
  font-size:.6rem;display:grid;place-items:center;padding:0 3px}

@media (min-width:900px){
  :root{--col:700px}
  .app{flex-direction:row}
  .abas{position:sticky;top:0;bottom:auto;left:auto;right:auto;height:100dvh;
    width:200px;flex:none;grid-template-columns:1fr;grid-auto-rows:min-content;
    align-content:start;gap:2px;padding:5.2rem .6rem 1rem;border-top:0;
    border-right:1px solid var(--linha);background:var(--papel)}
  .aba{height:46px;flex-direction:row;justify-content:flex-start;gap:.7rem;
    padding:0 .8rem;border-radius:var(--r-s);font-size:.86rem}
  .aba[aria-current="page"]{background:var(--sel)}
  .aba[aria-current="page"]::before{top:12px;bottom:12px;left:0;right:auto;
    width:2.5px;height:auto;border-radius:0 3px 3px 0}
  .aba-pip{position:static;margin-left:auto}
  .topo{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--papel)}
  .corpo{padding:4.6rem 1.5rem 4rem}
  .quadro{flex:1;display:flex;justify-content:center}
}

/* ═══════════ PRIMITIVAS ═══════════ */
.pilha{display:flex;flex-direction:column;gap:.9rem}
.pilha-s{display:flex;flex-direction:column;gap:.5rem}
.linha{display:flex;align-items:center;gap:.55rem}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);overflow:hidden}
.cartao-p{padding:.95rem 1rem}
.sec-t{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-3);margin-bottom:.5rem}
.h-tela{font-size:1.6rem;letter-spacing:-.03em}
.h-sec{font-size:1.08rem}
.sub{color:var(--tinta-2);font-size:.9rem;line-height:1.5}
.mini{font-size:.78rem;color:var(--tinta-3);line-height:1.45}

.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;font-weight:700;
  padding:.18rem .45rem;border-radius:5px;background:var(--carta-2);color:var(--tinta-2);
  white-space:nowrap;letter-spacing:.01em}
.chip.ok{background:color-mix(in srgb,var(--folha) 16%,transparent);color:var(--folha-t)}
.chip.at{background:color-mix(in srgb,var(--ocre) 20%,transparent);color:var(--ocre-t)}
.chip.cr{background:color-mix(in srgb,var(--brasa) 18%,transparent);color:var(--brasa-t)}
.chip.dt{background:color-mix(in srgb,var(--mar) 16%,transparent);color:var(--mar-t)}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:46px;padding:.6rem 1.05rem;border-radius:var(--r-s);
  font-size:.92rem;font-weight:700;background:var(--folha);color:var(--sobre-acento);
  transition:filter .15s;border:1px solid transparent}
.bt:hover{filter:brightness(1.08)}
.bt:disabled{opacity:.45;cursor:not-allowed}
.bt.sec{background:var(--carta);color:var(--tinta);border-color:var(--linha)}
.bt.sec:hover{background:var(--carta-2);filter:none}
.bt.fant{background:transparent;color:var(--tinta-2);min-height:40px;padding:.4rem .6rem;font-weight:600}
.bt.fant:hover{color:var(--brasa-t);filter:none}
.bt.larg{width:100%}
.bt svg{width:17px;height:17px;flex:none}

.campo{display:flex;flex-direction:column;gap:.3rem}
.campo>span{font-size:.78rem;font-weight:600;color:var(--tinta-2)}
.campo input,.campo select,.campo textarea{
  width:100%;padding:.62rem .7rem;min-height:46px;border:1px solid var(--linha);
  border-radius:var(--r-s);background:var(--carta);font-size:.95rem}
.campo textarea{min-height:76px;resize:vertical;line-height:1.45}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--folha);outline:none;box-shadow:0 0 0 3px var(--sel)}
.grade2{display:grid;gap:.7rem}
@media(min-width:560px){.grade2{grid-template-columns:1fr 1fr}}

.vazio{text-align:center;padding:2.2rem 1.2rem;color:var(--tinta-2)}
.vazio svg{width:34px;height:34px;color:var(--tinta-3);margin-bottom:.6rem}
.vazio h3{font-size:1rem;margin-bottom:.3rem;color:var(--tinta)}
</style>
<style>
/* ═══════════ HOJE ═══════════ */
.hoje-cab{display:flex;align-items:flex-start;gap:1rem;margin-bottom:.2rem}
.hoje-cab .dia-n{font-family:var(--ff-num);font-size:.74rem;color:var(--tinta-3);letter-spacing:.04em}
.anel{--p:0;width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--folha) calc(var(--p)*1%), var(--linha-2) 0)}
.anel i{width:50px;height:50px;border-radius:50%;background:var(--papel);display:grid;place-items:center;
  font-family:var(--ff-num);font-size:.86rem;font-style:normal;color:var(--tinta)}

.tarefa{display:grid;grid-template-columns:26px 1fr;gap:.7rem;padding:.75rem .9rem;
  border-top:1px solid var(--linha-2);align-items:start;text-align:left;width:100%}
.tarefa:first-of-type{border-top:0}
.tarefa:hover{background:var(--carta-2)}
.tk{width:24px;height:24px;border-radius:6px;border:2px solid var(--linha);
  display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s;background:var(--carta)}
.tk svg{width:14px;height:14px;color:var(--sobre-acento);opacity:0}
.tarefa.feita .tk{background:var(--folha);border-color:var(--folha)}
.tarefa.feita .tk svg{opacity:1}
.tarefa.feita .tarefa-n{color:var(--tinta-3);text-decoration:line-through;text-decoration-color:var(--linha)}
.tarefa-n{font-size:.94rem;font-weight:600;line-height:1.35}
.tarefa-m{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem;align-items:center}
.tarefa-d{font-size:.8rem;color:var(--tinta-2);margin-top:.35rem;line-height:1.45}

.faixa-frente{width:3px;border-radius:2px;align-self:stretch}
.fr-medicao{background:var(--mar)} .fr-tecnico{background:var(--pinho-2)}
.fr-conteudo{background:var(--ocre)} .fr-rede{background:var(--folha)}
.fr-governanca{background:var(--tinta-3)} .fr-reparo{background:var(--brasa)}

/* ═══════════ CALENDÁRIO ═══════════ */
.cal-nav{display:flex;align-items:center;gap:.4rem;margin-bottom:.7rem}
.cal-mes{font-size:1rem;font-weight:700;text-transform:capitalize;flex:1}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:.64rem;font-weight:700;color:var(--tinta-3);text-align:center;
  padding:.3rem 0;letter-spacing:.05em;text-transform:uppercase}
.cal-d{aspect-ratio:1;border-radius:var(--r-s);background:var(--carta);border:1px solid var(--linha-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;padding:2px;transition:border-color .12s}
.cal-d:hover{border-color:var(--folha)}
.cal-d.fora{background:transparent;border-color:transparent;color:var(--tinta-3);opacity:.45}
.cal-d.dentro{background:var(--carta)}
.cal-d.hoje{border-color:var(--folha);border-width:2px}
.cal-d.sel{background:var(--pinho);border-color:var(--pinho)}
.cal-d.sel .cal-n{color:#fff}
.cal-n{font-family:var(--ff-num);font-size:.82rem;line-height:1}
.cal-pts{display:flex;gap:2px;height:5px;align-items:center}
.cal-pts i{width:5px;height:5px;border-radius:50%;display:block}
.cal-marco{position:absolute;top:2px;right:2px;width:7px;height:7px;
  background:var(--pinho);transform:rotate(45deg)}
.cal-d.sel .cal-marco{background:#fff}
.cal-leg{display:flex;flex-wrap:wrap;gap:.5rem .9rem;margin-top:.8rem;font-size:.72rem;color:var(--tinta-2)}
.cal-leg span{display:inline-flex;align-items:center;gap:.32rem}
.cal-leg i{width:8px;height:8px;border-radius:50%}

/* ═══════════ FOLHA ═══════════ */
.folha-fundo{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.5);
  backdrop-filter:blur(2px);animation:aparece .18s ease}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--papel);
  border-radius:16px 16px 0 0;box-shadow:var(--sombra-alta);max-height:88dvh;
  display:flex;flex-direction:column;animation:sobe .22s cubic-bezier(.2,.8,.3,1)}
.folha-p{width:36px;height:4px;border-radius:2px;background:var(--linha);margin:.55rem auto .1rem;flex:none}
.folha-cab{padding:.5rem 1rem .7rem;border-bottom:1px solid var(--linha);flex:none;
  display:flex;align-items:flex-start;gap:.7rem}
.folha-corpo{overflow-y:auto;padding:.9rem 1rem 2rem;-webkit-overflow-scrolling:touch}
@keyframes sobe{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@media(min-width:900px){
  .folha{left:auto;right:0;top:0;bottom:0;width:min(460px,42vw);border-radius:0;
    max-height:none;animation:entra .22s cubic-bezier(.2,.8,.3,1)}
  .folha-p{display:none}
  @keyframes entra{from{transform:translateX(20px);opacity:.5}to{transform:none;opacity:1}}
}

/* ═══════════ ASSISTENTE (diagnóstico) ═══════════ */
.dg{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);overflow:hidden}
.dg-topo{background:var(--pinho);padding:.85rem 1rem;color:#DCE8E0}
.dg-passos{display:flex;gap:5px;margin-bottom:.55rem}
.dg-passos i{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.22)}
.dg-passos i.on{background:var(--folha)}
.dg-passos i.done{background:rgba(255,255,255,.6)}
.dg-etq{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8FB8A2}
.dg-q{padding:1.1rem 1rem .3rem}
.dg-q h3{font-size:1.14rem;line-height:1.28}
.dg-q p{margin-top:.4rem;color:var(--tinta-2);font-size:.86rem;line-height:1.5}
.dg-ops{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1rem 1rem}
.op{display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center;text-align:left;
  padding:.85rem .9rem;border:1.5px solid var(--linha);border-radius:var(--r-s);
  background:var(--carta);transition:all .14s}
.op:hover{border-color:var(--folha);background:var(--sel)}
.op b{display:block;font-size:.95rem;line-height:1.3}
.op span{display:block;font-size:.79rem;color:var(--tinta-2);margin-top:.2rem;line-height:1.45}
.op svg{width:17px;height:17px;color:var(--tinta-3);flex:none}
.op:hover svg{color:var(--folha-t)}
.dg-pe{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;
  border-top:1px solid var(--linha-2);background:var(--carta-2)}

.res{border-radius:var(--r);overflow:hidden;border:1px solid var(--linha);box-shadow:var(--sombra)}
.res-cab{padding:1rem;color:var(--sobre-acento)}
.res-cab.a{background:var(--folha)} .res-cab.b{background:var(--ocre-t)} .res-cab.c{background:var(--brasa)}
.res-cab .et{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.res-cab h3{font-size:1.2rem;margin-top:.25rem}
.res-corpo{background:var(--carta);padding:1rem;display:flex;flex-direction:column;gap:.85rem}
.res-bl>b{display:block;font-size:.72rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--tinta-3);margin-bottom:.22rem}
.res-bl>p{font-size:.9rem;line-height:1.55;color:var(--tinta-2)}
.res-bl>p strong{color:var(--tinta)}

/* ═══════════ MEDIÇÃO ═══════════ */
.step{display:inline-flex;align-items:center;border:1px solid var(--linha);border-radius:8px;
  overflow:hidden;background:var(--carta);flex:none}
.step button{width:38px;height:40px;display:grid;place-items:center;color:var(--tinta-2);font-size:1.1rem}
.step button:hover{background:var(--carta-2);color:var(--tinta)}
.step b{min-width:44px;text-align:center;font-family:var(--ff-num);font-size:.95rem;
  border-left:1px solid var(--linha-2);border-right:1px solid var(--linha-2);line-height:40px}
.mq{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--linha-2)}
.mq:first-child{border-top:0}
.mq-t{flex:1;min-width:0;font-size:.87rem;line-height:1.35}
.mq-t small{display:block;font-size:.7rem;color:var(--tinta-3);margin-top:.15rem}
.motores{display:flex;gap:.4rem;flex-wrap:wrap}
.mot{padding:.45rem .8rem;border-radius:20px;border:1.5px solid var(--linha);
  font-size:.82rem;font-weight:600;background:var(--carta);min-height:40px}
.mot[aria-pressed="true"]{background:var(--mar);border-color:var(--mar);color:var(--sobre-acento)}

.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--linha-2)}
@media(min-width:520px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi>div{background:var(--carta);padding:.8rem .85rem}
.kpi b{display:block;font-family:var(--ff-num);font-size:1.3rem;line-height:1.15;color:var(--tinta)}

/* ═════════ ARMAZENAMENTO: db -> localStorage -> memória ═════════ */
const LS = "metodo90.v1";
const memoria = {};
function lerLocal(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return memoria[k]||null; } }
function gravarLocal(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ memoria[k]=v; } }

function novoCodigo(){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let i=0;i<6;i++) s+=abc[Math.floor(Math.random()*abc.length)];
  return s;
}
function estadoVazio(ws){
  return { ws, perfil:null, carteira:[], tarefas:{}, diag:{}, reparos:[], medicoes:{}, notas:{} };
}

/* ═════════ SINCRONIZAÇÃO ENTRE APARELHOS (opcional) ═════════
   Hoje o app guarda tudo no navegador deste aparelho. Nada sai daqui.

   Para sincronizar celular e desktop, ligue o adaptador de Supabase abaixo:

   1) No SQL Editor do seu projeto Supabase, rode:

      create table public.metodo90 (
        ws         text primary key,
        estado     jsonb       not null default '{}'::jsonb,
        atualizado timestamptz not null default now()
      );
      alter table public.metodo90 enable row level security;
      revoke all on public.metodo90 from anon, authenticated;

      create or replace function public.metodo90_ler(p_ws text)
      returns jsonb language sql security definer set search_path = public as $$
        select estado from public.metodo90 where ws = p_ws;
      $$;

      create or replace function public.metodo90_gravar(p_ws text, p_estado jsonb)
      returns void language sql security definer set search_path = public as $$
        insert into public.metodo90 (ws, estado, atualizado)
        values (p_ws, p_estado, now())
        on conflict (ws) do update
          set estado = excluded.estado, atualizado = now();
      $$;

      grant execute on function public.metodo90_ler(text)          to anon;
      grant execute on function public.metodo90_gravar(text,jsonb) to anon;

   2) Preencha as duas constantes abaixo com a URL e a chave publicável do projeto.
   3) Troque a linha  let SINC = null;  por  let SINC = sincSupabase();

   MODELO DE SEGURANÇA, sem enfeite: quem souber o código do espaço lê e escreve
   aquele registro. É o mesmo nível de um link não listado. Não guarde nada sensível
   aqui. Para uso multicliente de verdade, troque as funções por RLS sobre auth.uid()
   com login por e-mail — aí cada pessoa só enxerga o próprio espaço.
*/
const SUPABASE_URL  = "";
const SUPABASE_CHAVE = "";

function sincSupabase(){
  if(!SUPABASE_URL || !SUPABASE_CHAVE) return null;
  const cab = { apikey:SUPABASE_CHAVE, Authorization:"Bearer "+SUPABASE_CHAVE, "Content-Type":"application/json" };
  const rpc = (fn, corpo) => fetch(SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn,
    { method:"POST", headers:cab, body:JSON.stringify(corpo) });
  return {
    nome: "Supabase",
    async carregar(ws){
      try{ const r = await rpc("metodo90_ler",{p_ws:ws}); if(!r.ok) return null; return await r.json(); }
      catch(e){ return null; }
    },
    async gravar(ws, estado){
      try{ await rpc("metodo90_gravar",{p_ws:ws, p_estado:estado}); }catch(e){}
    }
  };
}

let SINC = null;          // <- troque para sincSupabase() quando as funções existirem
let sincAtivo = false;

const ouvintes = new Set();
let ESTADO = null;
let gravaTimer = null;

async function gravarRemoto(){
  if(!SINC || !ESTADO) return;
  await SINC.gravar(ESTADO.ws, ESTADO);
}

function avisar(){ ouvintes.forEach(f=>f(ESTADO)); }
function comprometer(){
  gravarLocal(LS, ESTADO);
  avisar();
  clearTimeout(gravaTimer);
  gravaTimer = setTimeout(gravarRemoto, 900);
}
function mudar(fn){
  const proximo = fn(ESTADO);
  ESTADO = { ...ESTADO, ...proximo, atualizado: Date.now() };
  comprometer();
}

function iniciarEstado(){
  const salvo = lerLocal(LS);
  ESTADO = salvo && salvo.ws ? { ...estadoVazio(salvo.ws), ...salvo } : estadoVazio(novoCodigo());
  if(!salvo) gravarLocal(LS, ESTADO);
  return ESTADO;
}

async function conectarSinc(){
  if(!SINC) return false;
  const remoto = await SINC.carregar(ESTADO.ws);
  if(remoto && (remoto.atualizado||0) > (ESTADO.atualizado||0)){
    ESTADO = { ...ESTADO, ...remoto };
    gravarLocal(LS, ESTADO);
  }
  sincAtivo = true; avisar();
  return true;
}

async function trocarWorkspace(codigo){
  const cod = String(codigo||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{4,12}$/.test(cod)) return { ok:false, erro:"Código inválido. Use de 4 a 12 letras e números." };
  const remoto = SINC ? await SINC.carregar(cod) : null;
  ESTADO = remoto ? { ...estadoVazio(cod), ...remoto, ws:cod } : estadoVazio(cod);
  gravarLocal(LS, ESTADO); avisar();
  return { ok:true, temDados: !!ESTADO.perfil, remoto: !!remoto };
}

function importarEstado(bruto){
  let obj;
  try{ obj = JSON.parse(bruto); }catch(e){ return { ok:false, erro:"Arquivo não é um JSON válido." }; }
  if(!obj || typeof obj !== "object" || !("carteira" in obj) || !("tarefas" in obj))
    return { ok:false, erro:"Este arquivo não parece ser um backup do Método 90 Dias." };
  ESTADO = { ...estadoVazio(obj.ws || ESTADO.ws), ...obj, atualizado: Date.now() };
  comprometer();
  return { ok:true };
}

/* ═════════ CALENDÁRIO ═════════ */
const HOJE_ISO = () => dayjs().format("YYYY-MM-DD");

function diaPrograma(estado, iso){
  if(!estado.perfil?.inicio) return null;
  const d = dayjs(iso).startOf("day").diff(dayjs(estado.perfil.inicio).startOf("day"), "day") + 1;
  return d >= 1 && d <= 90 ? d : null;
}
function isoDoDia(estado, n){
  if(!estado.perfil?.inicio) return null;
  return dayjs(estado.perfil.inicio).add(n-1,"day").format("YYYY-MM-DD");
}
function temMedicao(estado, iso){ return (estado.medicoes?.[iso]||[]).length > 0; }

function itensDoDia(estado, iso){
  const dia = diaPrograma(estado, iso);
  if(!dia) return { dia:null, itens:[], marco:null };
  const itens = [];
  TAREFAS.forEach(t=>{
    if(dia < t.d0 || dia > t.d1) return;
    itens.push({
      chave:t.id, tipo:"tarefa", t,
      estagio: dia===t.d0 ? "comeca" : (dia===t.d1 ? "entrega" : "segue"),
      feito: !!estado.tarefas[t.id]
    });
  });
  if(dia >= 8){
    itens.push({ chave:"coleta@"+iso, tipo:"ritual", iso,
      feito: temMedicao(estado, iso) || !!estado.tarefas["coleta@"+iso] });
  }
  (estado.reparos||[]).forEach(r=>{
    if(r.dia !== dia) return;
    itens.push({ chave:"R"+r.id, tipo:"reparo", r, feito: !!estado.tarefas["R"+r.id] });
  });
  const marco = MARCOS.find(m=>m.d===dia) || null;
  return { dia, itens, marco };
}

function resumoDoDia(estado, iso){
  const { dia, itens, marco } = itensDoDia(estado, iso);
  if(!dia) return null;
  const frentes = [...new Set(itens.filter(i=>!i.feito).map(i=> i.tipo==="ritual" ? "medicao" : (i.tipo==="reparo" ? "reparo" : i.t.f)))];
  return { dia, total:itens.length, abertos:itens.filter(i=>!i.feito).length, frentes, marco:!!marco };
}

/* ═════════ ESTATÍSTICA ═════════ */
function wilson(p, n){
  if(!(n>0)) return [0,1];
  const z=1.959964, d=1+z*z/n;
  const c=(p+z*z/(2*n))/d;
  const h=z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n))/d;
  return [Math.max(0,c-h), Math.min(1,c+h)];
}
function agregar(estado, deIso, ateIso, fatorAgrup){
  const fa = fatorAgrup || 2;
  let apar=0, rod=0, dom=0, comDom=0, dias=0;
  Object.entries(estado.medicoes||{}).forEach(([d,regs])=>{
    if(d < deIso || d > ateIso) return;
    let houve=false;
    regs.forEach(r=>{ apar+=r.a||0; rod+=r.r||0; if(r.dom) comDom++; dom++; houve=true; });
    if(houve) dias++;
  });
  const p = rod ? apar/rod : 0;
  const nEf = Math.max(1, rod/fa);
  const [lo,hi] = wilson(p, nEf);
  return { apar, rod, p, lo, hi, dias, presencaDominio: dom?comDom/dom:0 };
}
function janelaBaseline(estado){
  const i = estado.perfil?.inicio; if(!i) return null;
  return { de: dayjs(i).add(7,"day").format("YYYY-MM-DD"), ate: dayjs(i).add(20,"day").format("YYYY-MM-DD") };
}
function janelaAtual(estado, dias){
  const fim = dayjs();
  return { de: fim.subtract((dias||28)-1,"day").format("YYYY-MM-DD"), ate: fim.format("YYYY-MM-DD") };
}
function serieDiaria(estado){
  return Object.entries(estado.medicoes||{}).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,regs])=>{
    const apar=regs.reduce((s,r)=>s+(r.a||0),0), rod=regs.reduce((s,r)=>s+(r.r||0),0);
    return { d, p: rod?apar/rod:0, rod };
  });
}
function fmtPct(x, casas){ return (x*100).toLocaleString("pt-BR",{minimumFractionDigits:casas||0,maximumFractionDigits:casas||0})+"%"; }

/* ═════════ PROGRESSO ═════════ */
function progresso(estado){
  const hoje = HOJE_ISO();
  const dia = diaPrograma(estado, hoje) || 0;
  const devidas = TAREFAS.filter(t=>t.d0 <= dia);
  const feitas = devidas.filter(t=>estado.tarefas[t.id]).length;
  const rep = (estado.reparos||[]).filter(r=>r.dia<=dia);
  const repF = rep.filter(r=>estado.tarefas["R"+r.id]).length;
  const tot = devidas.length + rep.length;
  return { dia, feitas: feitas+repF, total: tot, pct: tot ? Math.round((feitas+repF)/tot*100) : 0 };
}
function faseDoDia(d){
  if(d<=21) return "Fase 0 · Medir antes de mexer";
  if(d<=45) return "Fase 1 · Fazer a IA conseguir ler você";
  if(d<=70) return "Fase 2 · Fazer a IA escolher você";
  if(d<=75) return "Fase 3 · Existir fora do site";
  return "Fase 4 · Ler o resultado";
}

  return html`

          ${item.tipo==="tarefa" && item.estagio==="entrega" && html`<span className="chip at">entrega hoje</span>`}
          ${item.tipo==="tarefa" && t.crit && html`<span className="chip cr">caminho crítico</span>`}

/* ═════════ TELA: CALENDÁRIO ═════════ */
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"];
function TelaCalendario({estado, acoes, irPara}){
  const [mes, setMes] = useState(()=>{
    const h = dayjs(); const ini = estado.perfil ? dayjs(estado.perfil.inicio) : h;
    return (h.isBefore(ini,"month") ? ini : h).startOf("month");
  });
  const dias = useMemo(()=>{
    const ini = mes.startOf("month"), fim = mes.endOf("month");
    const arr = []; let cur = ini.subtract(ini.day(),"day");
    const ultimo = fim.add(6-fim.day(),"day");
    while(cur.isBefore(ultimo) || cur.isSame(ultimo,"day")){ arr.push(cur); cur = cur.add(1,"day"); }
    return arr;
  },[mes.valueOf()]);
  const hoje = HOJE_ISO();
  if(!estado.perfil) return html`<${Boas} irPara=${irPara}/>`;
  return html`
    <div className="pilha">
      <div>
        <h1 className="h-tela">Calendário</h1>
        <p className="sub" style=${{marginTop:".2rem"}}>Toque num dia para ver exatamente o que fazer nele.</p>
      </div>
      <div className="cartao cartao-p">
        <div className="cal-nav">
          <button className="icb" onClick=${()=>setMes(mes.subtract(1,"month"))} aria-label="Mês anterior"><${Ico} k="chevE"/></button>
          <span className="cal-mes">${mes.format("MMMM [de] YYYY")}</span>
          <button className="icb" onClick=${()=>setMes(mes.add(1,"month"))} aria-label="Próximo mês"><${Ico} k="chevDir"/></button>
        </div>
        <div className="cal-grade" role="grid">
          ${DOW.map(d=>html`<div key=${d} className="cal-dow">${d}</div>`)}
          ${dias.map(d=>{
            const iso = d.format("YYYY-MM-DD");
            const r = resumoDoDia(estado, iso);
            const noMes = d.month()===mes.month();
            const cls = "cal-d " + (r ? "dentro " : "fora ") + (iso===hoje ? "hoje " : "") + (noMes?"":"fora");
            return html`<button key=${iso} className=${cls} onClick=${()=>acoes.abrirDia(iso)}
              aria-label=${d.format("D [de] MMMM") + (r ? ", " + r.abertos + " itens em aberto" : ", fora do programa")}>
              ${r && r.marco && html`<span className="cal-marco"></span>`}
              <span className="cal-n">${d.date()}</span>
              <span className="cal-pts">${(r?r.frentes:[]).slice(0,4).map(f=>html`<i key=${f} className=${"fr-"+f}></i>`)}</span>
            </button>`;
          })}
        </div>
        <div className="cal-leg">
          ${Object.entries(FRENTES).map(([k,v])=>html`<span key=${k}><i className=${"fr-"+k}></i>${v.n}</span>`)}
          <span><span className="cal-marco" style=${{position:"static",display:"inline-block"}}></span> Marco</span>
        </div>
      </div>
      <div className="aviso dt">
        <${Ico} k="info"/>
        <div>Os pontos coloridos mostram as <b>frentes com item em aberto</b> naquele dia. Conforme você registra medições e roda o diagnóstico, o calendário ganha as suas tarefas de reparo.</div>
      </div>
    </div>`;
}

        <p className="sec-t" style=${{marginBottom:".15rem"}}>Sugestões</p>

        <button className="bt sec" style=${{minHeight:"38px",padding:".3rem .7rem"}}

    ${carteira.length>0 ? html`<div className="cartao">

        <div className="mq-t">${q.texto}<small>${INTENCOES[q.intencao]?INTENCOES[q.intencao].n:q.intencao}</small></div>
        <button className="icb" aria-label="Remover pergunta"
          onClick=${()=>acoes.mudar(e=>({carteira:e.carteira.filter(x=>x.id!==q.id)}))}><${Ico} k="lixo"/></button>

  </div>`;
}

/* ═════════ TELA: MEDIR ═════════ */
function TelaMedir({estado, acoes, avisar, irPara}){
  const [data,setData] = useState(HOJE_ISO());
  const [motor,setMotor] = useState(MOTORES[0]);
  const [buf,setBuf] = useState({});
  const carteira = estado.carteira||[];
  const jaSalvo = (estado.medicoes[data]||[]).filter(r=>r.m===motor);
  useEffect(()=>{
    const m={}; jaSalvo.forEach(r=>{ m[r.p]={a:r.a,dom:!!r.dom}; });
    setBuf(m);
  },[data,motor,estado.medicoes[data]?.length]);

  function salvar(){
    const regs = Object.entries(buf).filter(([,v])=>v && (v.a>0||v.marcado||v.dom))
      .map(([p,v])=>({p, m:motor, a:v.a||0, r:7, dom:!!v.dom}));
    if(!regs.length){ avisar("Marque pelo menos uma pergunta."); return; }
    acoes.mudar(e=>{
      const outros=(e.medicoes[data]||[]).filter(r=>r.m!==motor);
      return { medicoes:{...e.medicoes, [data]:[...outros,...regs]} };
    });
    avisar("Coleta de " + motor + " salva.");
  }
  function passo(p, delta){
    setBuf(b=>{ const v=b[p]||{a:0}; const a=Math.max(0,Math.min(7,(v.a||0)+delta)); return {...b,[p]:{...v,a,marcado:true}}; });
  }

  if(!estado.perfil) return html`<${Boas} irPara=${irPara}/>`;

  const base = janelaBaseline(estado);
  const agB = base ? agregar(estado, base.de, base.ate) : null;
  const j28 = janelaAtual(estado, 28);
  const agA = agregar(estado, j28.de, j28.ate);
  const serie = serieDiaria(estado);
  const nDias = serie.length;

  return html`<div className="pilha">
    <div>
      <h1 className="h-tela">Medição</h1>
      <p className="sub" style=${{marginTop:".2rem"}}>Sete repetições por pergunta, por motor, em janela anônima. Sempre.</p>
    </div>

    <div className="cartao">
      <div className="kpi">
        <div><b className="num">${nDias}</b><span>dias com coleta</span></div>
        <div><b className="num">${agA.rod}</b><span>rodadas nos últimos 28 dias</span></div>
        <div><b className="num">${agA.rod?fmtPct(agA.p,1):"—"}</b><span>taxa de detecção 28d</span></div>
        <div><b className="num" style=${{fontSize:"1rem"}}>${agA.rod?fmtPct(agA.lo,0)+"–"+fmtPct(agA.hi,0):"—"}</b><span>faixa de erro 95%</span></div>
      </div>
    </div>

    ${serie.length>1 && html`<${GrafSerie} serie=${serie} base=${agB} atual=${agA}/>`}

    ${agB && agB.rod>0 && agA.rod>0 && html`<div className=${"aviso" + (agA.lo>agB.hi||agA.hi<agB.lo ? " dt":"")}>
      <${Ico} k=${agA.lo>agB.hi||agA.hi<agB.lo ? "check":"alerta"}/>
      <div>${agA.lo>agB.hi
        ? html`A janela atual (<b>${fmtPct(agA.p,1)}</b>) está <b>acima</b> da faixa do baseline (${fmtPct(agB.lo,0)}–${fmtPct(agB.hi,0)}). A diferença sai da margem de erro.`
        : agA.hi<agB.lo
        ? html`A janela atual (<b>${fmtPct(agA.p,1)}</b>) está <b>abaixo</b> da faixa do baseline. Investigue antes de mudar o plano.`
        : html`As faixas do baseline e da janela atual <b>se sobrepõem</b>. Ainda não dá para afirmar que mudou alguma coisa — e isso é um resultado legítimo.`}</div>
    </div>`}

    <div className="cartao">
      <div className="cartao-p pilha-s" style=${{borderBottom:"1px solid var(--linha)"}}>
        <p className="sec-t" style=${{margin:0}}>Registrar coleta</p>
        <div className="grade2">
          <label className="campo"><span>Data</span>
            <input type="date" value=${data} onChange=${e=>setData(e.target.value)}/></label>
          <label className="campo"><span>Motor</span>
            <select value=${motor} onChange=${e=>setMotor(e.target.value)}>
              ${MOTORES.map(m=>html`<option key=${m} value=${m}>${m}</option>`)}</select></label>
        </div>
        <p className="mini">Para cada pergunta: em quantas das 7 rodadas a sua marca apareceu.
          Marque também se o seu site entrou na lista de fontes citadas.</p>
      </div>
      ${carteira.length ? html`<div>
        ${carteira.map(q=>{
          const v = buf[q.id]||{a:0};
          return html`<div key=${q.id} className="mq">
            <div className="mq-t">${q.texto}
              <small>
                <label style=${{display:"inline-flex",gap:".3rem",alignItems:"center",cursor:"pointer",marginTop:".25rem"}}>
                  <input type="checkbox" checked=${!!v.dom}
                    onChange=${e=>setBuf(b=>({...b,[q.id]:{...(b[q.id]||{a:0}),dom:e.target.checked,marcado:true}}))}/>
                  meu site foi citado como fonte</label>
              </small></div>
            <div className="step">
              <button onClick=${()=>passo(q.id,-1)} aria-label="Menos uma">−</button>
              <b className="num">${v.a||0}/7</b>
              <button onClick=${()=>passo(q.id,1)} aria-label="Mais uma">+</button>
            </div>
          </div>`;
        })}
        <div className="cartao-p" style=${{borderTop:"1px solid var(--linha)"}}>
          <button className="bt larg" onClick=${salvar}>Salvar coleta de ${motor}</button>
          ${jaSalvo.length>0 && html`<p className="mini" style=${{marginTop:".5rem",textAlign:"center"}}>
            Já existem ${jaSalvo.length} registros deste motor nesta data. Salvar substitui.</p>`}
        </div>
      </div>` : html`<div className="vazio"><${Ico} k="pino"/><h3>Sem perguntas ainda</h3>
        <p className="sub">Monte a carteira antes de medir.</p>
        <div style=${{marginTop:".8rem"}}><button className="bt" onClick=${()=>irPara("carteira")}>Ir para a carteira</button></div></div>`}
    </div>
  </div>`;
}

function GrafSerie({serie, base, atual}){
  const W=620,H=200,ml=38,mr=14,mt=14,mb=30;
  const n=serie.length;
  const x=i=> n<2 ? ml : ml + i/(n-1)*(W-ml-mr);
  const y=p=> mt + (1-p)*(H-mt-mb);
  const pts = serie.map((s,i)=>x(i).toFixed(1)+","+y(s.p).toFixed(1)).join(" ");
  const yB = base && base.rod ? y(base.p) : null;
  return html`<figure className="cartao" style=${{margin:0}}>
    <div className="cartao-p" style=${{paddingBottom:".2rem"}}>
      <h3 className="h-sec" style=${{fontSize:".98rem"}}>Taxa de detecção por dia</h3>
      <p className="mini" style=${{marginTop:".15rem"}}>Em quantas das rodadas do dia a sua marca apareceu.</p>
    </div>
    <div className="cartao-p" style=${{paddingTop:".5rem"}}>
      <svg className="graf" viewBox=${"0 0 "+W+" "+H} role="img"
        aria-label=${"Série diária da taxa de detecção, " + n + " dias registrados."}>
        ${[0,.25,.5,.75,1].map(t=>html`<g key=${t}>
          <line x1=${ml} y1=${y(t)} x2=${W-mr} y2=${y(t)} stroke="var(--linha-2)" strokeWidth="1"/>
          <text x=${ml-7} y=${y(t)+4} textAnchor="end" fontFamily="DM Mono, monospace" fontSize="11" fill="var(--tinta-3)">${Math.round(t*100)}%</text>
        </g>`)}
        ${yB!==null && html`<g>
          <line x1=${ml} y1=${yB} x2=${W-mr} y2=${yB} stroke="var(--mar)" strokeWidth="1.5" strokeDasharray="5 4"/>
          <text x=${W-mr} y=${yB-6} textAnchor="end" fontFamily="Bricolage Grotesque, sans-serif" fontSize="11" fill="var(--mar-t)">baseline ${fmtPct(base.p,0)}</text>
        </g>`}
        ${atual && atual.rod>0 && html`<rect x=${ml} y=${y(atual.hi)} width=${W-ml-mr} height=${Math.max(1,y(atual.lo)-y(atual.hi))}
          fill="var(--folha)" opacity=".12"/>`}
        <polyline points=${pts} fill="none" stroke="var(--folha)" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
        ${serie.map((s,i)=>html`<circle key=${s.d} cx=${x(i)} cy=${y(s.p)} r=${i===n-1?4.5:2.6} fill="var(--folha)"/>`)}
        <text x=${ml} y=${H-9} fontFamily="Bricolage Grotesque, sans-serif" fontSize="11" fill="var(--tinta-3)">${dayjs(serie[0].d).format("D/MM")}</text>
        <text x=${W-mr} y=${H-9} textAnchor="end" fontFamily="Bricolage Grotesque, sans-serif" fontSize="11" fill="var(--tinta-3)">${dayjs(serie[n-1].d).format("D/MM")}</text>
      </svg>
      <p className="mini" style=${{marginTop:".4rem"}}>A faixa verde clara é o intervalo de confiança de 95% da janela de 28 dias.
        Ponto isolado fora dela não é resultado — é variação normal do canal.</p>
    </div>
  </figure>`;
}

const RAMOS = {

  C:{cor:"c", t:"Problema de recuperação",

     onde:"É trabalho técnico de busca: indexação, robots.txt, renderização, canônicas duplicadas, velocidade, e consistência de nome, endereço e telefone entre todos os canais.",
     nao:"Não contrate redação. Não assine ferramenta de monitoramento cara ainda — ela vai passar meses mostrando zero e você já sabe o porquê.",
     primeiro:"Busque no Google por site:seudominio.com.br e confira se as páginas-alvo aparecem. Se não aparecem na busca comum, não existem para a IA.",
     custo:"Meses. Exige desenvolvedor."}

function TelaDiag({estado, acoes, avisar, irPara}){
  const [pid,setPid] = useState(null);
  const [passo,setPasso] = useState(0);
  const [resp,setResp] = useState({});
  const carteira = estado.carteira||[];
  const salvos = Object.entries(estado.diag||{});

  function reiniciar(){ setPid(null); setPasso(0); setResp({}); }
  function responder(chave, valor, proximo){
    const r = {...resp,[chave]:valor}; setResp(r);
    if(proximo===null){ setPasso(99); } else setPasso(proximo);
  }
  const ramo = resp.apareceu==="varias" || resp.apareceu==="poucas" ? "A"
             : resp.fonte==="sim" ? "B" : resp.fonte==="nao" ? "C" : null;

  function salvar(){
    const q = carteira.find(x=>x.id===pid);
    acoes.mudar(e=>({ diag:{...e.diag,[pid]:{ramo, falha:resp.falha||null, em:HOJE_ISO(), pergunta:q?q.texto:""}} }));
    avisar("Diagnóstico salvo.");
  }
  function criarReparo(){
    const q = carteira.find(x=>x.id===pid);
    const dia = Math.max(30, Math.min(60, (diaPrograma(estado,HOJE_ISO())||30) + 5));
    acoes.mudar(e=>({
      diag:{...e.diag,[pid]:{ramo, falha:resp.falha||null, em:HOJE_ISO(), pergunta:q?q.texto:""}},
      reparos:[...(e.reparos||[]).filter(r=>r.pid!==pid),
        {id:"rep"+Date.now(), pid, pergunta:q?q.texto:"", falha:resp.falha||"intencao", dia}]
    }));
    avisar("Tarefa de reparo criada para o dia " + dia + ".");
  }

  if(!estado.perfil) return html`<${Boas} irPara=${irPara}/>`;

  /* ---- lista inicial ---- */
  if(!pid){
    return html`<div className="pilha">
      <div>
        <h1 className="h-tela">Diagnóstico</h1>
        <p className="sub" style=${{marginTop:".2rem"}}>
          Duas empresas podem estar igualmente invisíveis por motivos opostos. Antes de escrever qualquer coisa,
          descubra qual dos três problemas é o seu — pergunta por pergunta.</p>
      </div>
      ${carteira.length===0
        ? html`<div className="cartao vazio"><${Ico} k="ramo"/><h3>Monte a carteira primeiro</h3>
            <p className="sub">O diagnóstico é feito pergunta por pergunta, sobre o que você mediu.</p>
            <div style=${{marginTop:".8rem"}}><button className="bt" onClick=${()=>irPara("carteira")}>Ir para a carteira</button></div></div>`
        : html`<div className="cartao">
            <div className="cartao-p" style=${{borderBottom:"1px solid var(--linha)"}}>
              <p className="sec-t" style=${{margin:0}}>Escolha a pergunta para diagnosticar</p></div>
            ${carteira.map(q=>{
              const d = (estado.diag||{})[q.id];
              return html`<button key=${q.id} className="mq" style=${{width:"100%",textAlign:"left"}} onClick=${()=>{setPid(q.id);setPasso(0);setResp({});}}>
                <div className="mq-t">${q.texto}
                  <small>${d ? "Diagnosticada: Ramo " + d.ramo + (d.falha?" · "+FALHAS[d.falha].n:"") : "Ainda não diagnosticada"}</small></div>
                ${d ? html`<span className=${"chip " + (d.ramo==="A"?"ok":d.ramo==="B"?"at":"cr")}>Ramo ${d.ramo}</span>` : html`<${Ico} k="chevDir"/>`}
              </button>`;
            })}
          </div>`}
      ${salvos.length>0 && html`<div className="cartao cartao-p">
        <p className="sec-t">Resumo do diagnóstico</p>
        <div className="linha" style=${{gap:".4rem",flexWrap:"wrap"}}>
          ${["A","B","C"].map(r=>{
            const n = salvos.filter(([,d])=>d.ramo===r).length;
            return html`<span key=${r} className=${"chip " + (r==="A"?"ok":r==="B"?"at":"cr")}>Ramo ${r}: ${n}</span>`;
          })}
        </div>
        <p className="mini" style=${{marginTop:".55rem"}}>
          ${salvos.filter(([,d])=>d.ramo==="C").length > salvos.length/2
            ? "A maioria caiu no Ramo C. Pare o conteúdo e trate só o técnico — reescrever página que a IA não lê não produz efeito."
            : "Cada ramo tem custo e prazo diferentes. Um fornecedor que aplica a mesma receita nos três não está diagnosticando."}</p>
      </div>`}
    </div>`;
  }

  const pergunta = carteira.find(x=>x.id===pid);
  const totalPassos = 3;
  const idxPasso = passo===99 ? totalPassos : passo;

  /* ---- resultado ---- */
  if(passo===99 && ramo){
    const R = RAMOS[ramo];
    const f = resp.falha ? FALHAS[resp.falha] : null;
    return html`<div className="pilha">
      <button className="bt fant" onClick=${reiniciar}><${Ico} k="volta"/>Voltar à lista</button>
      <div className="res">
        <div className=${"res-cab " + R.cor}>
          <p className="et">Ramo ${ramo}</p>
          <h3>${R.t}</h3>
          <p style=${{fontSize:".84rem",marginTop:".35rem",opacity:.9}}>${R.custo}</p>
        </div>
        <div className="res-corpo">
          <div className="res-bl"><b>O que isso significa</b><p>${R.r}</p></div>
          ${f && html`<div className="res-bl"><b>Falha identificada · ${f.n}</b><p><strong>${f.s}</strong><br/>${f.r}</p></div>`}
          <div className="res-bl"><b>Onde agir</b><p>${R.onde}</p></div>
          <div className="res-bl"><b>O que não fazer</b><p>${R.nao}</p></div>
          <div className="res-bl"><b>Primeira ação</b><p>${R.primeiro}</p></div>
          <div className="linha" style=${{gap:".5rem",flexWrap:"wrap",marginTop:".2rem"}}>
            <button className="bt" onClick=${criarReparo}><${Ico} k="mais"/>Criar tarefa no calendário</button>
            <button className="bt sec" onClick=${salvar}>Só salvar</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ---- assistente ---- */
  const perguntas = [
    { et:"Passo 1 de 3", q:"Nas rodadas em que a IA buscou na internet, a sua marca apareceu na resposta?",
      d:"Considere só as perguntas de descoberta — aquelas em que o cliente não diz o seu nome.",
      ops:[
        {v:"varias", t:"Apareceu em várias rodadas", s:"Em 3 ou mais das 7 repetições.", vai:null, campo:"apareceu"},
        {v:"poucas", t:"Apareceu em 1 ou 2", s:"Aparece, mas raramente ou por último.", vai:null, campo:"apareceu"},
        {v:"nao",    t:"Não apareceu nenhuma vez", s:"Zero em 7 repetições.", vai:1, campo:"apareceu"}
      ]},
    { et:"Passo 2 de 3", q:"O seu site apareceu na lista de fontes citadas?",
      d:"Abra a resposta e olhe os links que a IA cita no rodapé ou ao lado do texto — mesmo que ela não tenha falado da sua marca.",
      ops:[
        {v:"sim", t:"Sim, o meu domínio está entre as fontes", s:"A IA leu o seu site e ainda assim não te indicou.", vai:2, campo:"fonte"},
        {v:"nao", t:"Não, meu domínio não aparece em nenhuma", s:"A IA nem chegou a considerar o seu site.", vai:null, campo:"fonte"}
      ]},
    { et:"Passo 3 de 3", q:"Qual destes sintomas você reconhece na sua página?",
      d:"Compare a sua página com as dos concorrentes que a IA citou. A diferença costuma ser óbvia quando se olha lado a lado.",
      ops:Object.entries(FALHAS).map(([k,v])=>({v:k, t:v.n, s:v.s, vai:null, campo:"falha"}))}
  ];
  const P = perguntas[passo] || perguntas[0];

  return html`<div className="pilha">
    <button className="bt fant" onClick=${()=> passo===0 ? reiniciar() : setPasso(passo-1)}>
      <${Ico} k="volta"/>${passo===0 ? "Voltar à lista" : "Passo anterior"}</button>
    <div className="dg">
      <div className="dg-topo">
        <div className="dg-passos">
          ${[0,1,2].map(i=>html`<i key=${i} className=${i<idxPasso?"done":i===idxPasso?"on":""}></i>`)}
        </div>
        <p className="dg-etq">${P.et}</p>
        <p style=${{fontSize:".84rem",marginTop:".3rem",color:"#B9CFC1",lineHeight:1.45}}>${pergunta ? "“"+pergunta.texto+"”" : ""}</p>
      </div>
      <div className="dg-q"><h3>${P.q}</h3><p>${P.d}</p></div>
      <div className="dg-ops">
        ${P.ops.map(o=>html`<button key=${o.v} className="op" onClick=${()=>responder(o.campo,o.v,o.vai)}>
          <span><b>${o.t}</b><span>${o.s}</span></span><${Ico} k="chevDir"/></button>`)}
      </div>
      <div className="dg-pe">
        <${Ico} k="info"/>

function TelaAjustes({estado, acoes, avisar}){
  const p = estado.perfil || {};
  const [f,setF] = useState({ negocio:p.negocio||"", cidade:p.cidade||"", categoria:p.categoria||"",
    site:p.site||"", concorrentes:(p.concorrentes||[]).join(", "), inicio:p.inicio||HOJE_ISO() });
  const [cod,setCod] = useState("");
  const refArq = useRef(null);
  const [tema,setTema] = useState(()=>lerLocal("metodo90.tema")||"auto");

  useEffect(()=>{
    if(tema==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",tema);
    gravarLocal("metodo90.tema",tema);
  },[tema]);

  function salvarPerfil(){
    if(!f.negocio.trim()){ avisar("Dê um nome ao negócio."); return; }
    acoes.mudar(()=>({ perfil:{ ...f, negocio:f.negocio.trim(),
      concorrentes:f.concorrentes.split(",").map(s=>s.trim()).filter(Boolean) } }));
    avisar("Programa configurado. Comece pela carteira de perguntas.");
  }
  async function exportar(){
    const nome = "metodo90-" + (estado.ws||"dados") + ".json";
    const dados = JSON.stringify(estado, null, 2);
    try{
      const d = await window.claude?.use?.("downloads");
      if(d){ await d.save({ filename:nome, data:dados }); return; }
    }catch(e){ if(e && e.code === "declined") return; }
    try{
      const url = URL.createObjectURL(new Blob([dados], {type:"application/json"}));
      const a = document.createElement("a");
      a.href = url; a.download = nome; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(e){ avisar("Não consegui salvar o arquivo."); }
  }

  return html`<div className="pilha">
    <div><h1 className="h-tela">Ajustes</h1></div>

    <div className="cartao cartao-p pilha-s">
      <p className="sec-t">O seu negócio</p>
      <label className="campo"><span>Nome do negócio</span>
        <input value=${f.negocio} onChange=${e=>setF({...f,negocio:e.target.value})} placeholder="Clínica Aurora"/></label>
      <div className="grade2">
        <label className="campo"><span>Categoria</span>
          <input value=${f.categoria} onChange=${e=>setF({...f,categoria:e.target.value})} placeholder="Clínica de estética"/></label>
        <label className="campo"><span>Cidade ou região</span>
          <input value=${f.cidade} onChange=${e=>setF({...f,cidade:e.target.value})} placeholder="Sorocaba, SP"/></label>
      </div>
      <label className="campo"><span>Site</span>
        <input value=${f.site} onChange=${e=>setF({...f,site:e.target.value})} placeholder="clinicaaurora.com.br"/></label>
      <label className="campo"><span>Concorrentes a medir nas mesmas perguntas</span>
        <input value=${f.concorrentes} onChange=${e=>setF({...f,concorrentes:e.target.value})} placeholder="Separe por vírgula"/></label>
      <label className="campo"><span>Início do programa de 90 dias</span>
        <input type="date" value=${f.inicio} onChange=${e=>setF({...f,inicio:e.target.value})}/></label>
      <button className="bt larg" onClick=${salvarPerfil}>${estado.perfil?"Salvar alterações":"Criar o programa"}</button>
      ${estado.perfil && f.inicio!==estado.perfil.inicio && html`<p className="mini">
        Mudar a data de início desloca todo o calendário. As medições já registradas continuam nas datas reais.</p>`}
    </div>

    <div className="cartao cartao-p pilha-s">
      <p className="sec-t">Aparência</p>
      <div className="motores">
        ${[["auto","Automático"],["light","Claro"],["dark","Escuro"]].map(([v,n])=>html`
          <button key=${v} className="mot" aria-pressed=${tema===v} onClick=${()=>setTema(v)}>${n}</button>`)}
      </div>
    </div>

    <div className="cartao cartao-p pilha-s">
      <p className="sec-t">Os seus dados</p>
      <p className="mini">Tudo fica <b>neste navegador</b>, neste aparelho. Nada é enviado para lugar nenhum.
        Para levar o programa para outro aparelho, baixe o arquivo e carregue lá.</p>
      <div className="linha" style=${{gap:".5rem"}}>
        <b className="num" style=${{fontSize:"1.3rem",letterSpacing:".08em"}}>${estado.ws}</b>
        ${sincAtivo ? html`<span className="chip ok">sincronizando via ${SINC.nome}</span>`
                    : html`<span className="chip">só neste aparelho</span>`}
      </div>
      <div className="linha" style=${{gap:".5rem",flexWrap:"wrap"}}>
        <button className="bt sec" onClick=${exportar}><${Ico} k="baixar"/>Baixar backup</button>
        <button className="bt sec" onClick=${()=>refArq.current?.click()}>Carregar backup</button>
        <input ref=${refArq} type="file" accept="application/json,.json" style=${{display:"none"}}
          onChange=${async e=>{
            const f = e.target.files && e.target.files[0]; e.target.value="";
            if(!f) return;
            if(!confirm("Carregar este backup substitui tudo o que está neste aparelho. Continuar?")) return;
            const r = importarEstado(await f.text());
            avisar(r.ok ? "Backup carregado." : r.erro);
          }}/>
      </div>

      <div style=${{borderTop:"1px solid var(--linha-2)",paddingTop:".8rem",marginTop:".2rem"}}>
        <p className="mini" style=${{marginBottom:".5rem"}}>Se você ligou a sincronização em nuvem no código do app,
          digite aqui o código do outro aparelho para puxar aquele programa.</p>
        <div className="linha" style=${{gap:".5rem",flexWrap:"wrap"}}>
          <input className="num" value=${cod} onChange=${e=>setCod(e.target.value.toUpperCase())}
            placeholder="Código de outro aparelho" style=${{flex:"1 1 11rem",minHeight:"46px",padding:".55rem .7rem",
            border:"1px solid var(--linha)",borderRadius:"var(--r-s)",background:"var(--carta)",letterSpacing:".08em"}}/>
          <button className="bt sec" onClick=${async()=>{
            const r = await trocarWorkspace(cod);
            avisar(r.ok ? (r.remoto ? "Espaço carregado da nuvem." : (r.temDados ? "Espaço carregado." : "Espaço novo criado.")) : r.erro);
            setCod("");
          }} disabled=${!cod.trim()}>Trocar espaço</button>
        </div>
      </div>

      <button className="bt fant" onClick=${()=>{
        if(confirm("Apagar tudo deste espaço e recomeçar? Não dá para desfazer.")){
          acoes.zerar(); avisar("Tudo apagado.");
        }
      }}>Apagar tudo e recomeçar</button>
    </div>
  </div>`;
}

  const abertosHoje = dp ? itensDoDia(estado, HOJE_ISO()).itens.filter(i=>!i.feito).length : 0;

  const tela = aba==="hoje" ? html`<${TelaHoje} estado=${estado} acoes=${acoes} irPara=${irPara}/>`
    : aba==="cal" ? html`<${TelaCalendario} estado=${estado} acoes=${acoes} irPara=${irPara}/>`
    : aba==="carteira" ? html`<${TelaCarteira} estado=${estado} acoes=${acoes} avisar=${avisar}/>`
    : aba==="medir" ? html`<${TelaMedir} estado=${estado} acoes=${acoes} avisar=${avisar} irPara=${irPara}/>`
    : aba==="diag" ? html`<${TelaDiag} estado=${estado} acoes=${acoes} avisar=${avisar} irPara=${irPara}/>`
    : aba==="ajustes" ? html`<${TelaAjustes} estado=${estado} acoes=${acoes} avisar=${avisar}/>`
    : html`<${TelaMetodo}/>`;

  return html`
    <div className="app">
      <header className="topo">
        <div className="topo-marca">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="6" fill="var(--pinho)"/>
            <path d="M6 8h12l-8 8h8" stroke="var(--folha)" strokeWidth="2" fill="none"
              strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <div style=${{minWidth:0}}>
            <p className="topo-t">Método 90 Dias</p>
            <p className="topo-sub">${estado.perfil ? (dp ? "dia "+dp+" de 90" : "programa fora da janela") : "não configurado"}</p>
          </div>
        </div>
        <div className="topo-dir">
          <button className=${"icb" + (aba==="carteira"?" ativo":"")} onClick=${()=>irPara("carteira")}
            aria-label="Carteira de perguntas"><${Ico} k="pino"/></button>
          <button className="icb" onClick=${()=>irPara("ajustes")} aria-label="Ajustes"><${Ico} k="eng"/></button>
        </div>
      </header>

      <nav className="abas" aria-label="Seções">
        ${ABAS.map(a=>html`<button key=${a.id} className="aba" aria-current=${aba===a.id?"page":undefined}
          onClick=${()=>irPara(a.id)}>
          <${Ico} k=${a.ic}/><span>${a.n}</span>
          ${a.id==="hoje" && abertosHoje>0 && html`<span className="aba-pip num">${abertosHoje}</span>`}
        </button>`)}
      </nav>

      <div className="quadro"><main className="corpo">${tela}</main></div>

      ${dia && html`<${FolhaDia} iso=${dia} estado=${estado} acoes=${{...acoes, abrirItem:setItem}} fechar=${()=>setDia(null)}/>`}
      ${item && html`<${FolhaItem} item=${item} estado=${estado} acoes=${acoes}
        fechar=${()=>setItem(null)} irPara=${irPara}/>`}
      ${toast && html`<div className="toast" role="status">${toast}</div>`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById("raiz")).render(html`<${App}/>`);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
